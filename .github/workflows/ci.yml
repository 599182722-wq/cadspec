name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 测试
        run: pytest tests -q

      - name: 知识库自检
        run: cadspec kb verify

      - name: 打包后数据仍在（发布前最容易漏的一条）
        run: |
          pip install . --force-reinstall --no-deps
          cd ${{ runner.temp }}
          cadspec kb verify

      - name: 条文体检
        run: python scripts/check_clauses.py data/kb/gb55037-2022.yaml

      - name: 文档体检（表格列数、代码块闭合、相对链接）
        run: python scripts/check_md.py
