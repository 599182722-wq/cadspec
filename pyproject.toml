[project]
name = "cadspec"
version = "0.1.0"
description = "中国建筑规范知识库 + DXF 图纸合规审查"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "599182722-wq" }]
keywords = ["cad", "dxf", "building-code", "china", "architecture", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ezdxf>=1.3",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/599182722-wq/cadspec"
Repository = "https://github.com/599182722-wq/cadspec"
Issues = "https://github.com/599182722-wq/cadspec/issues"

[project.scripts]
cadspec = "cadspec.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# 只有需要从 PDF 录条文时才装：scripts/ingest_pdf.py 依赖它
ingest = ["pymupdf>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadspec"]
# 条文 / 规则 / 附表随包分发，否则装完 cadspec kb list 是空的
[tool.hatch.build.targets.wheel.force-include]
"data" = "cadspec/_data"

[tool.hatch.build.targets.sdist]
include = [
    "src/cadspec",
    "data",
    "tests",
    "docs",
    "skills",
    "README.md",
    "LICENSE",
]
