[project]
name = "cadspec"
version = "0.1.0"
description = "中国建筑制图规范知识库 + CAD 图纸合规审查"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.3",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[project.scripts]
cadspec = "cadspec.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# 只有需要从 PDF 录条文时才装：scripts/ingest_pdf.py 依赖它
ingest = ["pymupdf>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadspec"]
# 条文 / 规则 / 附表随包分发，否则装完 cadspec kb list 是空的
[tool.hatch.build.targets.wheel.force-include]
"data" = "cadspec/_data"

[tool.hatch.build.targets.sdist]
include = [
    "src/cadspec",
    "data",
    "tests",
    "docs",
    "skills",
    "README.md",
    "LICENSE",
]
