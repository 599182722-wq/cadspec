# 依据 GB 55037-2022《建筑防火通用规范》7.1.2 的可执行规则
#
# 这一组只有一条，但它和前面几组性质不同：它查的是「缺画」，不是「画错」。
#
# 已经画出来的东西，几何算法能验；没画出来的，几何算法看不见——
# polygonize 只围得出有墙的地方，画漏的墙、没开的门，它一律当作不存在。
# 所以要查「缺了什么」，只能反着做：先假定该有，再看有没有。
#
# 这条规则的由来：一张住宅平面图跑完所有规则，0 条 error，看着干净；
# 但整张图外轮廓上没有一个门洞，11 处门全在房间之间——人一眼能看出问题，
# 规则库却是全绿的。全绿比报错更危险。

version: 1

rules:
  - rule_id: R-OPEN-003
    title: 外轮廓上没有门洞
    severity: error
    check: no_exterior_door
    params:
      edge_tolerance_mm: 150
    cite: GB55037-2022/7.1.2
    rationale: >-
      7.1.2 要求「房间疏散门应直接通向安全出口」。一套住宅的门如果全部开在房间之间，
      外墙上只有窗，那就没有任何一个门通向公共楼梯间或室外，疏散路径不成立。
      这条判的是图纸完整性而非尺寸——门可能只是没画，不一定是设计错了。
    note: >-
      误报的三种可能：①门画成了块（INSERT）且块不在门窗图层；
      ②门画在别的图层；③外轮廓被识别成了内墙线（图层名不符合约定）。
      报告里会列出被检出的全部门洞位置，对照一下就能分辨是哪种。
      只对 --level strict 生效——basic 档不做几何识别，无从判起。
