# 依据《建筑工程设计文件编制深度规定》（2016年版）的可执行规则
#
# 这一组规则查的是"图纸画得够不够深"，与 GB/T 50001 那组"画得对不对"互补：
#   - GB/T 50001：字高够不够、轴号方向对不对、图层命名乱不乱
#   - 深度规定：该有的内容有没有出现
#
# 深度规定的条文多为列举式（"平面图。1 ……；2 ……"），没有"应/宜"用词，
# 所以本文件的 severity 不抄 severity_hint，而是按施工图审查的实际后果定级：
# 缺了会被退图的给 error，只能说"建议补"的给 warning。

version: 1

rules:
  - rule_id: R-DIM-001
    title: 图纸完全没有任何尺寸标注
    severity: error
    check: no_dimension_entities
    params: {}
    cite: SJD-2016/4.3.4-1
    rationale: >-
      4.3.4 第 1 款要求平面图标注轴线总尺寸（或外包总尺寸）、轴线间尺寸、
      门窗洞口尺寸、分段尺寸。图中 DIMENSION 实体为 0，意味着没有任何一处尺寸
      是由 CAD 标注对象承载的，施工方无法从中读出定位关系。
    note: >-
      检测手段只数 DIMENSION 实体。若用 LINE + TEXT 手工拼出尺寸线，本规则会误报，
      报告里已注明"请人工确认"。反向的漏检（有标注但标错了）不在本规则范围内。

  - rule_id: R-DIM-002
    title: 图纸未注比例
    severity: warning
    check: drawing_scale_missing
    params:
      pattern: '1\s*[:：∶]\s*\d+'
    cite: SJD-2016/4.3.4-20
    rationale: >-
      4.3.4 第 20 款要求注明图纸名称、比例。比例不只是格式项：字高、线宽、
      轴号圆直径的合规判定全部以出图比例为基准，比例缺失时其余几何结论都只能
      依赖命令行传入的 --scale 假设值。
    note: >-
      只做文字匹配。比例若写在布局视口、标题栏属性块或外部参照里，会误报为缺失；
      反之，模型里留着一句"1:100"但实际按 1:200 出图，本规则查不出来。

  - rule_id: R-DIM-003
    title: 尺寸标注数量过少
    severity: warning
    check: dimension_entities_under_count
    params:
      min_count: 3
    cite: SJD-2016/4.3.4-1
    rationale: >-
      4.3.4 第 1 款列的是四类尺寸：轴线总尺寸（或外包总尺寸）、轴线间尺寸
      （柱距、跨度）、门窗洞口尺寸、分段尺寸。它们各自成组，不是"有一个就算数"。
      一两条标注通常只覆盖了其中一类，缺的几类施工方只能自己量。
    note: >-
      min_count 取 3 是经验阈值，不是条文数字——条文只说要有这几类，没给数量。
      改这个值只改本文件，不必动代码。检测手段只数 DIMENSION 实体，
      LINE + TEXT 手工拼的尺寸会漏检。

  - rule_id: R-SCALE-001
    title: 图面比例与计算比例不一致
    severity: error
    check: drawing_scale_consistency
    params:
      pattern: '1\s*[:：∶]\s*(\d{1,4})'
    cite: SJD-2016/4.3.4-20
    rationale: >-
      4.3.4 第 20 款要求注明图纸名称、比例。比例一旦写错，整套打印尺寸换算就错位：
      按 1:100 算的字高、线宽、轴号圆直径，在 1:50 的图上要全部重算。
      这种错误不会自己暴露，只会在打印出来之后被发现。
    note: >-
      只比对图面文字里的比例与命令行 --scale。两边一致不代表真实出图比例正确
      （图纸可能整体放大过却没有改文字），这种情况本规则无法识别。

  - rule_id: R-LAYER-003
    title: 定义了却没有任何实体的图层
    severity: warning
    check: layer_declared_but_empty
    params:
      ignore: ['0', 'Defpoints']
    cite: GBT50001-2017/13.0.1
    rationale: >-
      13.0.1 第 1 款要求图层按用途、设计阶段、专业属性、使用对象组织，
      工程上应有明确的逻辑关系。一个定义了却不装任何实体的图层，说明图层体系
      与实际画图脱节——多半是模板残留或改图后忘了清理，会让接手的人和 AI
      误判这张图还有哪些内容。
    note: >-
      只统计模型空间。图层若只用在布局、块定义或外部参照里，本规则会误报。
      第 1 款用"宜"，所以定 warning 而不是 error。
