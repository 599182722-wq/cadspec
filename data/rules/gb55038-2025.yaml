# 依据 GB 55038-2025《住宅项目规范》4.1 套内空间的可执行规则
#
# 这一组与前面三组的分工：
#   - GB/T 50001：画得对不对（字高、轴号、线宽、图层）
#   - 深度规定：该有的有没有（尺寸、比例、标高）
#   - GB 55038：尺度够不够（房间多小算不合格、门多窄算不合格）
#
# 前两组只看图纸的"表达"，这一组第一次看图纸的"实体"——房间多大、多窄。
# 能这么做的原因是在 geometry.py 里把墙线围成了多边形，又从图内文字读出了用途。
# 代价是：图上没写房间名字、或者墙线不是 MLINE，这几条规则就不参与判定。
#
# severity 一律取条文用词：GB 55038 全部是"不应小于"，所以这里没有 warning。

version: 1

rules:
  - rule_id: R-ROOM-001
    title: 卧室使用面积不足 5m²
    severity: error
    check: room_area_below
    params:
      purpose: 卧室
      min_area_m2: 5.0
    cite: GB55038-2025/4.1.1
    rationale: >-
      4.1.1 第 1 款：卧室使用面积不应小于 5m²。这是成套住宅里最低的一档，
      出租型小户型最容易踩。低于这个数不是"小"，是这个房间不能作为卧室使用。
    note: >-
      房间用途取自图内文字（卧室 / 主卧 / 次卧 / 儿童房 都归一为卧室）。
      图上没写名字的房间不参与判定，所以本规则漏检多于误报。
      面积是墙内表面围合的净面积，未扣柱与管道井。

  - rule_id: R-ROOM-002
    title: 卧室短边净宽不足 1.80m
    severity: error
    check: room_short_side_below
    params:
      purpose: 卧室
      min_side_mm: 1800.0
    cite: GB55038-2025/4.1.1
    rationale: >-
      4.1.1 第 3 款：卧室短边净宽不应小于 1.80m。面积达标而短边不足的卧室
      放不下标准床具，这条约束的是形状而不是大小，所以与 R-ROOM-001 不能互相替代。
    note: >-
      短边取房间最小外接矩形的短边。L 形、异形房间按外接矩形算会低估实际最窄处，
      这类房间报告会同时给出面积，需人工复核。

  - rule_id: R-ROOM-003
    title: 兼起居室的卧室使用面积不足 9m²
    severity: error
    check: room_area_below
    params:
      purpose: 兼起居室卧室
      min_area_m2: 9.0
    cite: GB55038-2025/4.1.1
    rationale: >-
      4.1.1 第 2 款：兼起居室的卧室使用面积不应小于 9m²。一个房间同时承担
      睡眠与会客两种功能，5m² 的卧室下限不再适用，闸值提高到 9m²。
    note: >-
      只有当图上明确标了"兼起居室"一类名字时才会命中。如果图上只写"卧室"
      而实际兼作起居室，本规则无法识别——这属于图纸表达缺失，不是检测缺陷。

  - rule_id: R-ROOM-004
    title: 厨房使用面积不足 3.5m²
    severity: error
    check: room_area_below
    params:
      purpose: 厨房
      min_area_m2: 3.5
    cite: GB55038-2025/4.1.4
    rationale: >-
      4.1.4：厨房的使用面积不应小于 3.5m²，这一条没有"宜"、没有例外情形，
      是硬下限。
    note: >-
      厨房用途取自图内文字。开放式厨房若未单独围合出多边形（与餐厅连通），
      本规则不命中——此时面积算给了整个连通空间，判定无意义。

  - rule_id: R-OPEN-001
    title: 门窗未区分，无法核对门洞净宽
    severity: warning
    check: opening_kind_unknown
    params:
      max_unknown: 0
    cite: GB55038-2025/4.1.14
    rationale: >-
      4.1.14 要按门的使用位置分档核对：户门 0.90m、卧室门 0.80m、厨卫门 0.70m。
      要核这个，先得知道哪个洞是门。图上区分不了门窗时，这档要求就无法核，
      属于图面表达不足，不是设计错误，所以给 warning 而不是 error。
    note: >-
      区分门窗靠图层名、多线样式名、块名、门扇弧线、编号文字五类线索。
      「门窗」这种合并命名的图层不算线索——两头都含等于没说。
      宽度不给结论：900mm 常见于户门也见于小窗，用它定性会出错。

  - rule_id: R-OPEN-002
    title: 门洞宽度小于下限
    severity: error
    check: door_width_below
    params:
      min_width_mm: 740
      frame_allowance_mm: 40
    cite: GB55038-2025/4.1.14
    rationale: >-
      4.1.14 的最低一档是厨卫门「通行净宽」0.70m，原文用的是通行净宽不是洞宽。
      洞口 700mm 扣掉两侧门框各 20mm，净宽只剩 660mm，不满足。所以要 700+40=740mm。
      本规则只按最低档判，因为图上通常看不出每个门属于哪一档（户门/卧室门/厨卫门）；
      分档判需要先知道门通向哪个房间，那是下一步的事。
    note: >-
      740mm 是把「通行净宽」折算成「洞口宽」的结果，不是条文里的原数。
      门框厚度各家做法不一（每边 20~40mm），这里按每边 20mm 估；
      门框更厚的，实际需要的洞口还要更大。

  - rule_id: R-OPEN-004
    title: 卧室门通行净宽不足 0.80m
    severity: error
    check: door_width_below_for_room
    params:
      purpose: 卧室
      min_net_width_mm: 800
      frame_allowance_mm: 40
    cite: GB55038-2025/4.1.14
    rationale: >-
      4.1.14 分了三档：户门 0.90m、卧室门 0.80m、厨卫门 0.70m。
      统一按最低档 0.70m 判，会把 0.75m 的卧室门放过——通行净宽差 5cm，
      搬家具和轮椅通行是两回事。
      分档判需要先知道这扇门通向哪个房间，靠 geometry 的相邻关系（neighbors）拿。
    note: >-
      只有房间标了「卧室」才有这条规则可判。图上没标名字的房间不参与，
      所以这条命中率取决于标注完整度，不是规范覆盖度。
      门槛 840mm = 0.80m 净宽 + 40mm 门框，同 R-OPEN-002 的折算逻辑。

  - rule_id: R-OPEN-005
    title: 户门通行净宽不足 0.90m
    severity: error
    check: entrance_door_width_below
    params:
      min_net_width_mm: 900
      frame_allowance_mm: 40
      edge_tolerance_mm: 150
    cite: GB55038-2025/4.1.14
    rationale: >-
      4.1.14 对户门的要求是三档里最高的 0.90m，因为要过家具、担架和轮椅。
      新建设住宅取 0.90m；条文对既有住宅改造放宽到 0.80m，本库按新建判。
      户门靠几何认：门洞中点落在外轮廓（所有房间多边形的并集边界）上就算。
    note: >-
      判断依赖「外轮廓 = 房间并集」这个前提。图里少画一间房、或者有个房间
      没被围合，外轮廓就会缩进去，内墙上的门可能被误认成户门。
      与 R-OPEN-003（外轮廓上没有门洞）互补，两条不会同时报同一件事。

  - rule_id: R-ROOM-005
    title: 卫生间使用面积不足 2.5m²
    severity: error
    check: room_area_below
    params:
      purpose: 卫生间
      min_area_m2: 2.5
    cite: GB55038-2025/4.1.6
    rationale: >-
      4.1.6 的 2.5m² 有个前提条件：「便器、洗浴器和洗面器集中配置的卫生间」。
      也就是说分开布置的卫生间不受这个数约束，本规则无法区分集中还是分散，
      所以按最宽松的假设判——只要标了卫生间且小于 2.5m² 就报。
      这个方向的误差是可能漏报，不会误报。
    note: >-
      图上标「卫生间」的房间才参与判定。4.1.6 同时要求每套至少配三件
      卫生器具，那属于设施配置，DXF 里看不出来，不在此列。
