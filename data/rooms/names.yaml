# 房间用途：把图上写的名字归一成规范里用的类别
#
# 为什么需要这张表：规范说的是「卧室」「起居室」，图上写的是「主卧」「客厅」「次卧」，
# 还有写拼音缩写或者干脆写编号的。判定规则要认的是规范用词，所以中间得有一层归一。
#
# 匹配规则：**长词优先**。「兼起居室」必须先于「起居室」匹配，否则「兼起居室」
# 会被认成普通起居室，而这两者的面积要求是 9㎡ 和「没有下限」的区别。
#
# 一个房间只认一个类别。图上一格写了两个字（如「卧室/书房」）按第一个算，
# 并在 note 里提醒——宁可少判，不要两种解释都认。

purposes:
  兼起居室:
    aliases: [兼起居室, 卧室兼起居室, 起居兼卧室]
    clause: GB55038-2025/4.1.1
    note: 面积下限 9㎡，比普通卧室高，所以必须先于「卧室」「起居室」匹配。

  卧室:
    aliases: [卧室, 主卧室, 主卧, 次卧, 客卧, 小卧, 卧房, 寝室, 儿童房, 老人房, 保姆房]
    clause: GB55038-2025/4.1.1
    note: 使用面积不小于 5㎡，短边净宽不小于 1.80m。

  起居室:
    aliases: [起居室, 客厅, 餐厅, 客餐厅, 起居, 客饭厅, 厅]
    clause: GB55038-2025/4.1.1

  厨房:
    aliases: [厨房, 厨房间, 灶间, 烹调间]
    clause: GB55038-2025/4.1.4
    note: 使用面积不小于 3.5㎡，这条没有前置条件，可以直接判。

  卫生间:
    aliases: [卫生间, 厕所, 洗手间, 卫浴, 浴室, 淋浴间, 盥洗室]
    clause: GB55038-2025/4.1.6
    note: >-
      4.1.6 只对「三件集中配置」的卫生间要求不小于 2.5㎡，普通卫生间没有面积下限。
      「三件集中配置」要看图上的洁具布置，不是看名字，所以这条暂不挂规则。

  阳台:
    aliases: [阳台, 生活阳台, 服务阳台, 封闭阳台, 露台]
    clause: ""

  过道:
    aliases: [过道, 走廊, 走道, 通道, 内走道]
    clause: GB55038-2025/4.1.13
    note: 净宽分三档 1.10 / 1.00 / 0.90，取决于过道通向哪里，需要看两端连接，暂不挂规则。

  门厅:
    aliases: [门厅, 玄关, 入口, 入户花园]
    clause: ""

  书房:
    aliases: [书房, 工作间, 工作室]
    clause: ""

  贮藏室:
    aliases: [贮藏室, 储藏室, 储物间, 衣帽间, 杂物间]
    clause: ""
