# 规范附表：从图片转录的结构化数据
#
# 为什么单独放一个文件：
# 规范里的表格在官方 PDF 和 HTML 里都是图片，条文正文只写「应符合表 X 的规定」。
# 不把表里的数值取出来，那条条文对 agent 就是一句空话——它知道要查表，但没表可查。
# 这些数值不塞回 data/kb/*.yaml，是因为 kb 里的条文要保持与原文逐字一致，
# 表格是另一个维度：同一张表会被多条条文引用，也要能单独被规则查询。
#
# 转录约定：
#   - 只转录数值关系，不复制表格的版式；
#   - 表头照录，行列顺序不变；
#   - image_url 指向规范原文里的表格图片，便于人工复核；
#   - 拿不准的单元格写 null 并加 note，不猜。

standard: GB55031-2022
standard_name: 民用建筑通用规范
source_note: >-
  表格原文在规范中为图片。本文件按图片逐格转录，数值以正式出版版本为准；
  image_url 保留原文图片地址，任何一条都能回查。
tables:
  - table_id: 表5.3.9
    title: 楼梯踏步最小宽度和最大高度（m）
    clause: GB55031-2022/5.3.9
    header: [楼梯类别, 最小宽度, 最大高度]
    rows:
      - ["以楼梯作为主要垂直交通的公共建筑、非住宅类居住建筑的楼梯", "0.26", "0.165"]
      - ["住宅建筑公共楼梯、以电梯作为主要垂直交通的多层公共建筑和高层建筑裙房的楼梯", "0.26", "0.175"]
      - ["以电梯作为主要垂直交通的高层和超高层建筑楼梯", "0.25", "0.180"]
    image_url: https://gf.cabr-fire.com/Web/uploads/allimg/1H93940A.jpg
    note: >-
      查表前要先判断楼梯属于哪一类，类别取决于「这栋楼的主要垂直交通是楼梯还是电梯」。
      住宅公共楼梯的最大高度是 0.175 而不是 0.165，这一行的差别最容易套错。

  - table_id: 表5.6.4
    title: 公共厕所（卫生间）隔间的平面最小净尺寸
    clause: GB55031-2022/5.6.4
    header: [类别, 平面最小净尺寸]
    rows:
      - ["外开门的隔间", "0.90×1.30（坐便）、0.90×1.20（蹲便）"]
      - ["内开门的隔间", "0.90×1.50（坐便）、0.90×1.40（蹲便）"]
    image_url: https://gf.cabr-fire.com/Web/uploads/allimg/230224/1HU53409-0.jpg
    note: >-
      净宽度一律 0.90m，差别全在净深度：门往外开时蹲位 1.20、坐位 1.30；
      门往里开时各加 0.20m。画图时门扇开向决定取哪一行。
      另注：条文 5.6.4 正文写的是「表 5.6.1」，而表标题是「表 5.6.4」，
      原文编号不一致（网页与纸本均如此），不影响取值。
