# 规范附表：从图片转录的结构化数据
# 格式与转录约定见 data/tables/gb55031-2022.yaml 顶部说明。

standard: GB/T 50001-2017
standard_name: 房屋建筑制图统一标准
source_note: >-
  表 4.0.1 在规范中为图片。本文件按图片逐格转录，
  image_url 保留原文图片地址。
tables:
  - table_id: 表4.0.1
    title: 线宽组（mm）
    clause: GBT50001-2017/4.0.1
    header: [线宽比, 组一, 组二, 组三, 组四]
    rows:
      - ["b", "1.4", "1.0", "0.7", "0.5"]
      - ["0.7b", "1.0", "0.7", "0.5", "0.35"]
      - ["0.5b", "0.7", "0.5", "0.35", "0.25"]
      - ["0.25b", "0.35", "0.25", "0.18", "0.13"]
    image_url: https://gf.cabr-fire.com/Web/uploads/allimg/230106/164149C21-0.jpg
    note: >-
      这张表要先选一列，不是先选一个数。选定基本线宽 b（1.4 / 1.0 / 0.7 / 0.5 之一），
      该列剩下的三个数就是这张图能用的全部线宽——粗线用 b，中粗用 0.7b，
      中线用 0.5b，细线用 0.25b。
      条文说明特别澄清过：0.35、0.25、0.18、0.13 不再作为 b 使用，
      但它们仍作为细线出现在组里，所以「0.25 是不是合法线宽」要分情况回答——
      作为 b 不行，作为 0.25b 可以。
      全部线宽指的都是打印到纸上的宽度，不是模型空间里的像素宽度。
