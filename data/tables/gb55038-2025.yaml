# 规范附表：从图片转录的结构化数据
# 格式与转录约定见 data/tables/gb55031-2022.yaml 顶部说明。

standard: GB55038-2025
standard_name: 住宅项目规范
source_note: >-
  表格原文在规范中为图片。本文件按图片逐格转录，image_url 保留原文图片地址，
  任何一条都能回查。
tables:
  - table_id: 表3.1.2
    title: 住宅建筑日照标准
    clause: GB55038-2025/3.1.2
    header: [项目, I、II、III、VII 气候区 ≥50 万人, 同区 <50 万人, IV 气候区 ≥50 万人, 同区 <50 万人, V、VI 气候区]
    rows:
      - ["日照标准日", "大寒日", "大寒日", "冬至日", "冬至日", "冬至日"]
      - ["日照时数（h）", "≥2", "≥3", "≥1", "≥1", "≥1"]
      - ["有效日照时间带（当地真太阳时）", "8 时～16 时", "8 时～16 时", "9 时～15 时", "9 时～15 时", "9 时～15 时"]
    image_url: https://gf.cabr-fire.com/Web/uploads/allimg/250401/10-250401104012P0.jpg
    note: >-
      先查项目所在气候区，再查常住人口规模，两样都定了才确定标准日和时数。
      I/II/III/VII 区走大寒日，≥50 万人的城市要 ≥2h、<50 万人的城镇要 ≥3h——
      小城市的要求反而高 1 小时，这一点与直觉相反，容易套错。
      IV 区（长江中下游一带）和 V/VI 区（华南）走冬至日，一律 ≥1h。
      计算起点是底层窗台面，即距室内地坪 0.9m 高的外墙位置，不是地面。
      3.1.2 还规定旧区改建项目日照标准不应低于大寒日 1h，那是一条单列的底线。

  - table_id: 表3.2.6
    title: 住宅建筑外墙面至道路边缘的最小距离
    clause: GB55038-2025/3.2.6
    header: [建筑与道路的关系, 城镇道路（m）, 附属道路（m）]
    rows:
      - ["建筑物面向道路无公共出入口", "3.0", "2.0"]
      - ["建筑物面向道路有公共出入口", "5.0", "2.5"]
      - ["建筑物山墙面向道路", "2.0", "1.5"]
    image_url: https://gf.cabr-fire.com/Web/uploads/allimg/250401/10-250401104531P8.jpg
    note: >-
      按建筑立面与道路的朝向关系选行，六个数里最容易漏的是「山墙」那一行。
      两个「边缘」定义不同：城镇道路的边缘指道路红线，附属道路的边缘指路面边线。
      红线通常比路面宽，所以同一个数在两种道路上量出来的位置不一样，
      画总平面时不能把「3.0m」一律从路面边缘起算。
      适用前提是建筑高度大于 10m；不大于 10m 的情况不在本表范围内。
