# 规范附表：从图片转录的结构化数据
# 格式与转录约定见 data/tables/gb55031-2022.yaml 顶部说明。

standard: GB55037-2022
standard_name: 建筑防火通用规范
source_note: >-
  表格原文在规范 PDF 中为图片。本文件按 PDF 页面渲染后逐格转录，
  page 字段记录原始页码，可回查 .cache/gb55037.pdf。
tables:
  - table_id: 表7.4.1
    title: 仅设置 1 个安全出口或 1 部疏散楼梯的公共建筑
    clause: GB55037-2022/7.4.1
    page: 25
    header: [建筑的耐火等级或类型, 最多层数, 每层最大建筑面积, 人数]
    rows:
      - ["一、二级", "3 层", "200m²", "第二、三层的人数之和不大于 50 人"]
      - ["三级、木结构建筑", "3 层", "200m²", "第二、三层的人数之和不大于 25 人"]
      - ["四级", "2 层", "200m²", "第二层人数不大于 15 人"]
    note: >-
      这张表只回答一个问题：什么情况下允许只设 1 个安全出口。
      三个条件是**同时**满足，缺一不可。托儿所、幼儿园、医疗建筑、老年人照料设施、
      儿童活动场所、歌舞娱乐放映游艺场所被 7.4.1 第 2 款显式排除在外，
      不论面积人数多少都必须设 2 个出口。
      画图时最容易漏的是「最多层数」——3 层和 2 层的差别直接决定这栋楼能不能这么画。

  - table_id: 表7.4.7
    title: 疏散出口、疏散走道和疏散楼梯每 100 人所需最小疏散净宽度（m/100 人）
    clause: GB55037-2022/7.4.7
    page: 27
    header: [建筑层数或埋深, 一、二级, 三级、木结构建筑, 四级]
    rows:
      - ["地上 1 层～2 层", "0.65", "0.75", "1.00"]
      - ["地上 3 层", "0.75", "1.00", "—"]
      - ["地上 不小于 4 层", "1.00", "1.25", "—"]
      - ["地下、半地下 埋深不大于 10m", "0.75", "—", "—"]
      - ["地下、半地下 埋深大于 10m", "1.00", "—", "—"]
      - ["地下、半地下 歌舞娱乐放映游艺场所及其他人密集的房间", "1.00", "—", "—"]
    note: >-
      适用范围有边界：只用于剧场、电影院、礼堂、体育馆**以外**的公共建筑。
      那四类按 7.4.6 走另一套算法（每疏散门平均人数），套错表会算出完全不同的宽度。
      第四级一列在三层以上是「—」，表示不允许，不是「不用算」。
      首层外门的总净宽度要按人数最多的那一层算，不是按首层实际人数（第 2 款）。
      楼电梯间的疏散净宽要逐段累加：一条走廊上每个门洞都要满足它承担的疏散人数。
