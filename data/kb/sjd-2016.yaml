# 《建筑工程设计文件编制深度规定》（2016年版）
#
# 编号：建质函〔2016〕247号，住房和城乡建设部印发
# 性质：行政规范性文件，不是国家标准。它是施工图设计文件"深度"的直接依据，
#       也是施工图审查机构据以退图的主要理由之一。
# 与 GB/T 50001 的分工：50001 管"怎么画"（线宽、字高、轴号），
#       本规定管"画到什么程度"（该有的内容有没有）。
#
# 著作权：国家机关制定的具有行政性质的文件，依《中华人民共和国著作权法》
#       第五条不适用著作权法，可全文引用。仍标注来源以便核对版本。
#
# 版本核对说明：截至 2025 年，住建部未见替代 2016 年版的公告。网络上流传的
#       "2020 年版"未见于住建部官网或中国建筑工业出版社电子书库（后者在售的
#       仍是 2016 年版，建质函〔2016〕247号），故按 2016 年版录入。

version: 1

standard: SJD-2016
standard_name: 建筑工程设计文件编制深度规定
document_no: 建质函〔2016〕247号
status: effective
source_url: https://gf.cabr-fire.com/m/list-2311.htm
source_note: |
  条文转录自中国建筑科学研究院建筑防火研究所"消防规范网"分章全文（第三方转载，
  站点标注版本为 2016 年版），章节号与住建部印发版本一致。
  施工图审查等正式场合请以住建部官网或中国建筑工业出版社正式出版版本为准。

clauses:

  - clause_id: SJD-2016/4.3.1
    chapter: 4.3 建筑
    verbatim: |
      在施工图设计阶段，建筑专业设计文件应包括图纸目录、设计说明、设计图纸、计算书。
    interpret: |
      这是"深度规定"的总纲，用"应包括"。它把"图纸"列为交付物之一，
      意味着图纸必须承载可施工的信息量——不是"画得像"，而是"能照着建"。
      缺图纸目录、缺设计说明、缺计算书，在施工图审查中都会被打回，
      但那些是文件级检查，DXF 层面只能查图纸本身。
    severity_hint: error
    keywords: [施工图, 设计文件, 深度, 图纸目录, 设计说明, 计算书]
    machine:
      checkable: partial
      required_deliverables: [图纸目录, 设计说明, 设计图纸, 计算书]

  - clause_id: SJD-2016/4.3.4-1
    chapter: 4.3 建筑
    verbatim: |
      平面图。
      1 承重墙、柱及其定位轴线和轴线编号，轴线总尺寸（或外包总尺寸）、
      轴线间尺寸（柱距、跨度）、门窗洞口尺寸、分段尺寸；
    interpret: |
      这句就是国内常说的"三道尺寸"的规范出处：总尺寸、轴线间尺寸、门窗洞口尺寸。
      条文是列举式，没有写"应"字，但 4.3.4 条目下列举的就是平面图必须具备的内容，
      缺尺寸即深度不足。强制力来自本规定的行政效力与施工图审查实践，不是用词。
      注意条文写的是"轴线总尺寸（或外包总尺寸）、轴线间尺寸、门窗洞口尺寸、分段尺寸"，
      并未规定"必须正好三道"——所以本库只查"有没有尺寸标注"，
      不查"够不够三道"，避免把审查标准当规范条文执行。
    severity_hint: error
    keywords: [平面图, 尺寸标注, 轴线尺寸, 门窗洞口, 三道尺寸, 深度]
    source_note: |
      条款为列举式表述，无"应/宜"用词。判定为 error 的理由是：本规定是施工图
      设计深度的直接依据，缺少规定内容的图纸无法通过施工图审查。
    machine:
      checkable: partial
      required_dimension_kinds: [total, axis_spacing, opening, segment]
      require_axis_labels: true

  - clause_id: SJD-2016/4.3.4-12
    chapter: 4.3 建筑
    verbatim: |
      12 室外地面标高、首层地面标高、各楼层标高、地下室各层标高；
    interpret: |
      标高必须逐层标注，且室外地面与首层地面要分开标（两者之间的高差是入口台阶、
      防潮层、无障碍坡道的设计依据）。只在说明里写"层高 2.800"不算标注——
      标高是图面信息，必须出现在图上。
      实务中最常见的错误是把标高点成普通文字，或用"高差线"之类的图层承载，
      导致关闭图层时标高集体消失。
    severity_hint: error
    keywords: [标高, 层高, 首层地面, 室外地面, 高差]
    machine:
      checkable: partial
      required_elevation_kinds: [outdoor_ground, first_floor, floor_levels]

  - clause_id: SJD-2016/4.3.4-13
    chapter: 4.3 建筑
    verbatim: |
      13 首层平面标注剖切线位置、编号及指北针或风玫瑰；
    interpret: |
      只有首层平面需要这一条：剖切符号告诉你剖面图从哪切、往哪看，
      指北针/风玫瑰告诉你朝向。学生作业里这两样最常漏，漏了以后
      立面、剖面、总平面的朝向关系全部无法核对。
      风玫瑰与指北针二选一即可，工业项目因要考虑风向污染多用风玫瑰。
    severity_hint: error
    keywords: [首层平面, 剖切线, 剖切符号, 指北针, 风玫瑰, 朝向]
    machine:
      checkable: partial
      applies_to: first_floor_plan
      require_one_of: [指北针, 风玫瑰]
      require_section_marks: true

  - clause_id: SJD-2016/4.3.4-20
    chapter: 4.3 建筑
    verbatim: |
      20 图纸名称、比例；
    interpret: |
      每一张图都要有图名和比例，且比例指打印到纸上的比例。
      没有比例，前面所有"打印字高不小于 2.5mm""轴号圆直径 8~10mm"的判定
      都失去基准——同一张模型按 1:50 和 1:200 出图，结论完全相反。
      所以这条不只是格式要求，它是其他所有几何类规则的前提。
    severity_hint: error
    keywords: [图名, 图纸名称, 比例, 出图比例, 标题栏]
    machine:
      checkable: partial
      require_scale_annotation: true
      scale_pattern: '1\s*[:：∶]\s*\d+'
