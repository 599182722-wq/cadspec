standard: GB55031-2022
standard_name: 民用建筑通用规范
source_url: https://gf.cabr-fire.com/list-1535.htm
source_note: ''
clauses:
  - clause_id: GB55031-2022/1.0.1
    chapter: 1 总则
    verbatim: 为规范民用建筑空间与部位的基本尺度、技术性要求及通用技术措施，制定本规范。
    interpret: 立法目的：统一民用建筑「空间与部位」的基本尺度、技术要求和通用措施。这句话划定了本规范的边界——它管的是空间尺寸和通用做法，具体构造、设备参数由各自专业规范管。
    severity_hint: info
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/1.0.2
    chapter: 1 总则
    verbatim: 民用建筑必须执行本规范。
    interpret: 强制性条文：民用建筑必须执行本规范。注意「必须」二字，本规范其余条文即便写成「应」，其强制力也来自这一条。
    severity_hint: error
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/1.0.3
    chapter: 1 总则
    verbatim: 民用建筑的建设和使用维护应遵循下列基本原则：1 应按照可持续发展的原则，正确处理人、建筑与环境的相互关系，营建与使用功能匹配的合理空间；2 应贯彻节能、节地、节水、节材、保护环境的政策要求；3 应与所处环境协调，体现时代特色、地域文化。
    interpret: 三条基本原则：可持续发展与合理空间、节能节地节水节材、与地域环境协调。原则性条款，不产生具体数值，但设计说明里通常要引用。
    severity_hint: error
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/1.0.4
    chapter: 1 总则
    verbatim: 工程建设所采用的技术方法和措施是否符合本规范要求，由相关责任主体判定。其中，创新性的技术方法和措施，应进行论证并符合本规范中有关性能的要求。
    interpret: 合规判定责任在相关责任主体（建设、设计、施工、审查各方），创新性技术措施要论证并满足本规范的性能要求。这条常被误读成「创新可以豁免」，实际是「创新要自证等效」。
    severity_hint: error
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.1.1
    chapter: 2.1 功能要求
    verbatim: 民用建筑建设应遵循安全、卫生、健康、舒适的原则，为人们的生活、工作、交流等社会活动提供合理的使用空间，使用空间应满足人体工学的基本尺度要求。
    interpret: 总纲：安全、卫生、健康、舒适四原则，使用空间要满足人体工学基本尺度。这是后面所有尺寸条文的依据来源，也意味着尺寸条文只给了「最小值」，具体项目要按使用需求放大。
    severity_hint: error
    keywords:
      - 功能要求
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.1.2
    chapter: 2.1 功能要求
    verbatim: 民用建筑选址应满足安全要求。
    interpret: 选址要满足安全要求。总平面阶段的事：地质灾害、洪涝、污染源距离等，平面图上体现为用地与周边关系的处理。
    severity_hint: error
    keywords:
      - 功能要求
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.1.3
    chapter: 2.1 功能要求
    verbatim: 居住建筑应保障居住者生活安全及私密性，并应满足采光、通风和隔声等方面的要求。
    interpret: 居住建筑要保障安全与私密性，并满足采光、通风、隔声要求。私密性是住宅特有的要求，与 4.2 的建筑间距、对视遮挡配套。具体数值在 GB 55038 的 4.1/4.2 与 6.2。
    severity_hint: error
    keywords:
      - 功能要求
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.1.4
    chapter: 2.1 功能要求
    verbatim: 教育、办公科研、商业服务、公众活动、交通、医疗及社会民生服务等公共建筑除应满足各类活动所需空间及使用需求外，还应满足交通、人员集散的要求。
    interpret: 各类公共建筑除满足使用空间外，还应满足交通与人员集散要求。集散是疏散设计的上位要求，具体数值在 GB 55037 第 7 章。
    severity_hint: error
    keywords:
      - 功能要求
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.1.5
    chapter: 2.1 功能要求
    verbatim: 当民用建筑存在不同功能场所组合的情况时，除应满足上述条款的要求外，尚应符合下列规定：1 各功能场所不应降低其他功能场所的基本安全、卫生标准；2 当产生污染、辐射的功能场所与其他功能场所组合时，应采取必要的安全防护措施；3 当不同安全等级的功能场所组合时，应采取确保各功能场所使用安全的相应措施。
    interpret: 混合功能组合的三条底线：不得降低其他功能的安全卫生标准、污染辐射功能要防护、不同安全等级要隔离。平面图上直接体现分区——餐饮油烟不能紧邻住宅、设备房不能贴着病房。
    severity_hint: error
    keywords:
      - 功能要求
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.1.6
    chapter: 2.1 功能要求
    verbatim: 民用建筑应配置满足基本使用功能需要的设备设施。
    interpret: 应配置满足基本使用功能的设备设施。总纲条，具体配置在 5.4（电梯）、5.8（设备用房）、5.9（地下半地下）等节。
    severity_hint: error
    keywords:
      - 功能要求
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.1.7
    chapter: 2.1 功能要求
    verbatim: 民用建筑应设置相应的安全及导向标识系统。
    interpret: 应设置安全及导向标识系统。平面图上体现为标识点位；与消防疏散标识、无障碍标识（GB 55019 第 4 章）配套。
    severity_hint: error
    keywords:
      - 功能要求
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.2.1
    chapter: 2.2 性能与措施
    verbatim: 民用建筑应综合采取防火、抗震、防洪、防空、抗风雪及防雷击等防灾安全措施。
    interpret: 综合防灾：防火、抗震、防洪、防空、抗风雪、防雷击。六类灾害的对应规范分别是 GB 55037、GB 55002/55011、防洪标准、人防规范、荷载规范、GB 50057。本条是汇总，不产生新数值。
    severity_hint: error
    keywords:
      - 性能与措施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.2.2
    chapter: 2.2 性能与措施
    verbatim: 民用建筑的结构应满足相应的设计工作年限要求。
    interpret: 结构应满足设计工作年限。住宅 50 年、普通公建 50 年、纪念性建筑 100 年，具体年限由 GB 55038 表 2.2.6 等规定。设计图纸的设计说明里必须写明。
    severity_hint: error
    keywords:
      - 性能与措施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.2.3
    chapter: 2.2 性能与措施
    verbatim: 民用建筑应满足无障碍要求，且具有无障碍性能的设施设置应系统连贯。
    interpret: 应满足无障碍要求，且无障碍设施要「系统连贯」。后半句是关键：只做了一个无障碍坡道、其他环节断开，不算合规。系统连贯意味着从室外到室内的整条路径都要通，具体在 GB 55019。
    severity_hint: error
    keywords:
      - 性能与措施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.2.4
    chapter: 2.2 性能与措施
    verbatim: 室内外装修不应影响建筑物结构的安全性，且应选择安全环保型装修材料。装修材料、装饰面层或构配件与主体结构的连接应安全牢固。建筑物外墙装饰面层、构件、门窗等材料及构造应安全可靠，在设计工作年限内应满足功能和性能要求，使用期间应定期维护，防止坠落。
    interpret: 装修不得影响结构安全、材料要安全环保、连接要牢固、外墙构件要防坠落并定期维护。外墙装饰面层和门窗的防坠落要求，与总平面和立面有关——高层建筑外墙贴砖、外开窗都要有防坠构造。
    severity_hint: error
    keywords:
      - 性能与措施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.2.5
    chapter: 2.2 性能与措施
    verbatim: 装配式建筑应采用集成化、模块化、标准化及通用化的预制部品、部件。
    interpret: 装配式建筑应采用集成化、模块化、标准化、通用化的预制部品部件。设计阶段的体现是户型标准化和构件重复率，与平面图关系直接——户型越少、构件越统一越合规。
    severity_hint: error
    keywords:
      - 性能与措施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/2.2.6
    chapter: 2.2 性能与措施
    verbatim: 民用建筑的室外公共场地、建筑空间、建筑部件及公共设备设施应定期进行日常保养、维修和监管。
    interpret: 室外公共场地、建筑空间、建筑部件、公共设备设施应定期保养维修监管。使用维护条，不产生设计约束。
    severity_hint: error
    keywords:
      - 性能与措施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.1
    chapter: 3.1 建筑面积
    verbatim: 建筑面积应按建筑每个自然层楼（地）面处外围护结构外表面所围空间的水平投影面积计算。
    interpret: 建筑面积的定义变了：按「外围护结构外表面」所围空间的水平投影计算，不是按轴线、也不是按内表面。这与旧规范的差别在于外保温层是否计入——按本规范，外墙保温层计入建筑面积。
    severity_hint: error
    keywords:
      - 建筑面积
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.2
    chapter: 3.1 建筑面积
    verbatim: 总建筑面积应按地上和地下建筑面积之和计算，地上和地下建筑面积应分别计算。
    interpret: 总建筑面积 = 地上 + 地下，两者必须分别计算。报建和规划指标里地上地下是分开报的，图纸的面积表要分行列。
    severity_hint: error
    keywords:
      - 建筑面积
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.3
    chapter: 3.1 建筑面积
    verbatim: 室外设计地坪以上的建筑空间，其建筑面积应计入地上建筑面积；室外设计地坪以下的建筑空间，其建筑面积应计入地下建筑面积。
    interpret: 以室外设计地坪为界划分地上地下。注意是「室外设计地坪」不是「±0.000」——半地下室按此界线判定，这在总平面和剖面图上要标清楚。
    severity_hint: error
    keywords:
      - 建筑面积
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.4
    chapter: 3.1 建筑面积
    verbatim: 永久性结构的建筑空间，有永久性顶盖、结构层高或斜面结构板顶高在2.20m及以上的，应按下列规定计算建筑面积：1 有围护结构、封闭围合的建筑空间，应按其外围护结构外表面所围空间的水平投影面积计算；2 无围护结构、以柱围合，或部分围护结构与柱共同围合，不封闭的建筑空间，应按其柱或外围护结构外表面所围空间的水平投影面积计算；3 无围护结构、单排柱或独立柱、不封闭的建筑空间，应按其顶盖水平投影面积的1/2计算；4 无围护结构、有围护设施、无柱、附属在建筑外围护结构、不封闭的建筑空间，应按其围护设施外表面所围空间水平投影面积的1/2计算。
    interpret: 建筑面积计算的核心规则：有永久顶盖、层高或板顶高 ≥2.20m 才全算，四类空间分别按全算或半算。2.20m 这个门槛贯穿全规范，画图时局部夹层、坡屋顶下的空间都要按这个高度卡。
    severity_hint: error
    keywords:
      - 建筑面积
      - 2.20m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.5
    chapter: 3.1 建筑面积
    verbatim: 阳台建筑面积应按围护设施外表面所围空间水平投影面积的1/2计算；当阳台封闭时，应按其外围护结构外表面所围空间的水平投影面积计算。
    interpret: 阳台按围护设施外表面水平投影的 1/2 算；封闭阳台按外围护结构外表面全算。开敞与封闭差一倍面积，方案阶段最容易被拿来做「赠送面积」，报建时按实际状态算。
    severity_hint: error
    keywords:
      - 建筑面积
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.6
    chapter: 3.1 建筑面积
    verbatim: 下列空间与部位不应计算建筑面积：1 结构层高或斜面结构板顶高度小于2.20m的建筑空间；2 无顶盖的建筑空间；3 附属在建筑外围护结构上的构（配）件；4 建筑出挑部分的下部空间；5 建筑物中用作城市街巷通行的公共交通空间；6 独立于建筑物之外的各类构筑物。
    interpret: 六类不计建筑面积的空间：层高 <2.20m、无顶盖、附属构件、出挑下部、城市街巷穿越空间、独立构筑物。画图时这些部位在面积表里要单列或注明不计。
    severity_hint: error
    keywords:
      - 建筑面积
      - 2.20m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.7
    chapter: 3.1 建筑面积
    verbatim: 功能空间使用面积应按功能空间墙体内表面所围合空间的水平投影面积计算。
    interpret: 功能空间使用面积按墙体内表面所围合计算。使用面积与建筑面积的差就是墙体面积，方案阶段常用 0.7~0.8 的得房率估算，正式报建要按本条实测。
    severity_hint: error
    keywords:
      - 建筑面积
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.8
    chapter: 3.1 建筑面积
    verbatim: 功能单元使用面积应按功能单元内各功能空间使用面积之和计算。
    interpret: 功能单元使用面积 = 各功能空间使用面积之和。住宅套内使用面积就是把各个房间分别算完相加，不含墙体和阳台。
    severity_hint: error
    keywords:
      - 建筑面积
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.1.9
    chapter: 3.1 建筑面积
    verbatim: 功能单元建筑面积应按功能单元使用面积、功能单元墙体水平投影面积、功能单元内阳台面积之和计算。
    interpret: 功能单元建筑面积 = 使用面积 + 墙体水平投影面积 + 套内阳台面积。这条给出了得房率的规范算法，也是报建面积表的编制依据。
    severity_hint: error
    keywords:
      - 建筑面积
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.2.1
    chapter: 3.2 建筑高度
    verbatim: 平屋顶建筑高度应按室外设计地坪至建筑物女儿墙顶点的高度计算，无女儿墙的建筑应按至其屋面檐口顶点的高度计算。
    interpret: 平屋顶建筑高度：室外设计地坪至女儿墙顶点；无女儿墙至屋面檐口顶点。注意是「女儿墙顶点」不是「屋面完成面」，两者能差 1m 以上，直接影响是否超限（如 27m、54m 的分档）。
    severity_hint: error
    keywords:
      - 建筑高度
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.2.2
    chapter: 3.2 建筑高度
    verbatim: 坡屋顶建筑应分别计算檐口及屋脊高度，檐口高度应按室外设计地坪至屋面檐口或坡屋面最低点的高度计算，屋脊高度应按室外设计地坪至屋脊的高度计算。
    interpret: 坡屋顶要分别算檐口高度和屋脊高度：檐口至坡屋面最低点，屋脊至屋脊。规划限高通常按檐口控制，日照和间距计算可能用屋脊，两个数都要出。
    severity_hint: error
    keywords:
      - 建筑高度
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.2.3
    chapter: 3.2 建筑高度
    verbatim: 当同一座建筑有多种屋面形式，或多个室外设计地坪时，建筑高度应分别计算后取其中最大值。
    interpret: 同一栋楼有多种屋面形式或多个室外设计地坪时，分别计算取最大值。退台建筑、坡地建筑常见，画图时每个起算点都要标，取最高的那个报。
    severity_hint: error
    keywords:
      - 建筑高度
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.2.4
    chapter: 3.2 建筑高度
    verbatim: 机场、广播电视、电信、微波通信、气象台、卫星地面站、军事要塞等设施的技术作业控制区内及机场航线控制范围内的建筑，建筑高度应按建筑物室外设计地坪至建（构）筑物最高点计算。
    interpret: 机场、广电、电信、气象、军事要塞等技术作业控制区及机场航线控制范围内的建筑，高度算至建（构）筑物最高点（含天线、构架）。这类区域限高极严，总图上要先查净空图。
    severity_hint: error
    keywords:
      - 建筑高度
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.2.5
    chapter: 3.2 建筑高度
    verbatim: 历史建筑，历史文化名城名镇名村、历史文化街区、文物保护单位、风景名胜区、自然保护区的保护规划区内的建筑，建筑高度应按建筑物室外设计地坪至建（构）筑物最高点计算。
    interpret: 历史建筑、历史文化街区、文保单位、风景名胜区、自然保护区保护规划区内的建筑，高度算至最高点。与 3.2.4 同理，是「从严计算」的两类区域。
    severity_hint: error
    keywords:
      - 建筑高度
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.2.6
    chapter: 3.2 建筑高度
    verbatim: 本规范第3.2.4条、第3.2.5条规定以外的建筑，屋顶设备用房及其他局部突出屋面用房的总面积不超过屋面面积的1/4时，不应计入建筑高度。
    interpret: 除 3.2.4、3.2.5 两类区域外，屋顶设备用房及局部突出屋面用房总面积不超过屋面面积 1/4 时，不计入建筑高度。电梯机房、水箱间、楼梯间出屋面都按这条算——但只在这个面积比例内。
    severity_hint: error
    keywords:
      - 建筑高度
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/3.2.7
    chapter: 3.2 建筑高度
    verbatim: 建筑的室内净高应满足各类型功能场所空间净高的最低要求，地下室、局部夹层、公共走道、建筑避难区、架空层等有人员正常活动的场所最低处室内净高不应小于2.00m。
    interpret: 室内净高要满足各功能场所的最低要求；地下室、局部夹层、公共走道、避难区、架空层等有人正常活动的场所，最低处净高不小于 2.00m。2.00m 是「人能不能站直通过」的硬门槛，梁下、管道下、坡屋面最低处都要卡这个数。
    severity_hint: error
    keywords:
      - 建筑高度
      - 2.00m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.1.1
    chapter: 4.1 环境与场地
    verbatim: 民用建筑应结合当地的自然环境特征，集约利用资源，严格控制其对生态环境的不利影响。
    interpret: 建筑要结合当地自然环境，集约利用资源，控制对生态的不利影响。原则条，体现在总平面的场地设计和建筑朝向、体量选择上，不产生具体数值。
    severity_hint: error
    keywords:
      - 环境与场地
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.1.2
    chapter: 4.1 环境与场地
    verbatim: 建筑周围环境的空气、土壤、水体等不应对人体健康构成危害。存在污染的建设场地应采取有效措施进行治理，并应达到建设用地土壤环境质量要求。
    interpret: 场地空气、土壤、水体不得危害健康；有污染的场地要先治理并达到建设用地土壤环境质量要求。总平面阶段要查场地历史用途（工业用地转住宅是重点），治理合格才能报建。
    severity_hint: error
    keywords:
      - 环境与场地
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.1.3
    chapter: 4.1 环境与场地
    verbatim: 建筑在建设和使用过程中，应采取控制噪声、振动、眩光等污染的措施，产生的废物、废气、废水等污染物应妥善处理。
    interpret: 建设与使用过程要控制噪声、振动、眩光，废弃物妥善处理。对应到图纸是设备房的隔振、玻璃幕墙的眩光控制、垃圾房的密闭。
    severity_hint: error
    keywords:
      - 环境与场地
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.1.4
    chapter: 4.1 环境与场地
    verbatim: 建筑与危险化学品及易燃易爆品等危险源的距离，应满足有关安全规定。
    interpret: 与危险化学品、易燃易爆品等危险源的距离应满足有关安全规定。本规范不另给数值，按 GB 50016、GB 50160 等专业规范查。总图上要先标出危险源位置再定距离。
    severity_hint: error
    keywords:
      - 环境与场地
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.1.5
    chapter: 4.1 环境与场地
    verbatim: 建筑场地应符合下列规定：1 有洪涝威胁的场地应采取可靠的防洪、防内涝措施；2 当场地标高低于市政道路标高时，应有防止客水进入场地的措施；3 场地设计标高应高于常年最高地下水位。
    interpret: 场地三条硬要求：有洪涝威胁要防洪防内涝；场地标高低于市政道路时要有防止客水（外部雨水倒灌）进入的措施；场地设计标高应高于常年最高地下水位。第三条最容易漏——地下水位高时要做防潮防渗和抗浮设计。
    severity_hint: error
    keywords:
      - 环境与场地
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.1.6
    chapter: 4.1 环境与场地
    verbatim: 人员密集公共建筑的建筑基地应符合下列规定：1 建筑基地的出入口应满足人员安全疏散要求；2 建筑物主要出入口前应设置人员集散场地，其面积和长宽尺寸应根据使用性质和人数确定；3 建筑基地内设置的绿地、停车场（位）或其他构筑物，不应对人员集散造成障碍。
    interpret: 人员密集公共建筑基地三要求：出入口满足安全疏散、主要出入口前设集散场地（面积和长宽按使用性质与人数定）、绿地停车场不得妨碍集散。集散场地本规范不给具体面积，按人数和疏散要求算，但方向明确：主要出入口前必须留空。
    severity_hint: error
    keywords:
      - 环境与场地
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.2.1
    chapter: 4.2 建筑控制
    verbatim: 除建筑连接体、地铁相关设施以及管线、管沟、管廊等市政设施外，建筑物及其附属设施不应突出道路红线或用地红线。
    interpret: 建筑物及附属设施不应突出道路红线或用地红线，例外是建筑连接体、地铁相关设施、市政管线管沟管廊。这是总平面最硬的一条：退线不足就是违规，台阶、坡道、雨篷突出红线同样不行（4.2.2 的豁免只针对建筑控制线，不针对红线）。
    severity_hint: error
    keywords:
      - 建筑控制
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.2.2
    chapter: 4.2 建筑控制
    verbatim: 除地下室、地下车库出入口，以及窗井、台阶、坡道、雨篷、挑檐等设施外，建（构）筑物的主体不应突出建筑控制线。
    interpret: 建筑物主体不应突出建筑控制线，例外是地下室、地下车库出入口、窗井、台阶、坡道、雨篷、挑檐等。注意例外清单只到「设施」层面，阳台、飘窗、外挂空调板不在其中，各地规划部门另有规定时从其规定。
    severity_hint: error
    keywords:
      - 建筑控制
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.2.3
    chapter: 4.2 建筑控制
    verbatim: 骑楼、建筑连接体、沿道路红线的悬挑建筑等，不应影响交通、环保及消防安全。
    interpret: 骑楼、建筑连接体、沿红线悬挑的建筑不应影响交通、环保和消防。悬挑在红线内是允许的，但净空、排水、消防登高面都要满足，且不能挡住人行道。
    severity_hint: error
    keywords:
      - 建筑控制
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.3.1
    chapter: 4.3 基地道路
    verbatim: 建筑基地内的道路系统应顺畅、便捷，保障车辆、行人交通安全，并应满足消防救援及无障碍通行要求。
    interpret: 基地道路要顺畅便捷、保障车行与人行安全，并满足消防救援和无障碍通行。四个要求并列，「无障碍通行」常被漏——基地道路也要有无障碍路径，见 GB 55019。
    severity_hint: error
    keywords:
      - 基地道路
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.3.2
    chapter: 4.3 基地道路
    verbatim: 建筑基地道路应与外部道路相连接。
    interpret: 基地道路应与外部道路相连接。看似废话，实际是要求基地不是孤岛：出入口必须能接上市政路，且接口位置要符合 4.3.4 的限制。
    severity_hint: error
    keywords:
      - 基地道路
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.3.3
    chapter: 4.3 基地道路
    verbatim: 建筑基地内机动车车库出入口与连接道路间应设置缓冲段。
    interpret: 车库出入口与连接道路之间应设缓冲段。坡道起坡前要有平段，防止车辆直接冲入道路；缓冲段长度按坡度算，图纸上要能看出这段平路。
    severity_hint: error
    keywords:
      - 基地道路
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.3.4
    chapter: 4.3 基地道路
    verbatim: 建筑基地机动车出入口位置应符合下列规定：1 不应直接与城市快速路相连接；2 距周边中小学及幼儿园的出入口最近边缘不应小于20.0m；3 应有良好的视线，行车视距范围内不应有遮挡视线的障碍物。
    interpret: 机动车出入口三条限制：不得直接接城市快速路；距中小学及幼儿园出入口最近边缘不小于 20.0m；视线良好、视距范围内无遮挡。20m 这个数是规划审查的硬指标，总图报建必查。
    severity_hint: error
    keywords:
      - 基地道路
      - 20.0m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.3.5
    chapter: 4.3 基地道路
    verbatim: 建筑基地内道路的设置应符合下列规定：1 基地内道路与城市道路连接处应设限速设施，道路应能通达建筑物的主要出入口；2 当机动车道路改变方向时，路边绿化及建筑物应满足行车有效视距要求。
    interpret: 基地内道路要与城市道路连接处设限速；道路能通达建筑物主要出入口；道路改变方向时，绿化与建筑要满足行车有效视距。视距三角形是总图常见的画法要求，转弯处不能种乔木、不能立广告牌。
    severity_hint: error
    keywords:
      - 基地道路
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.3.6
    chapter: 4.3 基地道路
    verbatim: 建筑基地内机动车道路应符合下列规定：1 单车道宽度不应小于3.0m，兼作消防车道时不应小于4.0m；2 双车道宽度不应小于6.0m；3 尽端式道路长度大于120m时，应设置回车场地。
    interpret: 基地内机动车道宽度：单车道不小于 3.0m，兼作消防车道时不小于 4.0m；双车道不小于 6.0m；尽端式道路长度大于 120m 要设回车场。三个数都是审查点，消防车道 4.0m 与 GB 55037 的 4.0m×4.0m 净空配套看。
    severity_hint: error
    keywords:
      - 基地道路
      - 3.0m
      - 4.0m
      - 6.0m
      - 120m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.4.1
    chapter: 4.4 场地铺装与水体
    verbatim: 场地内的人行道、广场等硬质铺装应保障人员通行的安全，且地面铺装面层应防滑。
    interpret: 人行道、广场等硬质铺装要保障通行安全，面层要防滑。防滑性能用摆式摩擦系数或 BPN 值衡量，图纸的铺装做法表里要注明。
    severity_hint: error
    keywords:
      - 场地铺装与水体
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.4.2
    chapter: 4.4 场地铺装与水体
    verbatim: 允许车辆通行的广场，应满足车辆行驶、停放和载重的要求，且地面铺装面层应平整、防滑、耐磨。
    interpret: 允许车辆通行的广场要满足行驶、停放、载重要求，面层平整防滑耐磨。广场兼作消防登高面时，还要满足消防车荷载与坡度要求。
    severity_hint: error
    keywords:
      - 场地铺装与水体
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.4.3
    chapter: 4.4 场地铺装与水体
    verbatim: 人工水体岸边近2.0m范围内的水深大于0.50m时，应采取安全防护措施。
    interpret: 人工水体岸边近 2.0m 范围内水深大于 0.50m 时应采取安全防护措施。两个数：近岸 2.0m 的水深控制在 0.50m 以内，超了就要做栏杆、防护栏或浅水区。景观水景设计常忽略这条。
    severity_hint: error
    keywords:
      - 场地铺装与水体
      - 2.0m
      - 0.50m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.5.1
    chapter: 4.5 构筑物与设施
    verbatim: 地下车库、地下室有污染性的排风口不应朝向邻近建筑的可开启外窗或取风口；当排风口与人员活动场所的距离小于10m时，朝向人员活动场所的排风口底部距人员活动场所地坪的高度不应小于2.5m。
    interpret: 地下车库、地下室有污染的排风口不应朝向邻近建筑的可开启外窗或取风口；排风口与人员活动场所距离小于 10m 时，排风口底部距该场所地坪不小于 2.5m。这条直接影响总平面上风口的朝向和标高，住宅首层窗外正对车库排风口是最典型的违规。
    severity_hint: error
    keywords:
      - 构筑物与设施
      - 10m
      - 2.5m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.5.2
    chapter: 4.5 构筑物与设施
    verbatim: 当建筑物上设置太阳能热水或光伏发电系统、暖通空调设备、广告牌、外遮阳设施、装饰线脚等附属构件或设施时，应采取防止构件或设施坠落的安全防护措施，并应满足建筑结构及其他相应的安全性要求。
    interpret: 太阳能热水/光伏、暖通设备、广告牌、外遮阳、装饰线脚等附属构件要防坠落，并满足结构安全要求。高层建筑的外挂构件都要有连接计算和防坠构造，立面图和详图里体现。
    severity_hint: error
    keywords:
      - 构筑物与设施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/4.5.3
    chapter: 4.5 构筑物与设施
    verbatim: 基地内的生活垃圾收集站房应符合下列规定：1 应配置上下水设施，地面、墙面应采用易清洁材料；2 应满足垃圾分类储存的要求；3 应设置满足垃圾车装载和运输要求的场地。
    interpret: 垃圾收集站房三要求：配上下水、地面墙面易清洁、满足分类储存、有垃圾车装卸运输场地。总平面上要留出垃圾车回转和作业空间，站房位置还要考虑与住宅的距离。
    severity_hint: error
    keywords:
      - 构筑物与设施
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.1.1
    chapter: 5.1 出入口
    verbatim: 建筑出入口应根据场地条件、建筑使用功能、交通组织以及安全疏散等要求进行设置，并应安全、顺畅、便捷。
    interpret: 出入口要结合场地、功能、交通组织、安全疏散设置，做到安全顺畅便捷。总纲条，具体尺寸散落在 5.1/5.2 各条与消防疏散规范里。
    severity_hint: error
    keywords:
      - 出入口
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.1.2
    chapter: 5.1 出入口
    verbatim: 入口、门厅等人员通达部位采用落地玻璃时，应使用安全玻璃，并应设置防撞提示标识。
    interpret: 入口门厅用落地玻璃时必须是安全玻璃，并设防撞提示标识。两个要求缺一不可——玻璃做对了但没贴防撞条，人还是会撞上去，审查照样提。
    severity_hint: error
    keywords:
      - 出入口
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.1.3
    chapter: 5.1 出入口
    verbatim: 建筑出入口处应采取防止室外雨水侵入室内的措施。
    interpret: 出入口处要防止室外雨水侵入室内。做法是门口做反槛、抬高室内地坪或设截水沟，剖面图上要能看出高差。
    severity_hint: error
    keywords:
      - 出入口
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.2.1
    chapter: 5.2 台阶、人行坡道
    verbatim: 当台阶、人行坡道总高度达到或超过0.70m时，应在临空面采取防护措施。
    interpret: 台阶、人行坡道总高度达到或超过 0.70m 时，临空面要设防护。0.70m 是开始需要栏杆的门槛，室外大台阶两侧最容易漏。
    severity_hint: error
    keywords:
      - 台阶、人行坡道
      - 0.70m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.2.2
    chapter: 5.2 台阶、人行坡道
    verbatim: 建筑物主入口的室外台阶踏步宽度不应小于0.30m，踏步高度不应大于0.15m。
    interpret: 主入口室外台阶：踏步宽不小于 0.30m，踏步高不大于 0.15m。这是「主入口」的专门要求，比一般台阶宽松的常见做法更严；0.30m 的踏面是能放稳脚的尺度。
    severity_hint: error
    keywords:
      - 台阶、人行坡道
      - 0.30m
      - 0.15m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.2.3
    chapter: 5.2 台阶、人行坡道
    verbatim: 台阶踏步数不应少于2级，当踏步数不足2级时，应按人行坡道设置。
    interpret: 台阶踏步数不应少于 2 级；不足 2 级时按人行坡道设置。一级台阶既不像台阶也不像坡道，是绊倒高发点，所以禁止。只做一级的地方要改成放坡。
    severity_hint: error
    keywords:
      - 台阶、人行坡道
      - 2级
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.2.4
    chapter: 5.2 台阶、人行坡道
    verbatim: 台阶、人行坡道的铺装面层应采取防滑措施。
    interpret: 台阶、人行坡道的铺装面层要防滑。室外湿滑状态下的防滑指标，做法表里要注明。
    severity_hint: error
    keywords:
      - 台阶、人行坡道
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.1
    chapter: 5.3 楼梯、走廊
    verbatim: 楼梯、走廊应安全、顺畅，并应满足人员通行、安全疏散等要求。
    interpret: 楼梯、走廊要安全顺畅，满足通行与疏散。上位要求，数值在 5.3.2 之后各条和 GB 55037 第 7 章。
    severity_hint: error
    keywords:
      - 楼梯、走廊
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.2
    chapter: 5.3 楼梯、走廊
    verbatim: 供日常交通用的公共楼梯的梯段最小净宽应根据建筑物使用特征，按人流股数和每股人流宽度0.55m确定，并不应少于2股人流的宽度。
    interpret: 公共楼梯梯段最小净宽按人流股数算，每股 0.55m，且不少于 2 股，即不小于 1.10m。0.55m 是一个人正面通过的肩宽加余量，所有楼梯宽度的计算都从这个人流股数出发。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 0.55m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.3
    chapter: 5.3 楼梯、走廊
    verbatim: 当公共楼梯单侧有扶手时，梯段净宽应按墙体装饰面至扶手中心线的水平距离计算。当公共楼梯两侧有扶手时，梯段净宽应按两侧扶手中心线之间的水平距离计算。当有凸出物时，梯段净宽应从凸出物表面算起。靠墙扶手边缘距墙面完成面净距不应小于40mm。
    interpret: 楼梯净宽的量算位置：单侧扶手算到扶手中心线，两侧扶手算两中心线之间，有凸出物从凸出物表面算；靠墙扶手边缘距墙面完成面不小于 40mm。很多图纸把净宽画到墙面，实际要扣掉扶手占的 40mm，净宽就不够了。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 40mm
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.4
    chapter: 5.3 楼梯、走廊
    verbatim: 公共楼梯应至少于单侧设置扶手，梯段净宽达3股人流的宽度时应两侧设扶手。
    interpret: 公共楼梯至少单侧设扶手；梯段净宽达到 3 股人流（1.65m）时两侧都要设。3 股人流是个分界，宽楼梯只做单侧扶手是最常见的漏项。
    severity_hint: error
    keywords:
      - 楼梯、走廊
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.5
    chapter: 5.3 楼梯、走廊
    verbatim: 当梯段改变方向时，楼梯休息平台的最小宽度不应小于梯段净宽，并不应小于1.20m；当中间有实体墙时，扶手转向端处的平台净宽不应小于1.30m。直跑楼梯的中间平台宽度不应小于0.90m。
    interpret: 休息平台最小宽度不小于梯段净宽，且不小于 1.20m；中间有实体墙时扶手转向端平台净宽不小于 1.30m；直跑楼梯中间平台不小于 0.90m。三个数对应三种情形，画图时先判断属于哪一种再取数。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 1.20m
      - 1.30m
      - 0.90m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.6
    chapter: 5.3 楼梯、走廊
    verbatim: 公共楼梯正对（向上、向下）梯段设置的楼梯间门距踏步边缘的距离不应小于0.60m。
    interpret: 楼梯间的门正对梯段时，门距踏步边缘不小于 0.60m。开门瞬间如果有人正上楼梯会被门打到，0.60m 是缓冲距离。画楼梯间平面时这个尺寸要标出来。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 0.60m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.7
    chapter: 5.3 楼梯、走廊
    verbatim: 公共楼梯休息平台上部及下部过道处的净高不应小于2.00m，梯段净高不应小于2.20m。
    interpret: 休息平台上下过道净高不小于 2.00m，梯段净高不小于 2.20m。注意两个数不同：梯段 2.20m 更高，因为人在梯段上是斜着走的，头顶空间要留够。剖面图上核这两个数。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 2.00m
      - 2.20m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.8
    chapter: 5.3 楼梯、走廊
    verbatim: 公共楼梯每个梯段的踏步级数不应少于2级，且不应超过18级。
    interpret: 每个梯段踏步不少于 2 级、不超过 18 级。少于 2 级容易绊倒，多于 18 级一次爬升太高、疲劳且有安全隐患。超过 18 级要加休息平台。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 2级
      - 18级
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.9
    chapter: 5.3 楼梯、走廊
    verbatim: 公共楼梯踏步的最小宽度和最大高度应符合表5.3.9的规定。螺旋楼梯和扇形踏步离内侧扶手中心0.25m处的踏步宽度不应小于0.22m。表5.3.9 楼梯踏步最小宽度和最大高度（m）注：表中公共建筑及非住宅类居住建筑不包括托儿所、幼儿园、中小学及老年人照料设施。
    interpret: 踏步尺寸查表 5.3.9：以楼梯为主要垂直交通的公共建筑 0.26/0.165，住宅公共楼梯及以电梯为主要垂直交通的多层公建、高层裙房 0.26/0.175，以电梯为主要垂直交通的高层和超高层 0.25/0.180。螺旋楼梯和扇形踏步在离内侧扶手中心 0.25m 处的踏步宽度不小于 0.22m。表注还排除了托儿所、幼儿园、中小学、老年人照料设施——这四类按各自专项规范取更严的值。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 0.25m
      - 0.22m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.10
    chapter: 5.3 楼梯、走廊
    verbatim: 每个梯段的踏步高度、宽度应一致，相邻梯段踏步高度差不应大于0.01m，且踏步面应采取防滑措施。
    interpret: 每个梯段的踏步高宽要一致，相邻梯段踏步高度差不大于 0.01m，踏步面要防滑。10mm 的高度差是脚能察觉的临界值，超过就会踩空；楼梯间首末段与中间段对齐时最容易出现。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 0.01m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.11
    chapter: 5.3 楼梯、走廊
    verbatim: 当少年儿童专用活动场所的公共楼梯井净宽大于0.20m时，应采取防止少年儿童坠落的措施。
    interpret: 少年儿童专用活动场所的楼梯井净宽大于 0.20m 时，要防儿童坠落。0.20m 是儿童身体能穿过的临界宽度，超过就要做防护网或封堵。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 0.20m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.3.12
    chapter: 5.3 楼梯、走廊
    verbatim: 除住宅外，民用建筑的公共走廊净宽应满足各类型功能场所最小净宽要求，且不应小于1.30m。
    interpret: 除住宅外，公共走廊净宽不小于 1.30m，且满足各功能场所的专项要求。1.30m 是下限，医院、学校、商业还有各自更严的值。
    severity_hint: error
    keywords:
      - 楼梯、走廊
      - 1.30m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.4.1
    chapter: 5.4 电梯、自动扶梯、自动人行道
    verbatim: 设置电梯、自动扶梯、自动人行道应满足安全使用要求。民用建筑应按相关规范要求设置消防及无障碍电梯。
    interpret: 电梯、自动扶梯、自动人行道要满足安全使用；民用建筑要按相关规范设消防电梯和无障碍电梯。消防电梯见 GB 55037 第 2 章，无障碍电梯见 GB 55019 第 2.6 节。
    severity_hint: error
    keywords:
      - 电梯、自动扶梯、自动人行道
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.4.2
    chapter: 5.4 电梯、自动扶梯、自动人行道
    verbatim: 电梯设置应符合下列规定：1 高层公共建筑和高层非住宅类居住建筑的电梯台数不应少于2台；2 建筑内设有电梯时，至少应设置1台无障碍电梯；3 电梯井道和机房与有安静要求的用房贴邻布置时，应采取隔振、隔声措施；4 电梯机房应采取隔热、通风、防尘等措施，不应直接将机房顶板作为水箱底板，不应在机房内直接穿越水管或蒸汽管。
    interpret: 电梯四要求：高层公建和高层非住宅类居住建筑电梯不少于 2 台；设电梯时至少 1 台无障碍；井道机房与安静用房贴邻要隔振隔声；机房要隔热通风防尘，不得把机房顶板当水箱底板，不得在机房内穿越水管或蒸汽管。第 4 条是给排水与电气的界面问题，画设备房时要协调。
    severity_hint: error
    keywords:
      - 电梯、自动扶梯、自动人行道
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.4.3
    chapter: 5.4 电梯、自动扶梯、自动人行道
    verbatim: 自动扶梯、自动人行道设置应符合下列规定：1 出入口畅通区的宽度从扶手带端部算起不应小于2.50m；2 位于中庭中的自动扶梯或自动人行道临空部位应采取防止人员坠落的措施；3 两梯（道）相邻平行或交叉设置，当扶手带中心线与平行墙面或楼板（梁）开口边缘完成面之间的水平投影距离、两梯（道）之间扶手带中心线的水平距离小于0.50m时，应在产生的锐角口前部1.00m处范围内，设置具有防夹、防剪的保护设施或采取其他防止建筑障碍物伤害人员的措施；4 自动扶梯的梯级、自动人行道的踏板或传送带上空，垂直净高不应小于2.30m。
    interpret: 自动扶梯四条：出入口畅通区宽度从扶手带端部算不小于 2.50m；中庭临空部位要防坠；两梯相邻或与墙距离小于 0.50m 时，锐角口前部 1.00m 范围内要设防夹防剪设施；梯级上方垂直净高不小于 2.30m。四个数都要在平面和剖面上核，商业中庭是高发区。
    severity_hint: error
    keywords:
      - 电梯、自动扶梯、自动人行道
      - 2.50m
      - 0.50m
      - 1.00m
      - 2.30m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.5.1
    chapter: 5.5 公共厨房
    verbatim: 公共厨房应符合食品卫生防疫安全和厨房工艺要求。
    interpret: 公共厨房要符合食品卫生防疫安全和厨房工艺要求。总纲条，具体在 5.5.2~5.5.4。
    severity_hint: error
    keywords:
      - 公共厨房
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.5.2
    chapter: 5.5 公共厨房
    verbatim: 厨房专间、备餐区等清洁操作区内不应设置排水明沟，地漏应能防止浊气逸出。
    interpret: 厨房专间、备餐区等清洁操作区不应设排水明沟；地漏要能防浊气逸出。清洁区的地面排水只能靠密闭地漏，明沟会串味和滋生细菌。
    severity_hint: error
    keywords:
      - 公共厨房
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.5.3
    chapter: 5.5 公共厨房
    verbatim: 厨房区、食品库房等用房应采取防鼠、防虫和防其他动物的措施，以及防尘、防潮、防异味和通风的措施。
    interpret: 厨房区、食品库房要防鼠防虫防其他动物，以及防尘防潮防异味和通风。图纸上体现为挡鼠板、纱窗、库房通风口和密闭门。
    severity_hint: error
    keywords:
      - 公共厨房
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.5.4
    chapter: 5.5 公共厨房
    verbatim: 公共厨房应采取防止油烟、气味、噪声及废弃物等对紧邻建筑物或空间环境造成污染的措施。
    interpret: 公共厨房要防止油烟、气味、噪声、废弃物污染紧邻建筑或空间。这条决定厨房在平面上的位置——不能紧贴住宅或办公，油烟排放口要避开可开启窗。
    severity_hint: error
    keywords:
      - 公共厨房
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.6.1
    chapter: 5.6 公共厕所（卫生间）
    verbatim: 民用建筑应根据功能需求配置公共厕所（卫生间），并应设洗手设施。
    interpret: 民用建筑要按功能配置公共厕所，并设洗手设施。配置要求，数量比例见 5.6.3。
    severity_hint: error
    keywords:
      - 公共厕所（卫生间）
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.6.2
    chapter: 5.6 公共厕所（卫生间）
    verbatim: 公共厕所（卫生间）设置应符合下列规定：1 应根据建筑功能合理布局，位置、数量均应满足使用要求；2 不应布置在有严格卫生、安全要求房间的直接上层；3 应根据人体活动时所占的空间尺寸合理布置卫生洁具及其使用空间，管道应相对集中，便于更换维修。
    interpret: 公共厕所三条：位置数量满足使用；不应布置在有严格卫生安全要求房间的直接上层（如厨房、变配电房、病房）；洁具布置要按人体活动空间，管道相对集中便于维修。第 2 条是平面分区要点，厕所压在厨房正上方是典型错误。
    severity_hint: error
    keywords:
      - 公共厕所（卫生间）
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.6.3
    chapter: 5.6 公共厕所（卫生间）
    verbatim: 公共厕所（卫生间）男女厕位的比例应根据使用特点、使用人数确定。
    interpret: 男女厕位比例按使用特点和使用人数确定。本规范不给具体比例，各地有地方标准（常见 1:1.5 至 1:2），商场、剧院、学校差异很大。
    severity_hint: error
    keywords:
      - 公共厕所（卫生间）
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.6.4
    chapter: 5.6 公共厕所（卫生间）
    verbatim: 公共厕所（卫生间）隔间的平面净尺寸应根据使用特点合理确定，并不应小于表5.6.1的规定值。表5.6.4 公共厕所（卫生间）隔间的平面最小净尺寸
    interpret: 隔间平面净尺寸查表 5.6.4：外开门坐便 0.90×1.30、蹲便 0.90×1.20；内开门坐便 0.90×1.50、蹲便 0.90×1.40。净宽一律 0.90m，差别全在净深，门开向决定取哪一行。
    severity_hint: error
    keywords:
      - 公共厕所（卫生间）
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.6.5
    chapter: 5.6 公共厕所（卫生间）
    verbatim: 公共厕所内通道净宽应符合下列规定：1 厕所隔间外开门时，单排厕所隔间外通道净宽不应小于1.30m；双排厕所隔间之间通道净宽不应小于1.30m；隔间至对面小便器或小便槽外沿的通道净宽不应小于1.30m；2 厕所隔间内开门时，通道净宽不应小于1.10m。
    interpret: 厕所通道净宽：隔间外开门时，单排隔间外通道、双排隔间之间通道、隔间至小便器外沿的通道，均不小于 1.30m；隔间内开门时通道不小于 1.10m。内开门省了 0.20m 但门扇会影响通行，取 1.10m 时要确认门开时不撞人。
    severity_hint: error
    keywords:
      - 公共厕所（卫生间）
      - 1.30m
      - 1.10m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.7.1
    chapter: 5.7 母婴室
    verbatim: 经常有母婴逗留的公共建筑内应设置母婴室。
    interpret: 经常有母婴逗留的公共建筑要设母婴室。哪些属于「经常有母婴逗留」由地方规定细化，商场、交通枢纽、医院基本都要设。
    severity_hint: error
    keywords:
      - 母婴室
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.7.2
    chapter: 5.7 母婴室
    verbatim: 公共建筑应根据公共场所面积、人流量、母婴逗留情况等因素，合理确定母婴室的位置、数量、面积及配置设施。
    interpret: 母婴室的位置、数量、面积、设施要按公共场所面积、人流量、母婴逗留情况合理确定。本规范不给具体数值，图纸上要能说明配置依据。
    severity_hint: error
    keywords:
      - 母婴室
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.8.1
    chapter: 5.8 设备用房
    verbatim: 建筑应按正常运行需要设置燃气、热力、给水排水、通风、空调、电力、通信等设备用房，设备用房应按功能需要满足安全、防火、隔声、降噪、减振、防水等要求。
    interpret: 要按运行需要设燃气、热力、给排水、通风、空调、电力、通信等设备用房，并满足安全、防火、隔声、降噪、减振、防水要求。设备房不是「有空房间就放」，有专门的相邻关系限制。
    severity_hint: error
    keywords:
      - 设备用房
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.8.2
    chapter: 5.8 设备用房
    verbatim: 设备用房、设备层的层高和垂直运输交通应满足设备荷载、安装、维修的要求，并应留有能满足最大设备安装、检修的进出口及检修通道。
    interpret: 设备用房层高和垂直运输要满足设备荷载、安装、维修，并留出最大设备的进出通道和检修通道。画设备房时要按最大设备的尺寸留门洞和吊装孔，不是按常规门。
    severity_hint: error
    keywords:
      - 设备用房
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.8.3
    chapter: 5.8 设备用房
    verbatim: 设备机房应采取有效措施防止其对其他公共区域、邻近建筑或环境造成污染。
    interpret: 设备机房要防止对其他公共区域、邻近建筑或环境造成污染。噪声、振动、废气、电磁都算，位置选择和隔振构造是主要手段。
    severity_hint: error
    keywords:
      - 设备用房
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.9.1
    chapter: 5.9 地下室、半地下室
    verbatim: 地下室、半地下室的出入口（坡道）、窗井、风井，下沉庭院（下沉式广场）、地下管道（沟）、地下坑井等应采取必要的截水、挡水及排水等防止涌水、倒灌的措施，并应满足内涝防治要求。
    interpret: 地下室出入口坡道、窗井、风井、下沉庭院、地下管道、坑井都要做截水挡水排水，满足内涝防治。下沉庭院和坡道口是进水口，必须有反坡、截水沟和集水坑。
    severity_hint: error
    keywords:
      - 地下室、半地下室
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.9.2
    chapter: 5.9 地下室、半地下室
    verbatim: 地下室、半地下室与土壤接触的底板、顶板以及侧墙外壁，应满足防水、防潮要求。
    interpret: 地下室与土壤接触的底板、顶板、侧墙外壁要满足防水防潮。防水等级按 GB 50108 选，图纸的防水做法表里要写明。
    severity_hint: error
    keywords:
      - 地下室、半地下室
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.9.3
    chapter: 5.9 地下室、半地下室
    verbatim: 当地下室顶板作为室外场地使用时，设计应满足日常使用的最大荷载要求，后期使用荷载不能超过设计的最大荷载要求。
    interpret: 地下室顶板作为室外场地使用时，设计要满足日常最大荷载，后期使用荷载不得超过设计值。顶板上做绿化、停车、消防车道，荷载差别很大，图纸要注明限载。
    severity_hint: error
    keywords:
      - 地下室、半地下室
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/5.9.4
    chapter: 5.9 地下室、半地下室
    verbatim: 窗井、风井、下沉庭院的顶部周边应设置安全防护设施。
    interpret: 窗井、风井、下沉庭院的顶部周边要设安全防护设施。地面上的坑口都要有栏杆或盖板，总平面和首层平面都要表达。
    severity_hint: error
    keywords:
      - 地下室、半地下室
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.1.1
    chapter: 6.1 屋面
    verbatim: 屋面应合理采取保温、隔热、防水等措施。屋面防水应按排水与防水相结合的原则，根据建筑物的重要程度及使用功能，结合工程特点、气候条件等按不同等级设置防水层。
    interpret: 屋面要合理保温隔热防水；防水按排水与防水结合的原则，按重要程度和使用功能分级。分级依据 GB 50345，图纸做法表要写明防水等级。
    severity_hint: error
    keywords:
      - 屋面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.1.2
    chapter: 6.1 屋面
    verbatim: 屋面应符合下列规定：1 屋面应设置坡度，且坡度不应小于2%；2 屋面设计应进行排水计算。天沟、檐沟断面及雨水立管管径、数量应通过计算合理确定；3 装配式屋面应进行抗风揭设计，各构造层均应采取相应的固定措施；4 严寒和寒冷地区的屋面应采取防止冰雪融坠的安全措施；5 坡度大于45°瓦屋面，以及强风多发或抗震设防烈度为7度及以上地区的瓦屋面，应采取防止瓦材滑落、风揭的措施；6 种植屋面应满足种植荷载及耐根穿刺的构造要求；7 上人屋面应满足人员活动荷载，临空处应设置安全防护设施；8 屋面应方便维修、检修，大型公共建筑的屋面应设置检修口或检修通道。
    interpret: 屋面八条要求，数值最硬的是：屋面坡度不小于 2%；天沟檐沟和雨水立管要经排水计算；坡度大于 45° 的瓦屋面、强风区或 7 度以上抗震区的瓦屋面要防滑落风揭；上人屋面要满足活动荷载并在临空处防护。2% 是找坡底线，平屋面看似平其实必须有坡。
    severity_hint: error
    keywords:
      - 屋面
      - 2%
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.1.3
    chapter: 6.1 屋面
    verbatim: 建筑采光顶采用玻璃时，面向室内一侧应采用夹层玻璃；建筑雨篷采用玻璃时，应采用夹层玻璃。
    interpret: 采光顶用玻璃时，面向室内一侧必须夹层玻璃；玻璃雨篷必须夹层玻璃。夹层的作用是破裂后不散落，朝室内那一面尤其关键，单片钢化会整片掉落。
    severity_hint: error
    keywords:
      - 屋面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.1
    chapter: 6.2 内墙、外墙
    verbatim: 墙体应根据其在建筑物中的位置、作用和受力状态确定厚度、材料及构造做法，材料的选择应因地制宜。
    interpret: 墙体按位置、作用、受力状态定厚度材料构造。原则条，具体厚度在结构图和建筑构造详图里。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.2
    chapter: 6.2 内墙、外墙
    verbatim: 外墙应根据气候条件和建筑使用要求，采取保温隔热、隔声、防火、防水、防潮和防结露等措施。
    interpret: 外墙按气候和使用要求做保温隔热、隔声、防火、防水、防潮、防结露。六项性能与气候区绑定，北方重在保温和防结露，南方重在隔热防潮。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.3
    chapter: 6.2 内墙、外墙
    verbatim: 墙体防潮、防水应符合下列规定：1 砌筑墙体应在室外地面以上、室内地面垫层处设置连续的水平防潮层，室内相邻地面有高差时，应在高差处贴邻土壤一侧加设防潮层；2 有防潮要求的室内墙面迎水面应设防潮层，有防水要求的室内墙面迎水面应采取防水措施；3 有配水点的墙面应采取防水措施。
    interpret: 墙体防潮防水三条：砌体墙在室外地面以上、室内地面垫层处设连续水平防潮层，室内相邻地面有高差时在高差处贴邻土壤一侧加防潮层；有防潮要求的墙面迎水面设防潮层；有配水点的墙面做防水。水平防潮层是砌体建筑的生命线，少一道墙根就返潮。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.4
    chapter: 6.2 内墙、外墙
    verbatim: 外墙的洞口、门窗等处应采取防止墙体产生变形裂缝的加强措施。外窗台应采取排水、防水构造措施。
    interpret: 外墙洞口门窗处要防变形裂缝，外窗台要做排水防水构造。窗台泛水坡度和滴水线是立面详图的基本功。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.5
    chapter: 6.2 内墙、外墙
    verbatim: 设置在墙上的内、外保温系统与墙体、梁、柱的连接应安全可靠。
    interpret: 内外保温系统与墙体梁柱的连接要安全可靠。外墙外保温脱落是高发事故，锚栓数量、粘结面积率在做法表里要写。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.6
    chapter: 6.2 内墙、外墙
    verbatim: 安装固定在墙体上的设备或管道系统应安全可靠，并应具有防止雨水、雪水渗漏到室内的可靠措施。
    interpret: 固定在墙体上的设备和管道要安全可靠，并有防雨水雪水渗漏进室内的措施。外挂空调、太阳能、雨水管穿墙处都要有密封和防水节点。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.7
    chapter: 6.2 内墙、外墙
    verbatim: 安装在易于受到人体或物体碰撞部位的玻璃面板，应采取防护措施，并应设置提示标识。
    interpret: 易受人体或物体碰撞部位的玻璃面板要防护并设提示标识。落地玻璃、玻璃隔断的防撞条和警示带属于此项。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.2.8
    chapter: 6.2 内墙、外墙
    verbatim: 建筑幕墙应综合考虑建筑类别、使用功能、高度、所在地域的地理气候、环境等因素，合理选择幕墙形式和面板材料，并应符合下列规定：1 应具有承受自重、风、地震、温度作用的承载能力和变形能力，且应便于制作安装、维护保养及局部更换面板等构件；2 应满足建筑需求的水密、气密、保温隔热、隔声、采光、耐撞击、防火、防雷等性能要求；3 幕墙与主体结构的连接应牢固可靠，与主体结构的连接锚固件不应直接设置在填充砌体中；4 幕墙外开窗的开启扇应采取防脱落措施；5 玻璃幕墙的玻璃面板应采用安全玻璃，斜幕墙的玻璃面板应采用夹层玻璃；6 超高层建筑的幕墙工程应设置幕墙维护和更换所需的装置；7 外倾斜、水平倒挂的石材或脆性材质面板应采取防坠落措施。
    interpret: 幕墙七条要求：承载与变形能力、水密气密保温隔声采光耐撞防火防雷性能、与主体结构连接牢固且锚固件不得设在填充砌体中、外开窗扇防脱落、玻璃幕墙用安全玻璃且斜幕墙用夹层玻璃、超高层设维护更换装置、外倾或倒挂石材脆性面板要防坠落。第 3 条最常被施工简化——锚固件打进加气块里是重大隐患。
    severity_hint: error
    keywords:
      - 内墙、外墙
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.3.1
    chapter: 6.3 楼面、地面
    verbatim: 楼面、地面应根据建筑使用功能，满足隔声、保温、防水、防火等要求，其铺装面层应平整、防滑、耐磨、易清洁。
    interpret: 楼地面按功能满足隔声保温防水防火，面层平整防滑耐磨易清洁。总纲条。
    severity_hint: error
    keywords:
      - 楼面、地面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.3.2
    chapter: 6.3 楼面、地面
    verbatim: 地面应根据需要采取防潮、防止地基土冻胀或膨胀、防止不均匀沉陷等措施。
    interpret: 地面按需要防潮、防地基土冻胀或膨胀、防不均匀沉陷。北方冻胀、膨胀土地区、软土地基各有对策，属地基处理范畴。
    severity_hint: error
    keywords:
      - 楼面、地面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.3.3
    chapter: 6.3 楼面、地面
    verbatim: 建筑内的厕所（卫生间）、浴室、公共厨房、垃圾间等场所的楼面、地面，开敞式外廊、阳台的楼面应设防水层。
    interpret: 厕所、浴室、公共厨房、垃圾间等场所的楼地面，以及开敞式外廊、阳台的楼面要设防水层。注意开敞外廊和阳台也要防水——雨水会积在楼板上，下层就是住户的顶棚。
    severity_hint: error
    keywords:
      - 楼面、地面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.3.4
    chapter: 6.3 楼面、地面
    verbatim: 有易燃易爆物质的场所，有对静电敏感的电气或电子元件、组件、设备的场所，以及可能因人体静电放电对产品质量或人身安全带来危害的场所，应采用导（防）静电面层。
    interpret: 易燃易爆场所、对静电敏感的电气电子设备场所、人体静电可能危害产品质量或人身安全的场所，要用导（防）静电面层。机房、手术室、加油站附属用房等适用。
    severity_hint: error
    keywords:
      - 楼面、地面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.3.5
    chapter: 6.3 楼面、地面
    verbatim: 机动车库的楼面、地面应采用高强度且具有耐磨、防滑性能的材料。
    interpret: 机动车库楼地面要用高强度、耐磨、防滑材料。车库地面起砂是常见投诉，材料强度等级要写清。
    severity_hint: error
    keywords:
      - 楼面、地面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.3.6
    chapter: 6.3 楼面、地面
    verbatim: 存放食品、食料或药物的房间，楼面、地面面层应采用无污染、无异味、符合卫生防疫条件的环保材料。
    interpret: 存放食品、食料、药物的房间，楼地面面层要用无污染无异味、符合卫生防疫的环保材料。
    severity_hint: error
    keywords:
      - 楼面、地面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.3.7
    chapter: 6.3 楼面、地面
    verbatim: 地板玻璃应采用夹层玻璃，点支承地板玻璃应采用钢化夹层玻璃。钢化玻璃应进行均质处理。
    interpret: 地板玻璃必须夹层玻璃，点支承地板玻璃必须钢化夹层，钢化玻璃要做均质处理。均质处理是为了降低自爆率，玻璃地板没有夹层就是踩在碎片上。
    severity_hint: error
    keywords:
      - 楼面、地面
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.1
    chapter: 6.4 顶棚、吊顶
    verbatim: 建筑顶棚应满足防坠落、防火、抗震等安全要求，并应采取保障其安全使用的可靠技术措施。
    interpret: 顶棚要满足防坠落、防火、抗震，并有可靠技术措施。总纲条，具体在 6.4.2~6.4.11。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.2
    chapter: 6.4 顶棚、吊顶
    verbatim: 吊顶与主体结构的吊挂应采取安全构造措施。重量大于3kg的物体，以及有振动的设备应直接吊挂在建筑承重结构上。
    interpret: 吊顶与主体结构的吊挂要安全；重量大于 3kg 的物体和有振动的设备要直接吊挂在承重结构上。3kg 是个很小的门槛——灯具、风口、音箱很多都超过，不能挂在轻钢龙骨上。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
      - 3kg
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.3
    chapter: 6.4 顶棚、吊顶
    verbatim: 吊杆长度大于1.50m时，应设置反支撑。
    interpret: 吊杆长度大于 1.50m 时要设反支撑。吊杆越长越容易侧向失稳，1.50m 是开始需要反支撑的长度。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
      - 1.50m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.4
    chapter: 6.4 顶棚、吊顶
    verbatim: 吊杆、反支撑及钢结构转换层与主体结构的连接应安全牢固，且不应降低主体结构的安全性。
    interpret: 吊杆、反支撑、钢结构转换层与主体结构连接要牢固，且不得降低主体结构安全性。后置锚栓的承载力要验算，不能靠经验打。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.5
    chapter: 6.4 顶棚、吊顶
    verbatim: 管线较多的吊顶内应留有检修空间。当空间受限不能进入检修时，应采用便于拆卸的装配式吊顶或设置检修孔。
    interpret: 管线较多的吊顶内要留检修空间；不能进人检修时用可拆卸装配式吊顶或设检修孔。画吊顶平面时要标检修口位置。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.6
    chapter: 6.4 顶棚、吊顶
    verbatim: 面板为脆性材料的吊顶，应采取防坠落措施。玻璃吊顶应采用安全玻璃。
    interpret: 脆性材料面板的吊顶要防坠落；玻璃吊顶用安全玻璃。石膏板、矿棉板属脆性，大面积吊顶要有防坠钢丝或粘接。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.7
    chapter: 6.4 顶棚、吊顶
    verbatim: 设置永久马道的，马道应单独吊挂在建筑承重结构上。
    interpret: 设永久马道时，马道要单独吊挂在建筑承重结构上。马道不能借用吊顶吊杆，因为人和设备的重量远大于吊顶。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.8
    chapter: 6.4 顶棚、吊顶
    verbatim: 吊顶系统不应吊挂在吊顶内的设备管线或设施上。
    interpret: 吊顶系统不应吊挂在吊顶内的设备管线或设施上。管线本身也要承重，互相吊挂会形成连锁失效。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.9
    chapter: 6.4 顶棚、吊顶
    verbatim: 吊顶内敷设水管应采取防止产生冷凝水的措施。
    interpret: 吊顶内敷设水管要防冷凝水。冷水管在吊顶内结露滴水，需要保温或接水盘。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.10
    chapter: 6.4 顶棚、吊顶
    verbatim: 潮湿房间的吊顶，应采用防水或防潮材料，并应采取防结露、防滴水及排放冷凝水的措施。
    interpret: 潮湿房间的吊顶要用防水防潮材料，并防结露、防滴水、能排冷凝水。卫生间、游泳馆的吊顶要能耐受高湿。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.4.11
    chapter: 6.4 顶棚、吊顶
    verbatim: 室外吊顶应采取抗风揭措施；面板及支承结构表面应采取防腐措施。
    interpret: 室外吊顶要抗风揭，面板和支承结构表面要防腐。室外吊顶受风和雨双重作用，连接件等级要高于室内。
    severity_hint: error
    keywords:
      - 顶棚、吊顶
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.5.1
    chapter: 6.5 门窗
    verbatim: 门窗选用应根据建筑使用功能、节能要求、所在地区气候条件等因素综合确定，应满足抗风、水密、气密等性能要求，并应综合考虑安全、采光、节能、通风、防火、隔声等要求。
    interpret: 门窗选用要综合功能、节能、气候，满足抗风水密气密，并兼顾安全采光节能通风防火隔声。性能指标要在门窗表里逐项注明，不能只写尺寸。
    severity_hint: error
    keywords:
      - 门窗
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.5.2
    chapter: 6.5 门窗
    verbatim: 门窗与墙体应连接牢固，不同材料的门窗与墙体连接处应采取适宜的连接构造和密封措施。
    interpret: 门窗与墙体连接要牢固，不同材料交界处要用适宜的连接构造和密封措施。钢窗、铝窗、木窗与砌体、混凝土的节点各不相同。
    severity_hint: error
    keywords:
      - 门窗
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.5.3
    chapter: 6.5 门窗
    verbatim: 门的设置应符合下列规定：1 门应开启方便、使用安全、坚固耐用；2 手动开启的大门扇应有制动装置，推拉门应采取防脱轨的措施；3 非透明双向弹簧门应在可视高度部位安装透明玻璃。
    interpret: 门的三条：开启方便安全坚固；手动开启的大门扇要有制动装置，推拉门要防脱轨；非透明双向弹簧门要在可视高度装透明玻璃。最后一条是为了避免门两侧的人对撞。
    severity_hint: error
    keywords:
      - 门窗
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.5.4
    chapter: 6.5 门窗
    verbatim: 窗的设置应符合下列规定：1 窗扇的开启形式应能保障使用安全，且应启闭方便，易于维修、清洗；2 开向公共走道的窗扇开启不应影响人员通行，其底面距走道地面的高度不应小于2.00m；3 外开窗扇应采取防脱落措施。
    interpret: 窗的三条：开启形式要安全、便于维修清洗；开向公共走道的窗扇不得影响通行，底面距走道地面不小于 2.00m；外开窗扇要防脱落。2.00m 是让人能正常走过去的净高，走廊窗内开常见违规。
    severity_hint: error
    keywords:
      - 门窗
      - 2.00m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.5.5
    chapter: 6.5 门窗
    verbatim: 全玻璃的门和落地窗应选用安全玻璃，并应设防撞提示标识。
    interpret: 全玻璃门和落地窗要用安全玻璃并设防撞标识。与 5.1.2 呼应，公共建筑入口是重点部位。
    severity_hint: error
    keywords:
      - 门窗
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.5.6
    chapter: 6.5 门窗
    verbatim: 民用建筑（除住宅外）临空窗的窗台距楼地面的净高低于0.80m时应设置防护设施，防护高度由楼地面（或可踏面）起计算不应小于0.80m。
    interpret: 除住宅外，临空窗的窗台距楼地面净高低于 0.80m 时要设防护，防护高度从楼地面或可踏面起算不小于 0.80m。两个 0.80m 分别是「窗台低了要防护」和「防护本身要多高」，别混。住宅另有 GB 55038 的 0.90m 规定。
    severity_hint: error
    keywords:
      - 门窗
      - 0.80m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.5.7
    chapter: 6.5 门窗
    verbatim: 天窗的设置应符合下列规定：1 采光天窗应采用防破碎坠落的透光材料，当采用玻璃时，应使用夹层玻璃或夹层中空玻璃；2 天窗应设置冷凝水导泄装置，采取防冷凝水产生的措施，多雪地区应考虑积雪对天窗的影响；3 天窗的连接应牢固、安全，开启扇启闭应方便可靠。
    interpret: 天窗三条：采光天窗用防破碎坠落材料，玻璃要用夹层或夹层中空玻璃；设冷凝水导泄并防结露，多雪地区考虑积雪；连接牢固、开启方便。天窗是漏水高发点，导泄构造要画详图。
    severity_hint: error
    keywords:
      - 门窗
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.6.1
    chapter: 6.6 栏杆、栏板
    verbatim: 阳台、外廊、室内回廊、中庭、内天井、上人屋面及楼梯等处的临空部位应设置防护栏杆（栏板），并应符合下列规定：1 栏杆（栏板）应以坚固、耐久的材料制作，应安装牢固，并应能承受相应的水平荷载；2 栏杆（栏板）垂直高度不应小于1.10m。栏杆（栏板）高度应按所在楼地面或屋面至扶手顶面的垂直高度计算，如底面有宽度大于或等于0.22m，且高度不大于0.45m的可踏部位，应按可踏部位顶面至扶手顶面的垂直高度计算。
    interpret: 临空部位要设栏杆栏板：材料坚固耐久、安装牢固、能承受水平荷载；垂直高度不小于 1.10m，从楼地面或屋面量到扶手顶面；如果底面有宽度大于等于 0.22m 且高度不大于 0.45m 的可踏部位，要从可踏部位顶面量起。可踏部位的规定是为了防止人踩着花池、窗台翻出去——这是栏杆高度计算最容易被忽略的一条。
    severity_hint: error
    keywords:
      - 栏杆、栏板
      - 1.10m
      - 0.22m
      - 0.45m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.6.2
    chapter: 6.6 栏杆、栏板
    verbatim: 楼梯、阳台、平台、走道和中庭等临空部位的玻璃栏板应采用夹层玻璃。
    interpret: 楼梯、阳台、平台、走道、中庭等临空部位的玻璃栏板必须用夹层玻璃。钢化玻璃自爆会整片消失，夹层玻璃破裂后仍能拦住人。
    severity_hint: error
    keywords:
      - 栏杆、栏板
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.6.3
    chapter: 6.6 栏杆、栏板
    verbatim: 少年儿童专用活动场所的栏杆应采取防止攀滑措施，当采用垂直杆件做栏杆时，其杆件净间距不应大于0.11m。
    interpret: 少年儿童专用活动场所的栏杆要防攀滑；用垂直杆件时净间距不大于 0.11m。0.11m 是儿童头部能穿过的临界尺寸，幼儿园、小学的栏杆必须卡这个数。
    severity_hint: error
    keywords:
      - 栏杆、栏板
      - 0.11m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.6.4
    chapter: 6.6 栏杆、栏板
    verbatim: 公共场所的临空且下部有人员活动部位的栏杆（栏板），在地面以上0.10m高度范围内不应留空。
    interpret: 公共场所临空且下部有人员活动部位的栏杆，在地面以上 0.10m 高度范围内不应留空。防止儿童或宠物从底部钻出，也防止杂物滚落。
    severity_hint: error
    keywords:
      - 栏杆、栏板
      - 0.10m
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.7.1
    chapter: 6.7 管道井、烟道、通风道
    verbatim: 管道井的设置应符合下列规定：1 安全、防火或卫生等方面互有影响的管线不应敷设在同一管道井内；2 管道井的断面尺寸应满足管道安装、检修所需空间的要求；3 管道井与楼板的缝隙应采取封堵措施。
    interpret: 管道井三条：安全防火卫生互有影响的管线不得共井；断面尺寸满足安装检修；管道井与楼板缝隙要封堵。封堵是防火分隔的关键，楼板洞不封就是竖向火蔓延通道。
    severity_hint: error
    keywords:
      - 管道井、烟道、通风道
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.7.2
    chapter: 6.7 管道井、烟道、通风道
    verbatim: 管道井、烟道和通风道应独立设置。
    interpret: 管道井、烟道、通风道应独立设置。烟道串味、排风道串气都源于合用，住宅厨房烟道尤其不能与卫生间排风道合并。
    severity_hint: error
    keywords:
      - 管道井、烟道、通风道
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.7.3
    chapter: 6.7 管道井、烟道、通风道
    verbatim: 伸出屋面的烟道或排风道，其伸出高度应根据屋面形式、排出口周围遮挡物的高度和距离、屋面积雪深度等因素合理确定，应有利于烟气扩散和防止烟气倒灌。
    interpret: 伸出屋面的烟道排风道，伸出高度要按屋面形式、周围遮挡物高度距离、积雪深度确定，要利于扩散和防倒灌。屋面上的一堆出屋面构件会互相干扰，位置要统一排布。
    severity_hint: error
    keywords:
      - 管道井、烟道、通风道
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.8.1
    chapter: 6.8 变形缝
    verbatim: 变形缝应根据建筑使用要求合理设置，并应采取防水、防火、保温、隔声等构造措施，各种措施应具有防老化、防腐蚀和防脱落等性能。
    interpret: 变形缝要按使用要求设置，并做防水防火保温隔声构造，措施要防老化防腐蚀防脱落。变形缝是渗漏和串声的高发点，做法要选定型产品。
    severity_hint: error
    keywords:
      - 变形缝
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.8.2
    chapter: 6.8 变形缝
    verbatim: 变形缝设置应能保障建筑物在产生位移或变形时不受阻，且不产生破坏。
    interpret: 变形缝要保证建筑位移或变形时不受阻、不破坏。缝宽要按结构计算留足，塞太满等于没缝。
    severity_hint: error
    keywords:
      - 变形缝
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.8.3
    chapter: 6.8 变形缝
    verbatim: 厕所、卫生间、盥洗室和浴室等防水设防区域不应跨越变形缝。
    interpret: 厕所、卫生间、盥洗室、浴室等防水设防区域不应跨越变形缝。防水层跨缝必裂，平面布局时厕所要避开变形缝。
    severity_hint: error
    keywords:
      - 变形缝
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.8.4
    chapter: 6.8 变形缝
    verbatim: 配电间及其他严禁有漏水的房间不应跨越变形缝。
    interpret: 配电间及其他严禁漏水的房间不应跨越变形缝。配电间进水就是短路起火，与 6.8.3 同理。
    severity_hint: error
    keywords:
      - 变形缝
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
  - clause_id: GB55031-2022/6.8.5
    chapter: 6.8 变形缝
    verbatim: 门不应跨越变形缝设置。
    interpret: 门不应跨越变形缝设置。门跨缝会在建筑变形时卡死或撕裂，这条在走廊尽端和长建筑分段处最容易出现。
    severity_hint: error
    keywords:
      - 变形缝
    status: effective
    source_url: https://gf.cabr-fire.com/list-1535.htm
