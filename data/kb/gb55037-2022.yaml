      - 1部
      - 200m2
      - 50人
  - clause_id: GB55037-2022/7.4.2
    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: |-
      公共建筑内每个房间的疏散门不应少于2 个；儿童活动场所、老年人照料设施中的老年人活动场所、医疗建筑中的治疗室和病房、教学建筑中的教学用房，当位于走道尽端时，疏散门不应少于2 个；公共建筑内仅设置1 个疏散门的房间应符合下列条件之一：
      1 对于儿童活动场所、老年人照料设施中的老年人活动场所，房间位于两个安全出口之间或袋形走道两侧且建筑面积不大于50m2；
      2 对于医疗建筑中的治疗室和病房、教学建筑中的教学用房，房间位于两个安全出口之间或袋形走道两侧且建筑面积不大于75m2；
      3 对于歌舞娱乐放映游艺场所，房间的建筑面积不大于50m2且经常停留人数不大于15 人；
      4 对于其他用途的场所，房间位于两个安全出口之间或袋形走道两侧且建筑面积不大于120m2；
      5 对于其他用途的场所，房间位于走道尽端且建筑面积不大于50m2；
      6 对于其他用途的场所，房间位于走道尽端且建筑面积不大于200m2、房间内任一点至疏散门的直线距离不大于15m、疏散门的净宽度不小于1.40m。
    interpret: 公共建筑每个房间疏散门不应少于2个；儿童活动场所、老年人活动场所、医疗建筑的治疗室与病房、教学建筑的教学用房，位于走道尽端时也必须2个门。仅设1个疏散门的六种例外：①儿童活动场所与老年人活动场所，位于两个安全出口之间或袋形走道两侧且面积不大于50m²；②医疗治疗室病房、教学用房，同位置且不大于75m²；③歌舞娱乐场所房间，面积不大于50m² 且经常停留人数不大于15人；④其他用途，位于两出口之间或袋形走道两侧且不大于120m²；⑤其他用途位于走道尽端且不大于50m²；⑥其他用途位于走道尽端、不大于200m²、房间内任一点到疏散门直线距离不大于15m、门净宽不小于1.40m。
    severity_hint: error
    keywords:
      - 公共建筑和非住宅类居住建筑
      - 2个
      - 1个
      - 50m2
      - 75m2
      - 15人
      - 120m2
      - 200m2
  - clause_id: GB55037-2022/7.4.3
    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: 位于高层建筑内的儿童活动场所，安全出口和疏散楼梯应独立设置。
