standard: GB55037-2022
standard_name: 建筑防火通用规范
effective_from: '2023-06-01'
source_url: https://ha.119.gov.cn/2025/04-16/3491624.html
source_note: verbatim 由 PDF 机械切分；interpret / machine 待人工补全。
clauses:
  - clause_id: GB55037-2022/1.0.1
    chapter: 1 总则
    verbatim: 为预防建筑火灾、减少火灾危害，保障人身和财产安全，使建筑防火要求安全适用、技术先进、经济合理，依据有关法律、法规，制定本规范。
    interpret: 立法目的条，说明这本规范为什么存在，不产生任何可检项。引用它的场合通常是解释「为什么某条是强条」。
    severity_hint: info
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/1.0.2
    chapter: 1 总则
    verbatim: 除生产和储存民用爆炸物品的建筑外，新建、改建和扩建建筑在规划、设计、施工、使用和维护中的防火，以及既有建筑改造、使用和维护中的防火，必须执行本规范。
    interpret: 定适用范围与强制属性：除生产和储存民用爆炸物品的建筑外，新建、改建、扩建建筑的规划、设计、施工、使用维护全过程都必须执行。用词是「必须」，没有豁免空间；民爆建筑走专门规范。
    severity_hint: error
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/1.0.3
    chapter: 1 总则
    verbatim: 生产和储存易燃易爆物品的厂房、仓库等，应位于城镇规划区的边缘或相对独立的安全地带。
    interpret: 管选址：生产和储存易燃易爆物品的厂房、仓库应位于城镇规划区边缘或相对独立的安全地带。这是总平面阶段的判断，单体平面图上看不出来。
    severity_hint: error
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/1.0.4
    chapter: 1 总则
    verbatim: 城镇耐火等级低的既有建筑密集区，应采取防火分隔措施、设置消防车通道、完善消防水源和市政消防给水与市政消火栓系统。
    interpret: 针对城镇里耐火等级低的既有建筑密集区，要求采取防火分隔、设消防车通道、完善消防水源与市政消火栓。属城市更新、老旧小区改造类项目的要求。
    severity_hint: error
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/1.0.5
    chapter: 1 总则
    verbatim: 既有建筑改造应根据建筑的现状和改造后的建筑规模、火灾危险性和使用用途等因素确定相应的防火技术要求，并达到本规范规定的目标、功能和性能要求。城镇建成区内影响消防安全的既有厂房、仓库等应迁移或改造。
    interpret: 既有建筑改造的防火要求怎么定：按建筑现状加上改造后的规模、火灾危险性、使用用途综合确定，最终要达到本规范的目标、功能和性能要求。注意它并未要求改造后的建筑照搬新建建筑的全部条文，判据是性能。建成区内影响消防安全的既有厂房、仓库应迁移或改造。
    severity_hint: error
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/1.0.6
    chapter: 1 总则
    verbatim: 在城市建成区内不应建设压缩天然气加气母站，一级汽车加油站、加气站、加油加气合建站。
    interpret: 选址禁令：城市建成区内不应建设压缩天然气加气母站，以及一级汽车加油站、加气站、加油加气合建站。
    severity_hint: error
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/1.0.7
    chapter: 1 总则
    verbatim: 城市消防站应位于易燃易爆危险品场所或设施全年最小频率风向的下风侧，其用地边界距离加油站、加气站、加油加气合建站不应小于50m，距离甲、乙类厂房和易燃易爆危险品储存场所不应小于200m。城市消防站执勤车辆的主出入口，距离人员密集的大型公共建筑的主要疏散出口不应小于50m。
    interpret: 城市消防站选址的三个硬距离：应位于易燃易爆场所全年最小频率风向的下风侧；用地边界距加油站、加气站、合建站不应小于50m；距甲、乙类厂房和易燃易爆危险品储存场所不应小于200m；执勤车辆主出入口距人员密集大型公共建筑的主要疏散出口不应小于50m。
    severity_hint: error
    keywords:
      - 1 总则
      - 50m
      - 200m
  - clause_id: GB55037-2022/1.0.8
    chapter: 1 总则
    verbatim: 工程建设所采用的技术方法和措施是否符合本规范要求，由相关责任主体判定。其中，创新性的技术方法和措施应进行论证并符合本规范中有关性能的要求。
    interpret: 技术方法和措施是否符合本规范，由相关责任主体自己判定；创新性方法应论证并满足本规范的性能要求。这条既给性能化设计留了通道，也把判定责任明确给了建设与设计方，不是规范替人背书。
    severity_hint: error
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/1.0.9
    chapter: 1 总则
    verbatim: 违反本规范规定，依照有关法律法规的规定予以处罚。
    interpret: 违反规定的处罚条款，属引致性条文，本身不含技术要求，也不产生任何图纸检查项。
    severity_hint: info
    keywords:
      - 1 总则
  - clause_id: GB55037-2022/2.1.1
    chapter: 2.1 目标与功能
    verbatim: 建筑的防火性能和设防标准应与建筑的高度（埋深）、层数、规模、类别、使用性质、功能用途、火灾危险性等相适应。
    interpret: 原则条：防火性能和设防标准要与建筑的高度（埋深）、层数、规模、类别、使用性质、功能用途、火灾危险性相适应。后面所有分类取值——耐火等级、防火分区面积、疏散距离——都以这条为总依据。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.1.2
    chapter: 2.1 目标与功能
    verbatim: |-
      建筑防火应达到下列目标要求：
      1 保障人身和财产安全及人身健康；
      2 保障重要使用功能，保障生产、经营或重要设施运行的连续性；
      3 保护公共利益；
      4 保护环境、节约资源。
    interpret: 四项防火目标：保障人身财产安全与健康、保障重要使用功能与生产连续性、保护公共利益、保护环境节约资源。这是性能化设计论证时的目标基准，不是可直接检查的条文。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.1.3
    chapter: 2.1 目标与功能
    verbatim: |-
      建筑防火应符合下列功能要求：
      1 建筑的承重结构应保证其在受到火或高温作用后，在设计耐火时间内仍能正常发挥承载功能；
      2 建筑应设置满足在建筑发生火灾时人员安全疏散或避难需要的设施；
      3 建筑内部和外部的防火分隔应能在设定时间内阻止火灾蔓延至相邻建筑或建筑内的其他防火分隔区域；
      4 建筑的总平面布局及与相邻建筑的间距应满足消防救援的要求。
    interpret: 四项功能要求：承重结构在耐火时间内保持承载、设置满足疏散避难需要的设施、防火分隔能在设定时间内阻止蔓延、总平面布局与间距满足消防救援。具体条文没覆盖到的做法，可回到这四条论证。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.1.4
    chapter: 2.1 目标与功能
    verbatim: 在赛事、博览、避险、救灾及灾区生活过渡期间建设的临时建筑或设施，其规划、设计、施工和使用应符合消防安全要求。灾区过渡安置房集中布置区域应按照不同功能区域分别单独划分防火分隔区域。每个防火分隔区域的占地面积不应大于2500m²，且周围应设置可供消防车通行的道路。
    interpret: 临时建筑（赛事、博览、避险、救灾、灾区生活过渡期间）的规划、设计、施工、使用也要符合消防要求。灾区过渡安置房集中布置区应按功能分区单独划分防火分隔区域，每个区域占地不应大于2500m²，周围应设可供消防车通行的道路。
    severity_hint: error
    keywords:
      - 目标与功能
      - 2500m²
  - clause_id: GB55037-2022/2.1.5
    chapter: 2.1 目标与功能
    verbatim: 厂房内的生产工艺布置和生产过程控制，工艺装置、设备与仪器仪表、材料等的设计和设置，应根据生产部位的火灾危险性采取相应的防火、防爆措施。
    interpret: 厂房内的生产工艺布置、过程控制，以及工艺装置、设备仪表、材料的设置，要按生产部位的火灾危险性采取相应防火防爆措施。属工艺专业内容，建筑平面图上看不出，靠设计说明和工艺图。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.1.6
    chapter: 2.1 目标与功能
    verbatim: 交通隧道的防火要求应根据其建设位置、封闭段的长度、交通流量、通行车辆的类型、环境条件及附近消防站设置情况等因素综合确定。
    interpret: 交通隧道的防火要求按建设位置、封闭段长度、交通流量、通行车辆类型、环境条件、附近消防站情况综合确定。隧道专项条文。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.1.7
    chapter: 2.1 目标与功能
    verbatim: 建筑中有可燃气体、蒸气、粉尘、纤维爆炸危险性的场所或部位，应采取防止形成爆炸条件的措施；当采用泄压、减压、结构抗爆或防爆措施时，应保证建筑的主要承重结构在燃烧爆炸产生的压强作用下仍能发挥其承载功能。
    interpret: 有可燃气体、蒸气、粉尘、纤维爆炸危险的场所要采取措施防止形成爆炸条件；采用泄压、减压、结构抗爆或防爆措施时，主要承重结构在燃烧爆炸产生的压强作用下仍要能承载。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.1.8
    chapter: 2.1 目标与功能
    verbatim: 在有可燃气体、蒸气、粉尘、纤维爆炸危险性的环境内，可能产生静电的设备和管道均应具有防止发生静电或静电积累的性能。
    interpret: 爆炸危险环境内可能产生静电的设备和管道，都应具有防止产生静电或静电积累的性能。设备专业条文。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.1.9
    chapter: 2.1 目标与功能
    verbatim: |-
      建筑中散发较空气轻的可燃气体、蒸气的场所或部位，应采取防止可燃气体、蒸气在室内积聚的措施；散发较空气重的可燃气体、蒸气或有粉尘、纤维爆炸危险性的场所或部位，应符合下列规定：
      1 楼地面应具有不发火花的性能，使用绝缘材料铺设的整体楼地面面层应具有防止发生静电的性能；
      2 散发可燃粉尘、纤维场所的内表面应平整、光滑，易于清扫；
      3 场所内设置地沟时，应采取措施防止可燃气体、蒸气、粉尘、纤维在地沟内积聚，并防止火灾通过地沟与相邻场所的连通处蔓延。
    interpret: 比空气轻的可燃气体、蒸气要防止在室内积聚；比空气重的可燃气体、蒸气或有粉尘纤维爆炸危险的场所另有三项要求：楼地面不发火花且绝缘面层防静电、内表面平整光滑易清扫、设地沟时要防止积聚并防止火灾沿地沟蔓延。
    severity_hint: error
    keywords:
      - 目标与功能
  - clause_id: GB55037-2022/2.2.1
    chapter: 2.2 消防救援设施
    verbatim: 建筑的消防救援设施应与建筑的高度（埋深）、进深、规模等相适应，并应满足消防救援的要求。
    interpret: 原则条：消防救援设施要与建筑高度（埋深）、进深、规模相适应，并满足救援要求。
    severity_hint: error
    keywords:
      - 消防救援设施
  - clause_id: GB55037-2022/2.2.2
    chapter: 2.2 消防救援设施
    verbatim: 在建筑与消防车登高操作场地相对应的范围内，应设置直通室外的楼梯或直通楼梯间的入口。
    interpret: 在建筑与消防车登高操作场地相对应的范围内，应设直通室外的楼梯或直通楼梯间的入口。落在一层平面图上就是：登高场地对着的那段外墙必须有门或楼梯出口，不能是实墙或只开窗。
    severity_hint: error
    keywords:
      - 消防救援设施
  - clause_id: GB55037-2022/2.2.3
    chapter: 2.2 消防救援设施
    verbatim: |-
      除有特殊要求的建筑和甲类厂房可不设置消防救援口外，在建筑的外墙上应设置便于消防救援人员出入的消防救援口，并应符合下列规定：
      1 沿外墙的每个防火分区在对应消防救援操作面范围内设置的消防救援口不应少于2 个；
      2 无外窗的建筑应每层设置消防救援口，有外窗的建筑应自第三层起每层设置消防救援口；
      3 消防救援口的净高度和净宽度均不应小于1.0m，当利用门时，净宽度不应小于0.8m；
      4 消防救援口应易于从室内和室外打开或破拆，采用玻璃窗时，应选用安全玻璃；
      5 消防救援口应设置可在室内和室外识别的永久性明显标志。
    interpret: 消防救援口，平面与立面都管：除有特殊要求的建筑和甲类厂房外，外墙应设消防救援口。每个防火分区在对应操作面范围内不少于2个；无外窗的建筑每层设，有外窗的自第三层起每层设；净高与净宽均不小于1.0m，利用门时净宽不小于0.8m；应易于从室内外打开或破拆，玻璃窗用安全玻璃；室内外都要有永久性明显标志。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 2个
      - 1.0m
      - 0.8m
  - clause_id: GB55037-2022/2.2.4
    chapter: 2.2 消防救援设施
    verbatim: 设置机械加压送风系统并靠外墙或可直通屋面的封闭楼梯间、防烟楼梯间，在楼梯间的顶部或最上一层外墙上应设置常闭式应急排烟窗，且该应急排烟窗应具有手动和联动开启功能。
    interpret: 设机械加压送风系统、且靠外墙或可直通屋面的封闭楼梯间与防烟楼梯间，要在楼梯间顶部或最上一层外墙设常闭式应急排烟窗，并具有手动和联动开启功能。
    severity_hint: error
    keywords:
      - 消防救援设施
  - clause_id: GB55037-2022/2.2.5
    chapter: 2.2 消防救援设施
    verbatim: |-
      除有特殊功能、性能要求或火灾发展缓慢的场所可不在外墙或屋顶设置应急排烟排热设施外，下列无可开启外窗的地上建筑或部位均应在其每层外墙和（或）屋顶上设置应急排烟排热设施，且该应急排烟排热设施应具有手动、联动或依靠烟气温度等方式自动开启的功能：
      1 任一层建筑面积大于2500m²的丙类厂房；
      2 任一层建筑面积大于2500m²的丙类仓库；
      3 任一层建筑面积大于2500m²的商店营业厅、展览厅、会议厅、多功能厅、宴会厅，以及这些建筑中长度大于60m 的走道；
      4 总建筑面积大于1000m²的歌舞娱乐放映游艺场所中的房间和走道；
      5 靠外墙或贯通至建筑屋顶的中庭。
    interpret: 无可开启外窗的地上建筑或部位要设应急排烟排热设施（手动、联动或靠烟气温度自动开启）。五类场所：任一层建筑面积大于2500m²的丙类厂房、丙类仓库、商店营业厅与展览会议宴会厅等及其长度大于60m的走道、总建筑面积大于1000m²的歌舞娱乐放映游艺场所的房间和走道、靠外墙或贯通至屋顶的中庭。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 2500m²
      - 60m
      - 1000m²
  - clause_id: GB55037-2022/2.2.6
    chapter: 2.2 消防救援设施
    verbatim: |-
      除城市综合管廊、交通隧道和室内无车道且无人员停留的机械式汽车库可不设置消防电梯外，下列建筑均应设置消防电梯，且每个防火分区可供使用的消防电梯不应少于1 部：
      1 建筑高度大于33m 的住宅建筑；
      2 5 层及以上且建筑面积大于3000m²（包括设置在其他建筑内第五层及以上楼层）的老年人照料设施；
      3 一类高层公共建筑，建筑高度大于32m 的二类高层公共建筑；
      4 建筑高度大于32m 的丙类高层厂房；
      5 建筑高度大于32m 的封闭或半封闭汽车库；
      6 除轨道交通工程外，埋深大于10m 且总建筑面积大于3000m²的地下或半地下建筑（室）。
    interpret: 应设消防电梯的六类建筑：建筑高度大于33m的住宅；5层及以上且建筑面积大于3000m²的老年人照料设施；一类高层公共建筑与建筑高度大于32m的二类高层公共建筑；建筑高度大于32m的丙类高层厂房；建筑高度大于32m的封闭或半封闭汽车库；埋深大于10m且总建筑面积大于3000m²的地下或半地下建筑。每个防火分区可供使用的消防电梯不少于1部。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 1部
      - 33m
      - 5层
      - 3000m²
      - 32m
      - 10m
  - clause_id: GB55037-2022/2.2.7
    chapter: 2.2 消防救援设施
    verbatim: 埋深大于15m 的地铁车站公共区应设置消防专用通道。
    interpret: 埋深大于15m的地铁车站公共区应设消防专用通道。地铁专项。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 15m
  - clause_id: GB55037-2022/2.2.8
    chapter: 2.2 消防救援设施
    verbatim: |-
      除仓库连廊、冷库穿堂和筒仓工作塔内的消防电梯可不设置前室外，其他建筑内的消防电梯均应设置前室。消防电梯的前室应符合下列规定：
      1 前室在首层应直通室外或经专用通道通向室外，该通道与相邻区域之间应采取防火分隔措施。
      2 前室的使用面积不应小于6.0m²，合用前室的使用面积应符合本规范第7.1.8 条的规定；前室的短边不应小于2.4m。
      3 前室或合用前室应采用防火门和耐火极限不低于2.00h 的防火隔墙与其他部位分隔。除兼作消防电梯的货梯前室无法设置防火门的开口可采用防火卷帘分隔外，不应采用防火卷帘或防火玻璃墙等方式替代防火隔墙。
    interpret: 消防电梯前室：除仓库连廊、冷库穿堂、筒仓工作塔内的消防电梯外都要设。首层应直通室外或经专用通道通向室外且通道与相邻区域有防火分隔；使用面积不小于6.0m²，合用前室按7.1.8条，短边不小于2.4m；应采用防火门和耐火极限不低于2.00h的防火隔墙分隔，不得用防火卷帘或防火玻璃墙替代（仅兼作货梯前室无法设防火门的开口可用卷帘）。平面图上门洞宽度、前室净尺寸直接可量。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 6.0m²
      - 2.4m
      - 2.00h
  - clause_id: GB55037-2022/2.2.9
    chapter: 2.2 消防救援设施
    verbatim: 消防电梯井和机房应采用耐火极限不低于2.00h 且无开口的防火隔墙与相邻井道、机房及其他房间分隔。消防电梯的井底应设置排水设施，排水井的容量不应小于2m³，排水泵的排水量不应小于10L/s。
    interpret: 消防电梯井与机房要用耐火极限不低于2.00h且无开口的防火隔墙与相邻井道、机房及其他房间分隔；井底设排水设施，排水井容量不小于2m³，排水泵排水量不小于10L/s。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 2.00h
      - 2m
  - clause_id: GB55037-2022/2.2.10
    chapter: 2.2 消防救援设施
    verbatim: |-
      消防电梯应符合下列规定：
      1 应能在所服务区域每层停靠；
      2 电梯的载重量不应小于800kg；
      3 电梯的动力和控制线缆与控制面板的连接处、控制面板的外壳防水性能等级不应低于IPX5；
      4 在消防电梯的首层入口处，应设置明显的标识和供消防救援人员专用的操作按钮；
      5 电梯轿厢内部装修材料的燃烧性能应为A 级；
      6 电梯轿厢内部应设置专用消防对讲电话和视频监控系统的终端设备。
    interpret: 消防电梯的六项性能：能在所服务区域每层停靠；载重量不小于800kg；动力与控制线缆同控制面板连接处、控制面板外壳的防水等级不低于IPX5；首层入口设明显标识和消防救援专用操作按钮；轿厢内部装修材料燃烧性能为A级；轿厢内设专用消防对讲电话和视频监控终端。
    severity_hint: error
    keywords:
      - 消防救援设施
  - clause_id: GB55037-2022/2.2.11
    chapter: 2.2 消防救援设施
    verbatim: 建筑高度大于250m 的工业与民用建筑，应在屋顶设置直升机停机坪。
    interpret: 建筑高度大于250m的工业与民用建筑，应在屋顶设直升机停机坪。超高层专项。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 250m
  - clause_id: GB55037-2022/2.2.12
    chapter: 2.2 消防救援设施
    verbatim: |-
      屋顶直升机停机坪的尺寸和面积应满足直升机安全起降和救助的要求，并应符合下列规定：
      1 停机坪与屋面上突出物的最小水平距离不应小于5m；
      2 建筑通向停机坪的出口不应少于2 个；
      3 停机坪四周应设置航空障碍灯和应急照明装置；
      4 停机坪附近应设置消火栓。
    interpret: 屋顶直升机停机坪的四项要求：与屋面上突出物的最小水平距离不小于5m；建筑通向停机坪的出口不少于2个；四周设航空障碍灯和应急照明；停机坪附近设消火栓。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 5m
      - 2个
  - clause_id: GB55037-2022/2.2.13
    chapter: 2.2 消防救援设施
    verbatim: 供直升机救助使用的设施应避免火灾或高温烟气的直接作用，其结构承载力、设备与结构的连接应满足设计允许的人数停留和该地区最大风速作用的要求。
    interpret: 供直升机救助使用的设施应避免火灾或高温烟气的直接作用，其结构承载力与设备连接要满足设计允许的停留人数和当地最大风速。
    severity_hint: error
    keywords:
      - 消防救援设施
  - clause_id: GB55037-2022/2.2.14
    chapter: 2.2 消防救援设施
    verbatim: |-
      消防通信指挥系统应具有下列基本功能：
      1 责任辖区和跨区域灭火救援调度指挥；
      2 火场及其他灾害事故现场指挥通信；
      3 通信指挥信息管理；
      4 集中接收和处理责任辖区火灾、以抢救人员生命为主的危险化学品泄漏、道路交通事故、地震及其次生灾害、建筑坍塌、重大安全生产事故、空难、爆炸及恐怖事件和群众遇险事件等灾害事故报警。
    interpret: 消防通信指挥系统的四项基本功能：责任辖区与跨区域调度指挥、火场及灾害现场指挥通信、通信指挥信息管理、集中接处警。属城市消防系统，与单体建筑图无关。
    severity_hint: error
    keywords:
      - 消防救援设施
  - clause_id: GB55037-2022/2.2.15
    chapter: 2.2 消防救援设施
    verbatim: |-
      消防通信指挥系统的主要性能应符合下列规定：
      1 应采用北京时间计时，计时最小量度为秒，系统内保持时钟同步；
      2 应能同时受理2 起以上火灾、以抢救人员生命为主的危险化学品泄漏、道路交通事故、地震及其次生灾害、建筑坍塌、重大安全生产事故、空难、爆炸及恐怖事件和群众遇险事件等灾害事故报警；
      3 应能同时对2 起以上火灾、以抢救人员生命为主的危险化学品泄漏、道路交通事故、地震及其次生灾害、建筑坍塌、重大安全生产事故、空难、爆炸及恐怖事件和群众遇险事件等灾害事故进行灭火救援调度指挥；
      4 城市消防通信指挥系统从接警到消防站收到第一出动指令的时间不应大于45s。
    interpret: 消防通信指挥系统的性能指标：采用北京时间、计时最小量度到秒并全场时钟同步；能同时受理2起以上灾害报警；能同时对2起以上灾害调度指挥；城市系统从接警到消防站收到第一出动指令的时间不大于45s。
    severity_hint: error
    keywords:
      - 消防救援设施
      - 45s
  - clause_id: GB55037-2022/2.2.16
    chapter: 2.2 消防救援设施
    verbatim: |-
      消防通信指挥系统的运行安全应符合下列规定：
      1 重要设备或重要设备的核心部件应有备份；
      2 指挥通信网络应相对独立、常年畅通；
      3 系统软件不能正常运行时，应能保证电话接警和调度指挥畅通；
      4 火警电话呼入线路或设备出现故障时，应能切换到火警应急接警电话线路或设备接警。
    interpret: 消防通信指挥系统的运行安全：重要设备或核心部件有备份；指挥通信网络相对独立且常年畅通；软件不能正常运行时仍能保证电话接警与调度；呼入线路或设备故障时能切换到应急接警线路。
    severity_hint: error
    keywords:
      - 消防救援设施
  - clause_id: GB55037-2022/3.1.1
    chapter: 3.1 一般规定
    verbatim: 建筑的总平面布局应符合减小火灾危害、方便消防救援的要求。
    interpret: 原则条：建筑总平面布局要符合减小火灾危害、方便消防救援的要求。总平面图阶段的总体判据。
    severity_hint: error
  - clause_id: GB55037-2022/3.1.2
    chapter: 3.1 一般规定
    verbatim: 工业与民用建筑应根据建筑使用性质、建筑高度、耐火等级及火灾危险性等合理确定防火间距，建筑之间的防火间距应保证任意一侧建筑外墙受到的相邻建筑火灾辐射热强度均低于其临界引燃辐射热强度。
    interpret: 防火间距的原理条：间距按建筑使用性质、高度、耐火等级、火灾危险性合理确定，本质要求是任意一侧外墙受到的相邻建筑火灾辐射热强度都低于该外墙材料的临界引燃辐射热强度。具体数值见3.2、3.3节；本条是那些数字背后的判据。
    severity_hint: error
  - clause_id: GB55037-2022/3.1.3
    chapter: 3.1 一般规定
    verbatim: 甲、乙类物品运输车的汽车库、修车库、停车场与人员密集场所的防火间距不应小于50m，与其他民用建筑的防火间距不应小于25m；甲类物品运输车的汽车库、修车库、停车场与明火或散发火花地点的防火间距不应小于30m。
    interpret: 甲、乙类物品运输车的汽车库、修车库、停车场：与人员密集场所的防火间距不小于50m，与其他民用建筑不小于25m；甲类的与明火或散发火花地点不小于30m。总平面图上的距离。
    severity_hint: error
    keywords:
      - 50m
      - 25m
      - 30m
  - clause_id: GB55037-2022/3.2.1
    chapter: 3.2 工业建筑
    verbatim: 甲类厂房与人员密集场所的防火间距不应小于50m，与明火或散发火花地点的防火间距不应小于30m。
    interpret: 甲类厂房与人员密集场所的防火间距不应小于50m，与明火或散发火花地点不应小于30m。
    severity_hint: error
    keywords:
      - 工业建筑
      - 50m
      - 30m
  - clause_id: GB55037-2022/3.2.2
    chapter: 3.2 工业建筑
    verbatim: 甲类仓库与高层民用建筑和设置人员密集场所的民用建筑的防火间距不应小于50m，甲类仓库之间的防火间距不应小于20m。
    interpret: 甲类仓库与高层民用建筑、以及设置人员密集场所的民用建筑的防火间距不应小于50m；甲类仓库相互之间的防火间距不应小于20m。
    severity_hint: error
    keywords:
      - 工业建筑
      - 50m
      - 20m
  - clause_id: GB55037-2022/3.2.3
    chapter: 3.2 工业建筑
    verbatim: 除乙类第5 项、第6 项物品仓库外，乙类仓库与高层民用建筑和设置人员密集场所的其他民用建筑的防火间距不应小于50m。
    interpret: 除乙类第5项、第6项物品仓库外，乙类仓库与高层民用建筑和设置人员密集场所的其他民用建筑的防火间距不应小于50m。
    severity_hint: error
    keywords:
      - 工业建筑
      - 50m
  - clause_id: GB55037-2022/3.2.4
    chapter: 3.2 工业建筑
    verbatim: 飞机库与甲类仓库的防火间距不应小于20m。飞机库与喷漆机库贴邻建造时，应采用防火墙分隔。
    interpret: 飞机库与甲类仓库的防火间距不应小于20m；飞机库与喷漆机库贴邻建造时，应采用防火墙分隔。
    severity_hint: error
    keywords:
      - 工业建筑
      - 20m
  - clause_id: GB55037-2022/3.3.1
    chapter: 3.3 民用建筑
    verbatim: |-
      除裙房与相邻建筑的防火间距可按单、多层建筑确定外，建筑高度大于100m 的民用建筑与相邻建筑的防火间距应符合下列规定：
      1 与高层民用建筑的防火间距不应小于13m；
      2 与一、二级耐火等级单、多层民用建筑的防火间距不应小于9m；
      3 与三级耐火等级单、多层民用建筑的防火间距不应小于11m；
      4 与四级耐火等级单、多层民用建筑和木结构民用建筑的防火间距不应小于14m。
    interpret: 建筑高度大于100m的民用建筑，与相邻建筑的防火间距按对方情况分四档：与高层民用建筑不小于13m；与一、二级耐火等级的单、多层民用建筑不小于9m；与三级不小于11m；与四级耐火等级和木结构民用建筑不小于14m。裙房与相邻建筑的间距可按单、多层建筑确定。
    severity_hint: error
    keywords:
      - 民用建筑
      - 100m
      - 13m
      - 9m
      - 11m
      - 14m
  - clause_id: GB55037-2022/3.3.2
    chapter: 3.3 民用建筑
    verbatim: 相邻两座通过连廊、天桥或下部建筑物等连接的建筑，防火间距应按照两座独立建筑确定。
    interpret: 相邻两座建筑即使通过连廊、天桥或下部建筑物连接，防火间距仍按两座独立建筑分别确定，不能因为连起来了就当成一栋。总平面图上常见争议点。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/3.4.1
    chapter: 3.4 消防车道与消防车登高操作场地
    verbatim: 工业与民用建筑周围、工厂厂区内、仓库库区内、城市轨道交通的车辆基地内、其他地下工程的地面出入口附近，均应设置可通行消防车并与外部公路或街道连通的道路。
    interpret: 工业与民用建筑周围、工厂厂区内、仓库库区内、轨道交通车辆基地内、其他地下工程的地面出入口附近，都应设置可通行消防车并与外部公路或街道连通的道路。
    severity_hint: error
    keywords:
      - 消防车道与消防车登高操作场地
  - clause_id: GB55037-2022/3.4.2
    chapter: 3.4 消防车道与消防车登高操作场地
    verbatim: |-
      下列建筑应至少沿建筑的两条长边设置消防车道：
      1 高层厂房，占地面积大于3000m²的单、多层甲、乙、丙类厂房；
      2 占地面积大于1500m²的乙、丙类仓库；
      3 飞机库。
    interpret: 应至少沿建筑两条长边设消防车道的三类：高层厂房、占地面积大于3000m²的单多层甲/乙/丙类厂房；占地面积大于1500m²的乙、丙类仓库；飞机库。
    severity_hint: error
    keywords:
      - 消防车道与消防车登高操作场地
      - 3000m²
      - 1500m²
  - clause_id: GB55037-2022/3.4.3
    chapter: 3.4 消防车道与消防车登高操作场地
    verbatim: 除受环境地理条件限制只能设置1 条消防车道的公共建筑外，其他高层公共建筑和占地面积大于3000m²的其他单、多层公共建筑应至少沿建筑的两条长边设置消防车道。住宅建筑应至少沿建筑的一条长边设置消防车道。当建筑仅设置1 条消防车道时，该消防车道应位于建筑的消防车登高操作场地一侧。
    interpret: 高层公共建筑、占地面积大于3000m²的其他单多层公共建筑，应至少沿两条长边设消防车道（受环境地理条件限制只能设1条的除外）；住宅建筑至少沿一条长边设；只设1条消防车道时，该车道应位于消防车登高操作场地一侧。
    severity_hint: error
    keywords:
      - 消防车道与消防车登高操作场地
      - 3000m²
  - clause_id: GB55037-2022/3.4.4
    chapter: 3.4 消防车道与消防车登高操作场地
    verbatim: 供消防车取水的天然水源和消防水池应设置消防车道，天然水源和消防水池的最低水位应满足消防车可靠取水的要求。
    interpret: 供消防车取水的天然水源和消防水池应设消防车道，且最低水位要满足消防车可靠取水。
    severity_hint: error
    keywords:
      - 消防车道与消防车登高操作场地
  - clause_id: GB55037-2022/3.4.5
    chapter: 3.4 消防车道与消防车登高操作场地
    verbatim: |-
      消防车道或兼作消防车道的道路应符合下列规定：
      1 道路的净宽度和净空高度应满足消防车安全、快速通行的要求；
      2 转弯半径应满足消防车转弯的要求；
      3 路面及其下面的建筑结构、管道、管沟等，应满足承受消防车满载时压力的要求；
      4 坡度应满足消防车满载时正常通行的要求，且不应大于10%，兼作消防救援场地的消防车道，坡度尚应满足消防车停靠和消防救援作业的要求；
      5 消防车道与建筑外墙的水平距离应满足消防车安全通行的要求，位于建筑消防扑救面一侧兼作消防救援场地的消防车道应满足消防救援作业的要求；
      6 长度大于40m 的尽头式消防车道应设置满足消防车回转要求的场地或道路；
      7 消防车道与建筑消防扑救面之间不应有妨碍消防车操作的障碍物，不应有影响消防车安全作业的架空高压电线。
    interpret: 消防车道的七项要求：净宽与净空满足消防车通行；转弯半径满足转弯；路面及下部结构管道满足消防车满载压力；坡度不大于10%，兼作救援场地时还要满足停靠作业；与建筑外墙的水平距离满足安全通行；长度大于40m的尽头式车道要设回车场地或道路；与建筑扑救面之间不得有妨碍操作的障碍物和影响作业的架空高压线。
    severity_hint: error
    keywords:
      - 消防车道与消防车登高操作场地
      - 10%
      - 40m
  - clause_id: GB55037-2022/3.4.6
    chapter: 3.4 消防车道与消防车登高操作场地
    verbatim: 高层建筑应至少沿其一条长边设置消防车登高操作场地。未连续布置的消防车登高操作场地，应保证消防车的救援作业范围能覆盖该建筑的全部消防扑救面。
    interpret: 高层建筑应至少沿一条长边设消防车登高操作场地；场地未连续布置时，消防车的救援作业范围要能覆盖该建筑的全部消防扑救面。
    severity_hint: error
    keywords:
      - 消防车道与消防车登高操作场地
  - clause_id: GB55037-2022/3.4.7
    chapter: 3.4 消防车道与消防车登高操作场地
    verbatim: |-
      消防车登高操作场地应符合下列规定：
      1 场地与建筑之间不应有进深大于4m 的裙房及其他妨碍消防车操作的障碍物或影响消防车作业的架空高压电线；
      2 场地及其下面的建筑结构、管道、管沟等应满足承受消防车满载时压力的要求；
      3 场地的坡度应满足消防车安全停靠和消防救援作业的要求。
    interpret: 消防车登高操作场地的三项要求：场地与建筑之间不得有进深大于4m的裙房及其他妨碍操作的障碍物或架空高压线；场地及其下部结构、管道、管沟满足消防车满载压力；坡度满足安全停靠与救援作业。
    severity_hint: error
    keywords:
      - 消防车道与消防车登高操作场地
      - 4m
  - clause_id: GB55037-2022/4.1.1
    chapter: 4.1 一般规定
    verbatim: 建筑的平面布置应便于建筑发生火灾时的人员疏散和避难，有利于减小火灾危害、控制火势和烟气蔓延。同一建筑内的不同使用功能区域之间应进行防火分隔。
    interpret: 原则条：平面布置要便于火灾时人员疏散避难、有利于减小火灾危害与控制火势烟气蔓延；同一建筑内不同使用功能区域之间必须做防火分隔。后面4.2、4.3节的场所布置要求都由这条派生。
    severity_hint: error
  - clause_id: GB55037-2022/4.1.2
    chapter: 4.1 一般规定
    verbatim: |-
      工业与民用建筑、地铁车站、平时使用的人民防空工程应综合其高度（埋深）、使用功能和火灾危险性等因素，根据有利于消防救援、控制火灾及降低火灾危害的原则划分防火分区。防火分区的划分应符合下列规定：
      1 建筑内横向应采用防火墙等划分防火分区，且防火分隔应保证火灾不会蔓延至相邻防火分区；
      2 建筑内竖向按自然楼层划分防火分区时，除允许设置敞开楼梯间的建筑外，防火分区的建筑面积应按上、下楼层中在火灾时未封闭的开口所连通区域的建筑面积之和计算；
      3 高层建筑主体与裙房之间未采用防火墙和甲级防火门分隔时，裙房的防火分区应按高层建筑主体的相应要求划分；
      4 除建筑内游泳池、消防水池等的水面、冰面或雪面面积，射击场的靶道面积，污水沉降池面积，开敞式的外走廊或阳台面积等可不计入防火分区的建筑面积外，其他建筑面积均应计入所在防火分区的建筑面积。
    interpret: 防火分区的划分规则，四个要点：①横向用防火墙等划分，分隔要保证火不窜到相邻分区；②竖向按自然楼层划分时，凡有火灾时未封闭的开口连通上下层（敞开楼梯间），分区面积按连通区域面积之**和**算，不是各层单独算；③高层主体与裙房之间没用防火墙加甲级防火门分隔的，裙房按主体要求划分；④水面、冰面、雪面、射击场靶道、污水沉降池、开敞外走廊或阳台的面积可不计入，其余一律计入。
    severity_hint: error
  - clause_id: GB55037-2022/4.1.3
    chapter: 4.1 一般规定
    verbatim: |-
      下列场所应采用防火门、防火窗、耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.00h 的楼板与其他区域分隔：
      1 住宅建筑中的汽车库和锅炉房；
      2 除居住建筑中的套内自用厨房可不分隔外，建筑内的厨房；
      3 医疗建筑中的手术室或手术部、产房、重症监护室、贵重精密医疗装备用房、储藏间、实验室、胶片室等；
      4 建筑中的儿童活动场所、老年人照料设施；
      5 除消防水泵房的防火分隔应符合本规范第4.1.7 条的规定，消防控制室的防火分隔应符合本规范第4.1.8 条的规定外，其他消防设备或器材用房。
    interpret: 要用「防火门窗 + 2.00h 防火隔墙 + 1.00h 楼板」与其他区域分隔的五类场所：住宅内的汽车库和锅炉房；建筑内的厨房（住宅套内自用厨房除外）；医疗建筑的手术室或手术部、产房、重症监护室、贵重精密医疗装备用房、储藏间、实验室、胶片室；儿童活动场所与老年人照料设施；其他消防设备或器材用房（水泵房见4.1.7、消防控制室见4.1.8）。平面图上量的是隔墙位置与门洞。
    severity_hint: error
    keywords:
      - 2.00h
      - 1.00h
  - clause_id: GB55037-2022/4.1.4
    chapter: 4.1 一般规定
    verbatim: |-
      燃油或燃气锅炉、可燃油油浸变压器、充有可燃油的高压电容器和多油开关、柴油发电机房等独立建造的设备用房与民用建筑贴邻时，应采用防火墙分隔，且不应贴邻建筑中人员密集的场所。上述设备用房附设在建筑内时，应符合下列规定：
      1 当位于人员密集的场所的上一层、下一层或贴邻时，应采取防止设备用房的爆炸作用危及上一层、下一层或相邻场所的措施；
      2 设备用房的疏散门应直通室外或安全出口；
      3 设备用房应采用耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.50h 的不燃性楼板与其他部位分隔，防火隔墙上的门、窗应为甲级防火门、窗。
    interpret: 燃油燃气锅炉、油浸变压器、充油高压电容器和多油开关、柴油发电机房这类设备用房：独立建造后与民用建筑贴邻时要用防火墙分隔，且不得贴邻建筑内人员密集场所。附设在建筑内时三条：位于人员密集场所上一层、下一层或贴邻时要防爆炸作用波及相邻场所；疏散门直通室外或安全出口；用2.00h 防火隔墙加1.50h 不燃楼板分隔，墙上的门窗为甲级。
    severity_hint: error
    keywords:
      - 2.00h
      - 1.50h
  - clause_id: GB55037-2022/4.1.5
    chapter: 4.1 一般规定
    verbatim: |-
      附设在建筑内的燃油或燃气锅炉房、柴油发电机房，除应符合本规范第4.1.4 条的规定外，尚应符合下列规定：
      1 常（负）压燃油或燃气锅炉房不应位于地下二层及以下，位于屋顶的常（负）压燃气锅炉房与通向屋面的安全出口的最小水平距离不应小于6m；其他燃油或燃气锅炉房应位于建筑首层的靠外墙部位或地下一层的靠外侧部位，不应贴邻消防救援专用出入口、疏散楼梯（间）或人员的主要疏散通道。
      2 建筑内单间储油间的燃油储存量不应大于1m3。油箱的通气管设置应满足防火要求，油箱的下部应设置防止油品流散的设施。储油间应采用耐火极限不低于3.00h 的防火隔墙与发电机间、锅炉间分隔。
      3 柴油机的排烟管、柴油机房的通风管、与储油间无关的电气线路等，不应穿过储油间。
      4 燃油或燃气管道在设备间内及进入建筑物前，应分别设置具有自动和手动关闭功能的切断阀。
    interpret: 附设的燃油燃气锅炉房、柴油发电机房在4.1.4之外还有四条：①常（负）压锅炉房不得设在地下二层及以下；屋顶常（负）压燃气锅炉房距通向屋面的安全出口不小于6m；其他锅炉房只能设在首层靠外墙或地下一层靠外侧，且不得贴邻消防救援专用出入口、疏散楼梯间、主要疏散通道；②单间储油间储油量不大于1m³，储油间用3.00h 防火隔墙与发电机间、锅炉间分隔；③柴油机排烟管、机房通风管、与储油间无关的电气线路都不得穿过储油间；④燃气管道在设备间内及进入建筑前分别设手动与自动切断阀。
    severity_hint: error
    keywords:
      - 6m
      - 1m
      - 3.00h
  - clause_id: GB55037-2022/4.1.6
    chapter: 4.1 一般规定
    verbatim: |-
      附设在建筑内的可燃油油浸变压器、充有可燃油的高压电容器和多油开关等的设备用房，除应符合本规范第4.1.4 条的规定外，尚应符合下列规定：
      1 油浸变压器室、多油开关室、高压电容器室均应设置防止油品流散的设施；
      2 变压器室应位于建筑的靠外侧部位，不应设置在地下二层及以下楼层；
      3 变压器室之间、变压器室与配电室之间应采用防火门和耐火极限不低于2.00h 的防火隔墙分隔。
    interpret: 附设的油浸变压器、充油高压电容器、多油开关设备房：都要设防止油品流散的设施；变压器室应靠建筑外侧，不得设在地下二层及以下；变压器室相互之间、与配电室之间用防火门加2.00h 防火隔墙分隔。
    severity_hint: error
    keywords:
      - 2.00h
  - clause_id: GB55037-2022/4.1.7
    chapter: 4.1 一般规定
    verbatim: |-
      消防水泵房的布置和防火分隔应符合下列规定：
      1 单独建造的消防水泵房，耐火等级不应低于二级；
      2 附设在建筑内的消防水泵房应采用防火门、防火窗、耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.50h 的楼板与其他部位分隔；
      3 除地铁工程、水利水电工程和其他特殊工程中的地下消防水泵房可根据工程要求确定其设置楼层外，其他建筑中的消防水泵房不应设置在建筑的地下三层及以下楼层；
      4 消防水泵房的疏散门应直通室外或安全出口；
      5 消防水泵房的室内环境温度不应低于5℃；
      6 消防水泵房应采取防水淹等的措施。
    interpret: 消防水泵房六条：单独建造时耐火等级不低于二级；附设时用防火门窗加2.00h 隔墙、1.50h 楼板分隔；除地铁、水利水电等特殊工程外不得设在地下三层及以下；疏散门直通室外或安全出口；室内温度不低于5℃；要采取防水淹措施。
    severity_hint: error
    keywords:
      - 2.00h
      - 1.50h
      - 5℃
  - clause_id: GB55037-2022/4.1.8
    chapter: 4.1 一般规定
    verbatim: |-
      消防控制室的布置和防火分隔应符合下列规定：
      1 单独建造的消防控制室，耐火等级不应低于二级；
      2 附设在建筑内的消防控制室应采用防火门、防火窗、耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.50h 的楼板与其他部位分隔；
      3 消防控制室应位于建筑的首层或地下一层，疏散门应直通室外或安全出口；
      4 消防控制室的环境条件不应干扰或影响消防控制室内火灾报警与控制设备的正常运行；
      5 消防控制室内不应敷设或穿过与消防控制室无关的管线；
      6 消防控制室应采取防水淹、防潮、防啮齿动物等的措施。
    interpret: 消防控制室六条：单独建造时耐火等级不低于二级；附设时用防火门窗加2.00h 隔墙、1.50h 楼板分隔；应设在首层或地下一层，疏散门直通室外或安全出口；室内环境不得干扰火灾报警与控制系统；不得敷设或穿过无关管线；要防水淹、防潮、防啮齿动物。平面图上主要是楼层位置与疏散门。
    severity_hint: error
    keywords:
      - 2.00h
      - 1.50h
  - clause_id: GB55037-2022/4.1.9
    chapter: 4.1 一般规定
    verbatim: 汽车库不应与甲、乙类生产场所或库房贴邻或组合建造。
    interpret: 汽车库不得与甲、乙类生产场所或库房贴邻，也不得组合建造。
    severity_hint: error
  - clause_id: GB55037-2022/4.2.1
    chapter: 4.2 工业建筑
    verbatim: |-
      除特殊工艺要求外，下列场所不应设置在地下或半地下：
      1 甲、乙类生产场所；
      2 甲、乙类仓库；
      3 有粉尘爆炸危险的生产场所、滤尘设备间；
      4 邮袋库、丝麻棉毛类物质库。
    interpret: 除特殊工艺要求外，四类场所不得设在地下或半地下：甲、乙类生产场所；甲、乙类仓库；有粉尘爆炸危险的生产场所和滤尘设备间；邮袋库与丝麻棉毛类物质库。
    severity_hint: error
    keywords:
      - 工业建筑
  - clause_id: GB55037-2022/4.2.2
    chapter: 4.2 工业建筑
    verbatim: |-
      厂房内不应设置宿舍。直接服务于生产的办公室、休息室等辅助用房的设置，应符合下列规定：
      1 不应设置在甲、乙类厂房内；
      2 与甲、乙类厂房贴邻的辅助用房的耐火等级不应低于二级，并应采用耐火极限不低于3.00h 的抗爆墙与厂房中有爆炸危险的区域分隔，安全出口应独立设置；
      3 设置在丙类厂房内的辅助用房应采用防火门、防火窗、耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.00h 的楼板与厂房内的其他部位分隔，并应设置至少1 个独立的安全出口。
    interpret: 厂房内不得设宿舍。直接服务生产的办公室、休息室等辅助用房：不得设在甲、乙类厂房内；与甲、乙类厂房贴邻时辅助用房耐火等级不低于二级，并用3.00h 抗爆墙与爆炸危险区域分隔，安全出口独立设置；设在丙类厂房内时用防火门窗加2.00h 隔墙、1.00h 楼板分隔，并至少设1个独立安全出口。
    severity_hint: error
    keywords:
      - 工业建筑
      - 3.00h
