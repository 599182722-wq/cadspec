  - clause_id: GB55037-2022/7.4.7
    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: |-
      除剧场、电影院、礼堂、体育馆外的其他公共建筑，疏散出口、疏散走道和疏散楼梯各自的总净宽度，应根据疏散人数和每100 人所需最小疏散净宽度计算确定，并应符合下列规定：
      1 疏散出口、疏散走道和疏散楼梯每100 人所需最小疏散净宽度不应小于表7.4.7 的规定值。
      2 除不用作其他楼层人员疏散并直通室外地面的外门总净宽度，可按本层的疏散人数计算确定外，首层外门的总净宽度应按该建筑疏散人数最大一层的人数计算确定。
      3 歌舞娱乐放映游艺场所中录像厅的疏散人数，应根据录像厅的建筑面积按不小于1.0 人/m2计算；歌舞娱乐放映游艺场所中其他用途房间的疏散人数，应根据房间的建筑面积按不小于0.5 人/m2计算。
    interpret: 除剧场影院礼堂体育馆外的其他公共建筑，疏散出口、疏散走道、疏散楼梯的总净宽按疏散人数和每100人所需最小净宽计算。数值查表7.4.7：一、二级建筑地上1~2层取0.65、3层取0.75、4层及以上取1.00；三级和木结构建筑依次是0.75、1.00、1.25；四级只允许1~2层，取1.00，更高层数表中是「—」，意思是不许建不是不用算。地下半地下室按埋深分：不大于10m取0.75，大于10m取1.00，歌舞娱乐放映游艺场所及人员密集房间一律1.00。首层外门总净宽按疏散人数最大一层的人数算。歌舞娱乐场所中录像厅的疏散人数按建筑面积不小于1.0人/m² 计，其他房间按不小于0.5人/m² 计。
    severity_hint: error
    keywords:
      - 公共建筑和非住宅类居住建筑
      - 100人
      - 1.0人
      - 0.5人
  - clause_id: GB55037-2022/7.4.8
    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: |-
      医疗建筑的避难间设置应符合下列规定：
      1 高层病房楼应在第二层及以上的病房楼层和洁净手术部设置避难间；
      2 楼地面距室外设计地面高度大于24m 的洁净手术部及重症监护区，每个防火分区应至少设置1 间避难间；
      3 每间避难间服务的护理单元不应大于2 个，每个护理单元的避难区净面积不应小于25.0m2；
      4 避难间的其他防火要求，应符合本规范第7.1.16 条的规定。
    interpret: 医疗建筑避难间四条：①高层病房楼应在第二层及以上的病房楼层和洁净手术部设避难间；②楼地面距室外设计地面高度大于24m 的洁净手术部及重症监护区，每个防火分区至少设1间；③每间避难间服务的护理单元不大于2个，每个护理单元避难区净面积不小于25.0m²；④其他防火要求按7.1.16。
    severity_hint: error
    keywords:
      - 公共建筑和非住宅类居住建筑
      - 24m
      - 2个
      - 25.0m2
  - clause_id: GB55037-2022/7.5.1
    chapter: 7.5 其他工程
    verbatim: 地铁车站中站台公共区至站厅公共区或其他安全区域的疏散楼梯、自动扶梯和疏散通道的通过能力，应保证在远期或客流控制期中超高峰小时最大客流量时，一列进站列车所载乘客及站台上的候车乘客能在4min 内全部撤离站台，并应能在6min 内全部疏散至站厅公共区或其他安全区域。
    interpret: 地铁车站站台到站厅或其他安全区域的疏散楼梯、自动扶梯、疏散通道的通过能力，要保证超高峰小时最大客流量时，一列进站列车所载乘客加站台候车乘客能在4min 内全部撤离站台、6min 内全部疏散至站厅公共区或其他安全区域。
    severity_hint: error
    keywords:
      - 4m
      - 6m
  - clause_id: GB55037-2022/7.5.2
    chapter: 7.5 其他工程
    verbatim: |-
      地铁车站的安全出口应符合下列规定：
      1 车站每个站厅公共区直通室外的安全出口不应少于2 个；
      2 地下一层与站厅公共区同层布置侧式站台的车站，每侧站台直通室外的安全出口不应少于2 个；
      3 位于站厅公共区同方向相邻两个安全出口之间的水平净距不应小于20m；
      4 设备区的安全出口应独立设置，有人值守的设备和管理用房区域的安全出口不应少于2 个，其中有人值守的防火分区应至少有1 个直通室外的安全出口。
    interpret: 地铁车站安全出口四条：每个站厅公共区直通室外的安全出口不少于2个；地下一层与站厅同层布置侧式站台的车站，每侧站台直通室外的安全出口不少于2个；同一方向相邻两个安全出口之间的水平净距不小于20m；设备区安全出口独立设置，有人值守的设备与管理用房区域不少于2个，其中有人值守的防火分区至少1个直通室外。
    severity_hint: error
    keywords:
      - 2个
      - 20m
      - 1个
  - clause_id: GB55037-2022/7.5.3
    chapter: 7.5 其他工程
    verbatim: 两条单线载客运营地下区间之间应设置联络通道，载客运营地下区间内应设置纵向疏散平台。
    interpret: 两条单线载客运营地下区间之间应设联络通道；载客运营地下区间内应设纵向疏散平台。
    severity_hint: error
  - clause_id: GB55037-2022/7.5.4
    chapter: 7.5 其他工程
    verbatim: 地铁工程中的出入口控制装置，应具有与火灾自动报警系统联动控制自动释放和断电自动释放的功能，并应能在车站控制室或消防控制室内手动远程控制。
    interpret: 地铁工程的出入口控制装置，要具备与火灾自动报警系统联动自动释放、断电自动释放的功能，并能在车站控制室或消防控制室手动远程控制。
    severity_hint: error
  - clause_id: GB55037-2022/7.5.5
    chapter: 7.5 其他工程
    verbatim: 城市综合管廊工程的每个舱室均应设置人员逃生口和消防救援出入口。人员逃生口和消防救援出入口的尺寸应方便人员进出，其间距应根据电力电缆、热力管道、燃气管道的敷设情况，管廊通风与消防救援等需要综合确定。
    interpret: 城市综合管廊每个舱室都应设人员逃生口和消防救援出入口，尺寸要方便人员进出，间距按电力电缆、热力管道、燃气管道的敷设情况及通风与救援需要综合确定。
    severity_hint: error
  - clause_id: GB55037-2022/8.1.1
    chapter: 8.1 消防给水和灭火设施
    verbatim: 建筑应设置与其建筑高度（埋深）、体积、面积、长度，火灾危险性，建筑附近的消防力量布置情况，环境条件等相适应的消防给水设施、灭火设施和器材。除地铁区间、综合管廊的燃气舱和住宅建筑套内可不配置灭火器外，建筑内应配置灭火器。
    interpret: 原则条：消防给水设施、灭火设施和器材要与建筑高度（埋深）、体积、面积、长度、火灾危险性、附近消防力量、环境条件相适应。唯一的具体要求在第2句——除地铁区间、综合管廊燃气舱、住宅套内三类场所可不配灭火器外，建筑内都应配置灭火器。平面图上看不出灭火器，只能靠设计说明与器材表。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
  - clause_id: GB55037-2022/8.1.2
    chapter: 8.1 消防给水和灭火设施
    verbatim: 建筑中设置的消防设施与器材应与所设置场所的火灾危险性、可燃物的燃烧特性环境条件、设置场所的面积和空间净高、使用人员特征、防护对象的重要性和防护目标等相适应，满足设置场所灭火、控火、早期报警、防烟、排烟、排热等需要，并应有利于人员安全疏散和消防救援。
    interpret: 原则条：消防设施要与场所的火灾危险性、可燃物燃烧特性、面积与空间净高、人员特征、防护对象重要性相适应，满足灭火、控火、早期报警、防烟排烟排热的需要，并有利于人员疏散与救援。不产生可检项，用来解释后面各条为什么这样定。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
  - clause_id: GB55037-2022/8.1.3
    chapter: 8.1 消防给水和灭火设施
    verbatim: |-
      设置在建筑内的固定灭火设施应符合下列规定：
      1 灭火剂应适用于扑救设置场所或保护对象的火灾类型，不应用于扑救遇灭火介质会发生化学反应而引起燃烧、爆炸等物质的火灾；
      2 灭火设施应满足在正常使用环境条件下安全、可靠运行的要求；
      3 灭火剂储存间的环境温度应满足灭火剂储存装置安全运行和灭火剂安全储存的要求。
    interpret: 固定灭火设施三款：①灭火剂要适用于所保护对象的火灾类型，且不能扑救会与灭火介质发生化学反应、引起燃烧爆炸的物质；②在正常使用环境条件下要能安全可靠运行；③灭火剂储存间的环境温度要满足储存装置安全运行与灭火剂安全储存。第③款是设备用房选位置时的约束。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
  - clause_id: GB55037-2022/8.1.4
    chapter: 8.1 消防给水和灭火设施
    verbatim: 除居住人数不大于500 人且建筑层数不大于2 层的居住区外，城镇（包括居住区、商业区、开发区、工业区等）应沿可通行消防车的街道设置市政消火栓系统。
    interpret: 市政消火栓：除居住人数不大于500人且建筑层数不大于2层的居住区外，城镇（居住区、商业区、开发区、工业区等）应沿可通行消防车的街道设置市政消火栓系统。这条管的是城市道路与市政，不是单体平面图内部。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
      - 500人
      - 2层
  - clause_id: GB55037-2022/8.1.5
    chapter: 8.1 消防给水和灭火设施
    verbatim: |-
      除城市轨道交通工程的地上区间和一、二级耐火等级且建筑体积不大于3000m 3的戊类厂房可不设置室外消火栓外，下列建筑或场所应设置室外消火栓系统：
      1 建筑占地面积大于300m2的厂房、仓库和民用建筑；
      2 用于消防救援和消防车停靠的建筑屋面或高架桥；
      3 地铁车站及其附属建筑、车辆基地。
    interpret: 室外消火栓应设的三类：①建筑占地面积大于300m² 的厂房、仓库和民用建筑；②用于消防救援和消防车停靠的建筑屋面或高架桥；③地铁车站及其附属建筑、车辆基地。例外只有两个：城市轨道交通工程的地上区间；一、二级耐火等级且建筑体积不大于3000m³ 的戊类厂房。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
      - 3000m
      - 300m2
  - clause_id: GB55037-2022/8.1.6
    chapter: 8.1 消防给水和灭火设施
    verbatim: 除四类城市交通隧道、供人员或非机动车辆通行的三类城市交隧道可不设置消防给水系统外，城市交通隧道应设置消防给水系统。
    interpret: 城市交通隧道设置消防给水系统的范围：除四类城市交通隧道、供人员或非机动车辆通行的三类城市交通隧道可不设外，其余都应设。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
  - clause_id: GB55037-2022/8.1.7
    chapter: 8.1 消防给水和灭火设施
    verbatim: |-
      除不适合用水保护或灭火的场所、远离城镇且无人值守的独立建筑、散装粮食仓库、金库可不设置室内消火栓系统外，下列建筑应设置室内消火栓系统：
      1 建筑占地面积大于300m2的甲、乙、丙类厂房；
      2 建筑占地面积大于300m2的甲、乙、丙类仓库；
      3 高层公共建筑，建筑高度大于21m 的住宅建筑；
      4 特等和甲等剧场，座位数大于800 个的乙等剧场，座位数大于800 个的电影院，座位数大于1200 个的礼堂，座位数大于1200 个的体育馆等建筑；
      5 建筑体积大于5000m3的下列单、多层建筑：车站、码头、机场的候车（船、机）建筑，展览、商店、旅馆和医疗建筑，老年人照料设施，档案馆，图书馆；
      6 建筑高度大于15m 或建筑体积大于10000m3的办公建筑、教学建筑及其他单、多层民用建筑；
      7 建筑面积大于300m2的汽车库和修车库；
      8 建筑面积大于300m2且平时使用的人民防空工程；
      9 地铁工程中的地下区间、控制中心、车站及长度大于30m 的人行通道，车辆基地内建筑面积大于300m2的建筑；
      10 通行机动车的一、二、三类城市交通隧道。
    interpret: 室内消火栓的十类适用建筑，平面图最常碰到的是：占地大于300m² 的甲、乙、丙类厂房与仓库；高层公共建筑和高度大于21m 的住宅；体积大于5000m³ 的车站码头机场候车建筑、展览商店旅馆医疗建筑、老年人照料设施、档案馆图书馆；高度大于15m 或体积大于10000m³ 的办公、教学及其他单多层民用建筑；建筑面积大于300m² 的汽车库修车库。例外：不适合用水保护的场所、远离城镇且无人值守的独立建筑、散装粮食仓库、金库。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
      - 300m2
      - 21m
      - 800个
      - 1200个
      - 5000m
      - 15m
      - 10000m
  - clause_id: GB55037-2022/8.1.8
    chapter: 8.1 消防给水和灭火设施
    verbatim: |-
      除散装粮食仓库可不设置自动灭火系统外，下列厂房或生产部位、仓库应设置自动灭火系统：
      1 地上不小于50000 纱锭的棉纺厂房中的开包、清花车间，不小于5000 锭的麻纺厂房中的分级、梳麻车间，火柴厂的烤梗、筛选部位；
      2 地上占地面积大于1500m2或总建筑面积大于3000m2的单、多层制鞋、制衣、玩具及电子等类似用途的厂房；
      3 占地面积大于1500m2的地上木器厂房；
      4 泡沫塑料厂的预发、成型、切片、压花部位；
      5 除本条第1 款～第4 款规定外的其他乙、丙类高层厂房；
      6 建筑面积大于500m2的地下或半地下丙类生产场所；
      7 除占地面积不大于2000m2的单层棉花仓库外，每座占地面积大于1000m的棉、毛、丝、麻、化纤、毛皮及其制品的地上仓库；
      8 每座占地面积大于600m2的地上火柴仓库；
      9 邮政建筑内建筑面积大于500m2的地上空邮袋库；
      10 设计温度高于0℃的地上高架冷库，设计温度高于0℃且每个防火分区建筑面积大于1500m2的地上非高架冷库；
      11 除本条第7 款～第10 款规定外，其他每座占地面积大于1500m2或总建筑面积大于3000m2的单、多层丙类仓库；
      12 除本条第7 款～第11 款规定外，其他丙、丁类地上高架仓库，丙、丁类高层仓库；
      13 地下或半地下总建筑面积大于500m2的丙类仓库。
    interpret: 厂房与仓库应设自动灭火系统的十三款，核心门槛：地上占地大于1500m² 或总建筑面积大于3000m² 的制鞋制衣玩具电子类厂房；占地大于1500m² 的地上木器厂房；地下半地下建筑面积大于500m² 的丙类生产场所；每座占地大于1000m² 的棉毛丝麻化纤毛皮制品地上仓库；其他每座占地大于1500m² 或总建筑面积大于3000m² 的单多层丙类仓库；地下半地下总建筑面积大于500m² 的丙类仓库。散装粮食仓库除外。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
      - 1500m2
      - 3000m2
      - 500m2
      - 2000m2
      - 1000m
      - 600m2
      - 0℃
  - clause_id: GB55037-2022/8.1.9
    chapter: 8.1 消防给水和灭火设施
    verbatim: |-
      除建筑内的游泳池、浴池、溜冰场可不设置自动灭火系统外，下列民用建筑、场所平时使用的人民防空工程应设置自动灭火系统：
      1  一类高层公共建筑及其地下、半地下室；
      2 二类高层公共建筑及其地下、半地下室中的公共活动用房、走道、办公室、旅馆的客房、可燃物品库房；
      3 建筑高度大于100m 的住宅建筑；
      4 特等和甲等剧场，座位数大于1500 个的乙等剧场，座位数大于2000 个的会堂或礼堂，座位数大于3000 个的体育馆，座位数大于5000 个的体育场的室内人员休息室与器材间等；
      5 任一层建筑面积大于1500m2或总建筑面积大于3000m2的单、多层展览建筑、商店建筑、餐饮建筑和旅馆建筑；
      6 中型和大型幼儿园，老年人照料设施，任一层建筑面积大于1500m2或总建筑面积大于3000m2的单、多层病房楼、门诊楼和手术部；
      7 除本条上述规定外，设置具有送回风道（管）系统的集中空气调节系统且总建筑面积大于3000m2的其他单、多层公共建筑；
      8 总建筑面积大于500m2的地下或半地下商店；
      9 设置在地下或半地下、多层建筑的地上第四层及以上楼层、高层民用建筑内的歌舞娱乐放映游艺场所，设置在多层建筑第一层至第三层且楼层建筑面积大于300m2的地上歌舞娱乐放映游艺场所；
      10 位于地下或半地下且座位数大于800 个的电影院、剧场或礼堂的观众厅；
      11 建筑面积大于1000m2且平时使用的人民防空工程。
    interpret: 民用建筑应设自动灭火系统的十一款，平面图相关的重点：一类高层公共建筑及其地下半地下室一律要设；二类高层公共建筑的地下半地下室中的公共活动用房、走道、办公室、旅馆客房、可燃物品库房；高度大于100m 的住宅；任一层建筑面积大于1500m² 或总建筑面积大于3000m² 的单多层展览、商店、餐饮、旅馆建筑；中型和大型幼儿园、老年人照料设施、达到同面积门槛的病房楼门诊楼手术部；总建筑面积大于500m² 的地下半地下商店；歌舞娱乐放映游艺场所（地下半地下、多层建筑四层及以上、高层内一律设；多层一到三层且楼层面积大于300m² 也设）。建筑内的游泳池、浴池、溜冰场可不设。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
      - 100m
      - 1500个
      - 2000个
      - 3000个
      - 5000个
      - 1500m2
      - 3000m2
  - clause_id: GB55037-2022/8.1.10
    chapter: 8.1 消防给水和灭火设施
    verbatim: 除敞开式汽车库可不设置自动灭火设施外，I、Ⅱ、Ⅲ类地上汽车库，停车数大于10 辆的地下或半地下汽车库，机械式汽车库，采用汽车专用升降机作汽车疏散出口的汽车库，I 类的机动车修车库均应设自动灭火系统。
    interpret: 汽车库与修车库的自动灭火：除敞开式汽车库外，I、Ⅱ、Ⅲ类地上汽车库，停车数大于10辆的地下或半地下汽车库，机械式汽车库，用汽车专用升降机作疏散出口的汽车库，I类机动车修车库，都应设自动灭火系统。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
  - clause_id: GB55037-2022/8.1.11
    chapter: 8.1 消防给水和灭火设施
    verbatim: |-
      下列建筑或部位应设置雨淋灭火系统：
      1 火柴厂的氯酸钾压碾车间；
      2 建筑面积大于100m2且生产或使用硝化棉、喷漆棉、火胶棉、赛璐珞胶片、硝化纤维的场所；
      3 乒乓球厂的轧坯、切片、磨球、分球检验部位；
      4 建筑面积大于60m2或储存量大于2t 的硝化棉、喷漆棉、火胶棉、赛璐珞胶片、硝化纤维库房；
      5 日装瓶数量大于3000 瓶的液化石油气储配站的灌瓶间、实瓶库；
      6 特等和甲等剧场的舞台葡萄架下部，座位数大于1500 个的乙等剧场的舞台葡萄架下部，座位数大于2000 个的会堂或礼堂的舞台葡萄架下部；
      7 建筑面积大于或等于400m2的演播室，建筑面积大于或等于500m2的电影摄影棚。
    interpret: 应设雨淋灭火系统的七类部位，与建筑专业平面关系较大的是：建筑面积大于100m² 且生产或使用硝化棉、喷漆棉、火胶棉、赛璐珞胶片、硝化纤维的场所；建筑面积大于60m² 或储存量大于2t 的同类物质库房；建筑面积不小于400m² 的演播室；不小于500m² 的电影摄影棚；特等甲等剧场及大座数剧场会堂礼堂的舞台葡萄架下部。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
      - 100m2
      - 60m2
      - 1500个
      - 2000个
      - 400m2
      - 500m2
  - clause_id: GB55037-2022/8.1.12
    chapter: 8.1 消防给水和灭火设施
    verbatim: |-
      下列建筑应设置与室内消火栓等水灭火系统供水管网直接连接的消防水泵接合器，且消防水泵接合器应位于室外便于消防车向室内消防给水管网安全供水的位置：
      1 设置自动喷水、水喷雾、泡沫或固定消防炮灭火系统的建筑；
      2 6 层及以上并设置室内消火栓系统的民用建筑；
      3 5 层及以上并设置室内消火栓系统的厂房；
      4 5 层及以上并设置室内消火栓系统的仓库；
      5 室内消火栓设计流量大于10L/s 且平时使用的人民防空工程；
      6 地铁工程中设置室内消火栓系统的建筑或场所；
      7 设置室内消火栓系统的交通隧道；
      8 设置室内消火栓系统的地下、半地下汽车库和5 层及以上的汽车库；
      9 设置室内消火栓系统，建筑面积大于10000m2或3 层及以上的其他地下、半地下建筑（室）。
    interpret: 消防水泵接合器的九类建筑，共同点是设了室内消火栓或自动水灭火系统，且要求接合器位于室外便于消防车向室内管网安全供水的位置——平面图上就是接合器不能被建筑体量、围墙、绿化挡住，且靠近消防车道。
    severity_hint: error
    keywords:
      - 消防给水和灭火设施
      - 6层
      - 5层
      - 10000m2
      - 3层
  - clause_id: GB55037-2022/8.2.1
    chapter: 8.2 防烟与排烟
    verbatim: |-
      下列部位应采取防烟措施：
      1 封闭楼梯间；
      2 防烟楼梯间及其前室；
      3 消防电梯的前室或合用前室；
      4 避难层、避难间；
      5 避难走道的前室，地铁工程中的避难走道。
    interpret: 应采取防烟措施的五类部位：封闭楼梯间；防烟楼梯间及其前室；消防电梯的前室或合用前室；避难层、避难间；避难走道的前室，以及地铁工程中的避难走道。这条直接决定平面图上楼梯间与电梯厅的做法，是判定「这个前室要不要加压送风」的起点。
    severity_hint: error
    keywords:
      - 防烟与排烟
  - clause_id: GB55037-2022/8.2.2
    chapter: 8.2 防烟与排烟
    verbatim: |-
      除不适合设置排烟设施的场所、火灾发展缓慢的场所可不设置排烟设施外，工业与民用建筑的下列场所或部位应采取排烟等烟气控制措施：
      1 建筑面积大于300m2，且经常有人停留或可燃物较多的地上丙类生产场所，丙类厂房内建筑面积大于30m2，且经常有人停留或可燃物较多的地上房间；
      2 建筑面积大于100m2的地下或半地下丙类生产场所；
      3 除高温生产工艺的丁类厂房外，其他建筑面积大于5000m2的地上丁类生产场所；
      4 建筑面积大于1000m2的地下或半地下丁类生产场所；
      5 建筑面积大于300m2的地上丙类库房；
      6 设置在地下或半地下、地上第四层及以上楼层的歌舞娱乐放映游艺场所，设置在其他楼层且房间总建筑面积大于100m2的歌舞娱乐放映游艺场所；
      7 公共建筑内建筑面积大于100m2且经常有人停留的房间；
      8 公共建筑内建筑面积大于300m2且可燃物较多的房间；
      9 中庭；
      10 建筑高度大于32m 的厂房或仓库内长度大于20m 的疏散走道，其他厂房或仓库内长度大于40m 的疏散走道，民用建筑内长度大于20m 的疏散走道。
    interpret: 应设排烟设施的十类场所，与平面图关系最直接：公共建筑内建筑面积大于100m² 且经常有人停留的房间；公共建筑内建筑面积大于300m² 且可燃物较多的房间；中庭；民用建筑内长度大于20m 的疏散走道（厂房仓库是大于20m 或大于40m 两档）；地下半地下及地上四层以上的歌舞娱乐放映游艺场所。注意「经常有人停留」「可燃物较多」是定性判断，DXF 里算不出面积之外的部分，必须人工确认。
    severity_hint: error
    keywords:
      - 防烟与排烟
      - 300m2
      - 30m2
      - 100m2
      - 5000m2
      - 1000m2
      - 32m
      - 20m
  - clause_id: GB55037-2022/8.2.3
    chapter: 8.2 防烟与排烟
    verbatim: 除敞开式汽车库、地下一层中建筑面积小于1000m 2的汽车库、地下一层中建筑面积小于1000m 2的修车库可不设置排烟设施外，其他汽车库、修车库应设置排烟设施。
    interpret: 汽车库与修车库的排烟：除敞开式汽车库、地下一层中建筑面积小于1000m² 的汽车库、地下一层中建筑面积小于1000m² 的修车库外，其余都应设排烟设施。
    severity_hint: error
    keywords:
      - 防烟与排烟
      - 1000m
  - clause_id: GB55037-2022/8.2.4
    chapter: 8.2 防烟与排烟
    verbatim: 通行机动车的一、二、三类城市交通隧道内应设置排烟设施。
    interpret: 通行机动车的一、二、三类城市交通隧道内应设排烟设施。
    severity_hint: error
    keywords:
      - 防烟与排烟
  - clause_id: GB55037-2022/8.2.5
    chapter: 8.2 防烟与排烟
    verbatim: |-
      建筑中下列经常有人停留或可燃物较多且无可开启外窗的房间或区域应设置排烟设施：
      1 建筑面积大于50m2的房间：
      2 房间的建筑面积不大于50m2，总建筑面积大于200m2的区域。
    interpret: 无开启外窗且经常有人停留或可燃物较多的房间或区域，应设排烟设施，两种情况：建筑面积大于50m² 的单个房间；房间面积都不大于50m² 但总建筑面积大于200m² 的成片区域。这条针对地下与大进深空间，平面图上要连「有没有可开启外窗」一起看。
    severity_hint: error
    keywords:
      - 防烟与排烟
      - 50m2
      - 200m2
  - clause_id: GB55037-2022/8.3.1
    chapter: 8.3 火灾自动报警系统
    verbatim: |-
      除散装粮食仓库、原煤仓库可不设置火灾自动报警系统外，下列工业建筑或场所应设置火灾自动报警系统：
      1 丙类高层厂房；
      2 地下、半地下且建筑面积大于1000m2的丙类生产场所；
      3 地下、半地下且建筑面积大于1000m2的丙类仓库；
      4 丙类高层仓库或丙类高架仓库。
    interpret: 工业建筑应设火灾自动报警系统的四类：丙类高层厂房；地下半地下且建筑面积大于1000m² 的丙类生产场所；地下半地下且建筑面积大于1000m² 的丙类仓库；丙类高层仓库或丙类高架仓库。散装粮食仓库、原煤仓库除外。
    severity_hint: error
    keywords:
      - 火灾自动报警系统
      - 1000m2
  - clause_id: GB55037-2022/8.3.2
    chapter: 8.3 火灾自动报警系统
    verbatim: |-
      下列民用建筑或场所应设置火灾自动报警系统：
      1 商店建筑、展览建筑、财贸金融建筑、客运和货运建筑等类似用途的建筑；
      2 旅馆建筑；
      3 建筑高度大于100m 的住宅建筑；
      4 图书或文物的珍藏库，每座藏书超过50 万册的图书馆，重要的档案馆；
      5 地市级及以上广播电视建筑、邮政建筑、电信建筑，城市或区域性电力、交通和防灾等指挥调度建筑；
      6 特等、甲等剧场，座位数超过1500 个的其他等级的剧场或电影院，座位数超过2000 个的会堂或礼堂，座位数超过3000 个的体育馆；
      7 疗养院的病房楼，床位数不少于100 张的医院的门诊楼、病房楼、手术部等；
      8 托儿所、幼儿园，老年人照料设施，任一层建筑面积大于500m2或总建筑面积大于1000m2的其他儿童活动场所；
      9 歌舞娱乐放映游艺场所；
      10 其他二类高层公共建筑内建筑面积大于50m2的可燃物品库房和建筑面积大于500m2的商店营业厅，以及其他一类高层公共建筑。
    interpret: 民用建筑应设火灾自动报警系统的十类，平面图高频项：商店、展览、财贸金融、客运货运等类似用途建筑；旅馆建筑；高度大于100m 的住宅；托儿所、幼儿园、老年人照料设施，以及任一层建筑面积大于500m² 或总建筑面积大于1000m² 的其他儿童活动场所；歌舞娱乐放映游艺场所；一类高层公共建筑。其余是图书馆档案馆、广电邮政电信、大座数剧场体育馆、疗养院与百床以上医院。
    severity_hint: error
    keywords:
      - 火灾自动报警系统
      - 100m
      - 1500个
      - 2000个
      - 3000个
      - 500m2
      - 1000m2
      - 50m2
  - clause_id: GB55037-2022/8.3.3
    chapter: 8.3 火灾自动报警系统
    verbatim: 除住宅建筑的燃气用气部位外，建筑内可能散发可燃气体、可燃蒸气的场所应设置可燃气体探测报警装置。
    interpret: 除住宅建筑的燃气用气部位外，建筑内可能散发可燃气体、可燃蒸气的场所应设可燃气体探测报警装置。住宅厨房之所以排除，是因为住宅另有家用可燃气体报警器的规定，不走集中报警系统。
    severity_hint: error
    keywords:
      - 火灾自动报警系统
  - clause_id: GB55037-2022/9.1.1
    chapter: 9.1 一般规定
    verbatim: |-
      除有特殊功能或性能要求的场所外，下列场所的空气不应循环使用：
      1 甲、乙类生产场所；
      2 甲、乙类物质储存场所：
      3 产生燃烧或爆炸危险性粉尘、纤维且所排除空气的含尘浓度不小于其爆炸下限25%的丙类生产或储存场所；
      4 产生易燃易爆气体或蒸气且所排除空气的含气体浓度不小于其爆炸下限值10%的其他场所；
      5 其他具有甲、乙类火灾危险性的房间。
    interpret: 空气不应循环使用的五类场所：甲、乙类生产场所；甲、乙类物质储存场所；产生燃烧或爆炸危险性粉尘、纤维，且排风含尘浓度不小于爆炸下限25%的丙类生产或储存场所；产生易燃易爆气体或蒸气，且排风含气浓度不小于爆炸下限10%的其他场所；其他具有甲、乙类火灾危险性的房间。「不应循环」的意思是排风不能回用，必须直排室外。
    severity_hint: error
    keywords:
      - 25%
      - 10%
  - clause_id: GB55037-2022/9.1.2
    chapter: 9.1 一般规定
    verbatim: 甲、乙类生产场所的送风设备，不应与排风设备设置在同一通风机房内。用于排除甲、乙类物质的排风设备，不应与其他房间的非防爆送、排风设备设置在同一通风机房内。
    interpret: 甲、乙类生产场所的送风设备不得与排风设备设在同一通风机房；用于排除甲、乙类物质的排风设备，也不得与其他房间的非防爆送、排风设备同机房。这条约束的是通风机房的房间划分。
    severity_hint: error
  - clause_id: GB55037-2022/9.1.3
    chapter: 9.1 一般规定
    verbatim: 排除有燃烧或爆炸危险性物质的风管，不应穿过防火墙，或爆炸危险性房间、人员聚集的房间、可燃物较多的房间的隔墙。
    interpret: 排除有燃烧或爆炸危险性物质的风管，不得穿过防火墙，也不得穿过爆炸危险性房间、人员聚集房间、可燃物较多房间的隔墙。平面图上表现为这类风管要贴外墙或专设竖井，不能穿防火分区。
    severity_hint: error
  - clause_id: GB55037-2022/9.2.1
    chapter: 9.2 供暖系统
    verbatim: 甲、乙类火灾危险性场所内不应采用明火、燃气红外线辐射供暖。存在粉尘爆炸危险性的场所内不应采用电热散热器供暖。在储存或产生可燃气体或蒸气的场所内使用的电热散热器及其连接器，应具备相应的防爆性能。
    interpret: 甲、乙类火灾危险性场所内不得采用明火或燃气红外线辐射供暖；存在粉尘爆炸危险性的场所内不得采用电热散热器供暖；在储存或产生可燃气体蒸气的场所内，电热散热器及其连接器要具备防爆性能。
    severity_hint: error
    keywords:
      - 供暖系统
  - clause_id: GB55037-2022/9.2.2
    chapter: 9.2 供暖系统
    verbatim: |-
      下列场所应采用不循环使用的热风供暖：
      1 生产过程中散发的可燃气体、蒸气、粉尘或纤维，与供暖管道、散热器表面接触能引起燃烧的场所；
      2 生产过程中散发的粉尘受到水、水蒸气作用能引起自燃、爆炸或产生爆炸性气体的场所。
    interpret: 两类场所应采用不循环使用的热风供暖：生产过程散发的可燃气体、蒸气、粉尘或纤维与供暖管道、散热器表面接触能引起燃烧的场所；散发的粉尘遇水或水蒸气能自燃、爆炸或产生爆炸性气体的场所。
    severity_hint: error
    keywords:
      - 供暖系统
  - clause_id: GB55037-2022/9.2.3
    chapter: 9.2 供暖系统
    verbatim: 采用燃气红外线辐射供暖的场所，应采取防火和通风换气等安全措施。
    interpret: 采用燃气红外线辐射供暖的场所，应采取防火和通风换气等安全措施。
    severity_hint: error
    keywords:
      - 供暖系统
  - clause_id: GB55037-2022/9.3.1
    chapter: 9.3 通风和空气调节系统
    verbatim: |-
      下列场所应设置通风换气设施：
      1 甲、乙类生产场所；
      2 甲、乙类物质储存场所；
      3 空气中含有燃烧或爆炸危险性粉尘、纤维的丙类生产或储存场所；
      4 空气中含有易燃易爆气体或蒸气的其他场所；
      5 其他具有甲、乙类火灾危险性的房间。
    interpret: 应设通风换气设施的五类场所：甲、乙类生产场所；甲、乙类物质储存场所；空气中含有燃烧或爆炸危险性粉尘、纤维的丙类生产或储存场所；空气中含有易燃易爆气体或蒸气的其他场所；其他具有甲、乙类火灾危险性的房间。
    severity_hint: error
    keywords:
      - 通风和空气调节系统
  - clause_id: GB55037-2022/9.3.2
    chapter: 9.3 通风和空气调节系统
    verbatim: |-
      下列通风系统应单独设置：
      1 甲、乙类生产场所中不同防火分区的通风系统；
      2 甲、乙类物质储存场所中不同防火分区的通风系统；
      3 排除的不同有害物质混合后能引起燃烧或爆炸的通风系统；
      4 除本条第1款、第2 款规定外，其他建筑中排除有燃烧或爆炸危险性气体、蒸气、粉尘、纤维的通风系统。
    interpret: 应单独设置的通风系统四类：甲、乙类生产场所中不同防火分区的通风系统；甲、乙类物质储存场所中不同防火分区的通风系统；排除的不同有害物质混合后能引起燃烧或爆炸的通风系统；其他建筑中排除有燃烧或爆炸危险性气体、蒸气、粉尘、纤维的通风系统。核心是「不同防火分区不能共用一套通风」。
    severity_hint: error
    keywords:
      - 通风和空气调节系统
  - clause_id: GB55037-2022/9.3.3
    chapter: 9.3 通风和空气调节系统
    verbatim: |-
      排除有燃烧或爆炸危险性气体、蒸气或粉尘的排风系统应符合下列规定：
      1 应采取静电导除等静电防护措施；
      2 排风设备不应设置在地下或半地下；
      3 排风管道应具有不易积聚静电的性能，所排除的空气应直接通向室外安全地点。
    interpret: 排除有燃烧或爆炸危险性气体、蒸气或粉尘的排风系统三款：①采取静电导除等防静电措施；②排风设备不得设在地下或半地下；③排风管道要不易积聚静电，排除的空气直接通向室外安全地点。第②款影响设备用房选址。
    severity_hint: error
    keywords:
      - 通风和空气调节系统
  - clause_id: GB55037-2022/10.1.1
    chapter: 10.1 消防电气
    verbatim: |-
      建筑高度大于150m 的工业与民用建筑的消防用电应符合下列规定：
      1 应按特级负荷供电；
      2 应急电源的消防供电回路应采用专用线路连接至专用母线段；
      3 消防用电设备的供电电源干线应有两个路由。
    interpret: 建筑高度大于150m 的工业与民用建筑，消防用电三项要求：按特级负荷供电；应急电源的消防供电回路用专用线路接至专用母线段；消防用电设备的供电电源干线有两个路由。这是全规范里最高的供电等级，只对超高层。
    severity_hint: error
    keywords:
      - 消防电气
      - 150m
  - clause_id: GB55037-2022/10.1.2
    chapter: 10.1 消防电气
    verbatim: |-
      除筒仓、散装粮食仓库及工作塔外，下列建筑的消防用电负荷等级不应低于一级：
      1 建筑高度大于50m 的乙、丙类厂房；
      2 建筑高度大于50m 的丙类仓库；
      3 一类高层民用建筑；
      4 二层式、二层半式和多层式民用机场航站楼；
      5 Ⅰ类汽车库；
      6 建筑面积大于5000m²且平时使用的人民防空工程；
      7 地铁工程；
      8 一、二类城市交通隧道。
    interpret: 消防用电负荷不低于一级的八类建筑：高度大于50m 的乙、丙类厂房；高度大于50m 的丙类仓库；一类高层民用建筑；二层式、二层半式和多层式民用机场航站楼；Ⅰ类汽车库；建筑面积大于5000m² 且平时使用的人防工程；地铁工程；一、二类城市交通隧道。筒仓、散装粮食仓库及工作塔除外。
    severity_hint: error
    keywords:
      - 消防电气
      - 50m
      - 5000m²
  - clause_id: GB55037-2022/10.1.3
    chapter: 10.1 消防电气
    verbatim: |-
      下列建筑的消防用电负荷等级不应低于二级：
      1 室外消防用水量大于30L/s 的厂房；
      2 室外消防用水量大于30L/s 的仓库；
      3 座位数大于1500 个的电影院或剧场，座位数大于3000 个的体育馆；
      4 任一层建筑面积大于3000m²的商店和展览建筑；
      5 省（市）级及以上的广播电视、电信和财贸金融建筑；
      6 总建筑面积大于3000m²的地下、半地下商业设施；
      7 民用机场航站楼；
      8 Ⅱ类、Ⅲ类汽车库和Ⅰ类修车库；
      9 本条上述规定外的其他二类高层民用建筑；
      10 本条上述规定外的室外消防用水量大于25L/s 的其他公共建筑；
      11 水利工程，水电工程；
      12 三类城市交通隧道。
    interpret: 消防用电负荷不低于二级的十二类建筑，常见的是：室外消防用水量大于30L/s 的厂房与仓库；座位数大于1500 的电影院剧场、大于3000 的体育馆；任一层建筑面积大于3000m² 的商店和展览建筑；总建筑面积大于3000m² 的地下半地下商业设施；其余二类高层民用建筑；上述之外室外消防用水量大于25L/s 的其他公共建筑；Ⅱ、Ⅲ类汽车库和Ⅰ类修车库。
    severity_hint: error
    keywords:
      - 消防电气
      - 1500个
      - 3000个
      - 3000m²
  - clause_id: GB55037-2022/10.1.4
    chapter: 10.1 消防电气
    verbatim: 建筑内消防应急照明和灯光疏散指示标志的备用电源的连续供电时间应满足人员安全疏散的要求，且不应小于表10.1.4 的规定值。
    interpret: 消防应急照明和灯光疏散指示标志的备用电源连续供电时间，要满足人员安全疏散需要，且不小于表10.1.4的规定值。该表给的是分钟数，属消防电气设计参数，平面图上不体现，本仓库未转录。
    severity_hint: error
    keywords:
      - 消防电气
  - clause_id: GB55037-2022/10.1.5
    chapter: 10.1 消防电气
    verbatim: 建筑内的消防用电设备应采用专用的供电回路，当其中的生产、生活用电被切断时，应仍能保证消防用电设备的用电需要。除三级消防用电负荷外，消防用电设备的备用消防电源的供电时间和容量，应能满足该建筑火灾延续时间内消防用电设备的持续用电要求。不同建筑的设计火灾延续时间不应小于表10.1.5 的规定。
    interpret: 消防用电设备应采用专用供电回路，生产、生活用电被切断时仍能保证消防用电。除三级负荷外，备用消防电源的供电时间与容量要满足该建筑火灾延续时间内消防设备的持续用电；不同建筑的设计火灾延续时间不小于表10.1.5。该表属消防电气参数，与平面图绘制无关，本仓库未转录。
    severity_hint: error
    keywords:
      - 消防电气
  - clause_id: GB55037-2022/10.1.6
    chapter: 10.1 消防电气
    verbatim: 除按照三级负荷供电的消防用电设备外，消防控制室、消防水泵房的消防用电设备及消防电梯等的供电，应在其配电线路的最末一级配电箱内设置自动切换装置。防烟和排烟风机房的消防用电设备的供电，应在其配电线路的最末一级配电箱内或所在防火分区的配电箱内设置自动切换装置。防火卷帘、电动排烟窗、消防潜污泵、消防应急照明和疏散指示标志等的供电，应在所在防火分区的配电箱内设置自动切换装置。
    interpret: 自动切换装置的装设位置分三档：消防控制室、消防水泵房的消防设备及消防电梯，在配电线路最末一级配电箱内设；防烟排烟风机的消防设备，在最末一级配电箱内或所在防火分区的配电箱内设；防火卷帘、电动排烟窗、消防潜污泵、消防应急照明和疏散指示标志，在所在防火分区的配电箱内设。按三级负荷供电的设备除外。
    severity_hint: error
    keywords:
      - 消防电气
  - clause_id: GB55037-2022/10.1.7
    chapter: 10.1 消防电气
    verbatim: 消防配电线路的设计和敷设，应满足在建筑的设计火灾延续时间内为消防用电设备连续供电的需要。
    interpret: 消防配电线路的设计与敷设，要能在建筑的设计火灾延续时间内为消防用电设备连续供电。这是对线路耐火性能的总要求，具体做法见后续产品标准。
    severity_hint: error
    keywords:
      - 消防电气
  - clause_id: GB55037-2022/10.1.8
    chapter: 10.1 消防电气
    verbatim: |-
      除筒仓、散装粮食仓库和火灾发展缓慢的场所外，下列建筑应设置灯光疏散指示标志，疏散指示标志及其设置间距、照度应保证疏散路线指示明确、方向指示正确清晰、视觉连续：
      1 甲、乙、丙类厂房，高层丁、戊类厂房；
      2 丙类仓库，高层仓库；
      3 公共建筑；
      4 建筑高度大于27m 的住宅建筑；
      5 除室内无车道且无人员停留的汽车库外的其他汽车库和修车库；
      6 平时使用的人民防空工程；
      7 地铁工程中的车站、换乘通道或连接通道、车辆基地、地下区间内的纵向疏散平台；
      8 城市交通隧道、城市综合管廊；
      9 城市的地下人行通道；
      10 其他地下或半地下建筑。
    interpret: 应设灯光疏散指示标志的十类建筑：甲、乙、丙类厂房与高层丁戊类厂房；丙类仓库与高层仓库；公共建筑；高度大于27m 的住宅；除室内无车道且无人员停留的汽车库外的其他汽车库修车库；平时使用的人防工程；地铁的车站、换乘通道、车辆基地、地下区间纵向疏散平台；城市交通隧道与综合管廊；城市地下人行通道；其他地下半地下建筑。指示标志的间距、照度要保证疏散路线连续可辨。
    severity_hint: error
    keywords:
      - 消防电气
      - 27m
  - clause_id: GB55037-2022/10.1.9
    chapter: 10.1 消防电气
    verbatim: |-
      除筒仓、散装粮食仓库和火灾发展缓慢的场所外，厂房、丙类仓库、民用建筑、平时使用的人民防空工程等建筑中的下列部位应设置疏散照明：
      1 安全出口、疏散楼梯（间）、疏散楼梯间的前室或合用前室、避难走道及其前室、避难层、避难间、消防专用通道、兼作人员疏散的天桥和连廊；
      2 观众厅、展览厅、多功能厅及其疏散口；
      3 建筑面积大于200m²的营业厅、餐厅、演播室、售票厅、候车（机、船）厅等人员密集的场所及其疏散口；
      4 建筑面积大于100m²的地下或半地下公共活动场所；
      5 地铁工程中的车站公共区，自动扶梯、自动人行道，楼梯，连接通道或换乘通道，车辆基地，地下区间内的纵向疏散平台；
      6 城市交通隧道两侧，人行横通道或人行疏散通道；
      7 城市综合管廊的人行道及人员出入口；
      8 城市地下人行通道。
    interpret: 应设疏散照明的部位，平面图相关的是：安全出口、疏散楼梯（间）及其前室或合用前室、避难走道及其前室、避难层、避难间、消防专用通道、兼作疏散的天桥连廊；观众厅展览厅多功能厅及其疏散口；建筑面积大于200m² 的营业厅餐厅演播室售票厅候车厅等人员密集场所及其疏散口；建筑面积大于100m² 的地下半地下公共活动场所。
    severity_hint: error
    keywords:
      - 消防电气
      - 200m²
      - 100m²
  - clause_id: GB55037-2022/10.1.10
    chapter: 10.1 消防电气
    verbatim: |-
      建筑内疏散照明的地面最低水平照度应符合下列规定：
      1 疏散楼梯间、疏散楼梯间的前室或合用前室、避难走道及其前室、避难层、避难间、消防专用通道，不应低于10.0lx；
      2 疏散走道、人员密集的场所，不应低于3.0lx；
      3 本条上述规定场所外的其他场所，不应低于1.0lx。
    interpret: 疏散照明地面最低水平照度：疏散楼梯间及其前室或合用前室、避难走道及其前室、避难层、避难间、消防专用通道不低于10.0lx；疏散走道与人员密集场所不低于3.0lx；其他场所不低于1.0lx。
    severity_hint: error
    keywords:
      - 消防电气
  - clause_id: GB55037-2022/10.1.11
    chapter: 10.1 消防电气
    verbatim: 消防控制室、消防水泵房、自备发电机房、配电室、防排烟机房以及发生火灾时仍需正常工作的消防设备房应设置备用照明，其作业面的最低照度不应低于正常照明的照度。
    interpret: 消防控制室、消防水泵房、自备发电机房、配电室、防排烟机房，以及火灾时仍需正常工作的消防设备房，应设备用照明，作业面最低照度不低于正常照明的照度。
    severity_hint: error
    keywords:
      - 消防电气
  - clause_id: GB55037-2022/10.1.12
    chapter: 10.1 消防电气
    verbatim: |-
      可能处于潮湿环境内的消防电气设备，外壳的防尘与防水等级应符合下列规定：
      1 对于交通隧道，不应低于IP55；
      2 对于城市综合管廊及其他潮湿环境，不应低于IP45。
    interpret: 可能处于潮湿环境的消防电气设备外壳防护等级：交通隧道不低于IP55；城市综合管廊及其他潮湿环境不低于IP45。
    severity_hint: error
    keywords:
      - 消防电气
  - clause_id: GB55037-2022/10.2.1
    chapter: 10.2 非消防电气线路与设备
    verbatim: 空气调节系统的电加热器应与送风机连锁，并应具有无风断电、超温断电保护装置。
    interpret: 空气调节系统的电加热器应与送风机连锁，并有无风断电、超温断电保护装置。属于设备联动要求，平面图上体现为电加热器位置与风机的对应关系。
    severity_hint: error
    keywords:
      - 非消防电气线路与设备
  - clause_id: GB55037-2022/10.2.2
    chapter: 10.2 非消防电气线路与设备
    verbatim: 地铁工程中的地下电力电缆和数据通信线缆、城市综合管廊工程中的电力电缆，应采用燃烧性能不低于B1级的电缆或阻燃型电线。
    interpret: 地铁工程中的地下电力电缆与数据通信线缆、城市综合管廊中的电力电缆，应采用燃烧性能不低于B1级的电缆或阻燃型电线。
    severity_hint: error
    keywords:
      - 非消防电气线路与设备
  - clause_id: GB55037-2022/10.2.3
    chapter: 10.2 非消防电气线路与设备
    verbatim: |-
      电气线路的敷设应符合下列规定：
      1 电气线路敷设应避开炉灶、烟囱等高温部位及其他可能受高温作业影响的部位，不应直接敷设在可燃物上；
      2 室内明敷的电气线路，在有可燃物的吊顶或难燃性、可燃性墙体内敷设的电气线路，应具有相应的防火性能或防火保护措施；
      3 室外电缆沟或电缆隧道在进入建筑、工程或变电站处应采取防火分隔措施，防火分隔部位的耐火极限不应低于2.00h，门应采用甲级防火门。
    interpret: 电气线路敷设三条：①避开炉灶、烟囱等高温部位及其他受高温作业影响的部位，不得直接敷设在可燃物上；②室内明敷线路，以及在有可燃物吊顶内、难燃或可燃墙体内敷设的线路，要有相应防火性能或防火保护措施；③室外电缆沟或电缆隧道进入建筑、工程或变电站处要设防火分隔，分隔部位耐火极限不低于2.00h，门用甲级防火门。第③款是平面图上的洞口封堵要求。
    severity_hint: error
    keywords:
      - 非消防电气线路与设备
      - 2.00h
  - clause_id: GB55037-2022/10.2.4
    chapter: 10.2 非消防电气线路与设备
    verbatim: 城市交通隧道内的供电线路应与其他管道分开敷设，在隧道内借道敷设的10kV 及以上的高压电缆应采用耐火极限不低于2.00h 的耐火结构与隧道内的其他区域分隔。
    interpret: 城市交通隧道内的供电线路应与其他管道分开敷设；借道敷设的10kV 及以上高压电缆，要用耐火极限不低于2.00h 的耐火结构与隧道其他区域分隔。
    severity_hint: error
    keywords:
      - 非消防电气线路与设备
      - 2.00h
  - clause_id: GB55037-2022/10.2.5
    chapter: 10.2 非消防电气线路与设备
    verbatim: 架空电力线路不应跨越生产或储存易燃、易爆物质的建筑，仓库区域，危险品站台，及其他有爆炸危险的场所，相互间的最小水平距离不应小于电杆或电塔高度的1.5 倍。1kV 及以上的架空电力线路不应跨越可燃性建筑屋面。
    interpret: 架空电力线路不得跨越生产或储存易燃易爆物质的建筑、仓库区域、危险品站台及其他有爆炸危险的场所，相互间最小水平距离不小于电杆或电塔高度的1.5 倍；1kV 及以上架空线路不得跨越可燃性建筑屋面。这条同时约束总平面布置，第11.0.1 条第3款把它引到了施工现场。
    severity_hint: error
    keywords:
      - 非消防电气线路与设备
  - clause_id: GB55037-2022/11.0.1
    chapter: 11 建筑施工
    verbatim: |-
      建筑施工现场应根据场内可燃物数量、燃烧特性、存放方式与位置，可能的火源类型和位置，风向、水源和电源等现场情况采取防火措施，并应符合下列规定：
      1 施工现场临时建筑或设施的布置应满足现场消防安全要求；
      2 易燃易爆危险品库房与在建建筑、固定动火作业区、邻近人员密集区、建筑物相对集中区及其他建筑的间距应符合防火要求；
      3 当可燃材料堆场及加工场所、易燃易爆危险品库房的上方或附近有架空高压电力线时，其布置应符合本规范第10.2.5 条的规定；
      4 固定动火作业区应位于可燃材料存放位置及加工场所、易燃易爆危险品库房等场所的全年最小频率风向的上风侧。
    interpret: 施工现场防火的四款：①临时建筑或设施布置要满足现场消防要求；②易燃易爆危险品库房与在建建筑、固定动火作业区、邻近人员密集区、建筑物相对集中区及其他建筑的间距要符合防火要求；③可燃材料堆场及加工场所、易燃易爆危险品库房上方或附近有架空高压电力线时，按10.2.5 条执行（不得跨越、水平距离不小于杆高的1.5 倍）；④固定动火作业区要位于可燃材料存放与加工区、易燃易爆危险品库房的全年最小频率风向的上风侧。
    severity_hint: error
    keywords:
      - 11 建筑施工
  - clause_id: GB55037-2022/11.0.2
    chapter: 11 建筑施工
    verbatim: 建筑施工现场应设置消防水源、配置灭火器材，在建高层建筑应随建设高度同步设置消防供水竖管与消防软管卷盘、室内消火栓接口。在建建筑和临时建筑均应设置疏散门、疏散楼梯等疏散设施。
    interpret: 施工现场应设消防水源、配灭火器材；在建高层建筑要随建设高度同步设置消防供水竖管、消防软管卷盘和室内消火栓接口；在建建筑和临时建筑都要设疏散门、疏散楼梯等疏散设施。
    severity_hint: error
    keywords:
      - 11 建筑施工
  - clause_id: GB55037-2022/11.0.3
    chapter: 11 建筑施工
    verbatim: 建筑施工现场的临时办公用房与生活用房、发电机房、变配电站、厨房操作间、锅炉房和可燃材料与易燃易爆物品库房，当围护结构、房间隔墙和吊顶采用金属夹芯板材时，芯材的燃烧性能应为A 级。
    interpret: 施工现场的临时办公用房、生活用房、发电机房、变配电站、厨房操作间、锅炉房，以及可燃材料与易燃易爆物品库房，当围护结构、房间隔墙和吊顶采用金属夹芯板材时，芯材燃烧性能应为A级。
    severity_hint: error
    keywords:
      - 11 建筑施工
  - clause_id: GB55037-2022/11.0.4
    chapter: 11 建筑施工
    verbatim: |-
      扩建、改建建筑施工时，施工区域应停止建筑正常使用。非施工区域如继续正常使用，应符合下列规定：
      1 在施工区域与非施工区域之间应采取防火分隔措施；
      2 外脚手架搭设不应影响安全疏散、消防车正常通行、外部消防救援；
      3 焊接、切割、烘烤或加热等动火作业前和作业后，应清理作业现场的可燃物，作业现场及其下方或附近不能移走的可燃物应采取防火措施；
      4 不应直接在裸露的可燃或易燃材料上动火作业；
      5 不应在具有爆炸危险性的场所使用明火、电炉，以及高温直接取暖设备。
    interpret: 扩建、改建施工时施工区域应停止建筑正常使用；非施工区域继续使用的五条要求：①施工区与非施工区之间设防火分隔；②外脚手架不得影响安全疏散、消防车通行与外部救援；③动火作业前后清理可燃物，不能移走的要采取防火措施；④不得直接在裸露的可燃或易燃材料上动火；⑤有爆炸危险的场所不得使用明火、电炉及高温直接取暖设备。
    severity_hint: error
    keywords:
      - 11 建筑施工
  - clause_id: GB55037-2022/11.0.5
    chapter: 11 建筑施工
    verbatim: 保障施工现场消防供水的消防水泵供电电源应能在火灾时保持不间断供电，供配电线路应为专用消防配电线路。
    interpret: 保障施工现场消防供水的消防水泵供电电源要能在火灾时保持不间断供电，供配电线路应为专用消防配电线路。
    severity_hint: error
    keywords:
      - 11 建筑施工
  - clause_id: GB55037-2022/11.0.6
    chapter: 11 建筑施工
    verbatim: 施工现场临时供配电线路选型、敷设，照明器具设置，施工所需易燃和可燃物质使用、存放，用火、用电和用气均应符合消防安全要求。
    interpret: 施工现场临时供配电线路的选型与敷设、照明器具设置、易燃可燃物质的使用存放、用火用电用气，均应符合消防安全要求。兜底条，具体做法见施工现场消防技术标准。
    severity_hint: error
    keywords:
      - 11 建筑施工
  - clause_id: GB55037-2022/12.0.1
    chapter: 12 使用与维护
    verbatim: 市政消火栓、室外消火栓、消防水泵接合器等室外消防设施周围应设置防止机动车辆撞击的设施。消火栓、消防水泵接合器两侧沿道路方向各5m 范围内禁止停放机动车，并应在明显位置设置警示标志。
    interpret: 市政消火栓、室外消火栓、消防水泵接合器等室外消防设施，周围要设防止机动车撞击的设施；消火栓与水泵接合器两侧沿道路方向各5m 范围内禁止停车，并在明显位置设警示标志。这条在总平面上表现为设施周边5m 的禁停带与防撞柱。
    severity_hint: error
    keywords:
      - 12 使用与维护
      - 5m
  - clause_id: GB55037-2022/12.0.2
    chapter: 12 使用与维护
    verbatim: 建筑周围的消防车道和消防车登高操作场地应保持畅通，其范围内不应存放机动车辆，不应设置隔离桩、栏杆等可能影响消防车通行的障碍物，并应设置明显的消防车道或消防车登高操作场地的标识和不得占用、阻塞的警示标志。
    interpret: 建筑周围的消防车道与消防车登高操作场地要保持畅通：范围内不得存放机动车，不得设隔离桩、栏杆等影响通行的障碍物，并设明显标识和禁止占用、阻塞的警示标志。
    severity_hint: error
    keywords:
      - 12 使用与维护
  - clause_id: GB55037-2022/12.0.3
    chapter: 12 使用与维护
    verbatim: 地下、半地下场所内不应使用或储存闪点低于60℃的液体、液化石油气及其他相对密度不小于0.75 的可燃气体，不应敷设输送上述可燃液体或可燃气体的管道。
    interpret: 地下、半地下场所内不得使用或储存闪点低于60℃ 的液体、液化石油气及其他相对密度不小于0.75 的可燃气体，也不得敷设输送上述液体或气体的管道。
    severity_hint: error
    keywords:
      - 12 使用与维护
      - 60℃
  - clause_id: GB55037-2022/12.0.4
    chapter: 12 使用与维护
    verbatim: |-
      瓶装液化石油气的使用应符合下列规定：
      1 在高层建筑内不应使用瓶装液化石油气；
      2 液化石油气钢瓶应避免受到日光直射或火源、热源的直接辐射作用，与灶具的间距不应小于0.5m；
      3 瓶装液化石油气应与其他化学危险物品分开存放；
      4 充装量不小于50kg 的液化石油气容器应设置在所服务建筑外的单层专用房间内，并应采取防火措施；
      5 液化石油气容器不应超量罐装，不应使用超量罐装的气瓶；
      6 不应敲打、倒置或碰撞液化石油气容器，不应倾倒残液或私自灌气。
    interpret: 瓶装液化石油气六条：①高层建筑内不得使用瓶装液化石油气；②钢瓶避免日光直射或火源热源直接辐射，与灶具间距不小于0.5m；③与其他化学危险物品分开存放；④充装量不小于50kg 的容器应设在所服务建筑外的单层专用房间内并采取防火措施；⑤不得超量罐装；⑥不得敲打、倒置、碰撞容器，不得倾倒残液或私自灌气。第①④条影响平面布置（住宅与餐饮的燃气方案）。
    severity_hint: error
    keywords:
      - 12 使用与维护
      - 0.5m
  - clause_id: GB55037-2022/12.0.5
    chapter: 12 使用与维护
    verbatim: 存放瓶装液化石油气和使用可燃气体、可燃液体的房间，应防止可燃气体在室内积聚。
    interpret: 存放瓶装液化石油气、使用可燃气体或可燃液体的房间，应防止可燃气体在室内积聚。做法是通风或设探测器，属于使用管理要求。
    severity_hint: error
    keywords:
      - 12 使用与维护
  - clause_id: GB55037-2022/12.0.6
    chapter: 12 使用与维护
    verbatim: 在建筑使用或运营期间，应确保疏散出口、疏散通道畅通，不被占用、堵塞或封闭。
    interpret: 建筑使用或运营期间，应确保疏散出口与疏散通道畅通，不被占用、堵塞或封闭。这是运维条，也是「验收后私改」最常见的违规。
    severity_hint: error
    keywords:
      - 12 使用与维护
  - clause_id: GB55037-2022/12.0.7
    chapter: 12 使用与维护
    verbatim: 照明灯具使用应满足消防安全要求，开关、插座和照明灯具靠近可燃物时，应采取隔热、散热等防火措施。
    interpret: 照明灯具使用要满足消防安全要求；开关、插座和照明灯具靠近可燃物时，应采取隔热、散热等防火措施。
    severity_hint: error
    keywords:
      - 12 使用与维护
