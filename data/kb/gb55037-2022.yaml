  - clause_id: GB55037-2022/7.3.1
    chapter: 7.3 住宅建筑
    verbatim: |-
      住宅建筑中符合下列条件之一的住宅单元，每层的安全出口不应少于2个：
      1 任一层建筑面积大于650m²的住宅单元；
      2 建筑高度大于54m 的住宅单元；
      3 建筑高度不大于27m，但任一户门至最近安全出口的疏散距离大于15m 的住宅单元；
      4 建筑高度大于27m、不大于54m，但任一户门至最近安全出口的疏散距离大于10m 的住宅单元。
    interpret: 住宅单元每层安全出口不少于2个的四个条件（满足其一）：任一层建筑面积大于650m²；建筑高度大于54m；高度不大于27m 但任一户门到最近安全出口的疏散距离大于15m；高度大于27m 且不大于54m 但该距离大于10m。这是判断「一梯多户单楼梯」能不能成立的关键条。
    severity_hint: error
    keywords:
      - 住宅建筑
      - 2个
      - 650m²
      - 54m
      - 27m
      - 15m
      - 10m
  - clause_id: GB55037-2022/7.3.2
    chapter: 7.3 住宅建筑
    verbatim: |-
      住宅建筑的室内疏散楼梯应符合下列规定：
      1 建筑高度不大于21m 的住宅建筑，当户门的耐火完整性低于1.00h 时，与电梯井相邻布置的疏散楼梯应为封闭楼梯间；
      2 建筑高度大于21m、不大于33m 的住宅建筑，当户门的耐火完整性低于1.00h 时，疏散楼梯应为封闭楼梯间；
      3 建筑高度大于33m 的住宅建筑，疏散楼梯应为防烟楼梯间，开向防烟楼梯间前室或合用前室的户门应为耐火性能不低于乙级的防火门；
      4 建筑高度大于27m、不大于54m 且每层仅设置1 部疏散楼梯的住宅单元，户门的耐火完整性不应低于1.00h，疏散楼梯应通至屋面；
      5 多个单元的住宅建筑中通至屋面的疏散楼梯应能通过屋面连通。
    interpret: 住宅室内疏散楼梯五条：①高度不大于21m，户门耐火完整性低于1.00h 时，与电梯井相邻布置的楼梯应为封闭楼梯间；②高度大于21m 且不大于33m，户门完整性低于1.00h 时，楼梯应为封闭楼梯间；③高度大于33m，楼梯应为防烟楼梯间，开向前室或合用前室的户门应为不低于乙级的防火门；④高度大于27m 且不大于54m 且每层仅1部楼梯的单元，户门耐火完整性不低于1.00h，楼梯应通至屋面；⑤多单元住宅通至屋面的楼梯应能通过屋面连通。
    severity_hint: error
    keywords:
      - 住宅建筑
      - 21m
      - 1.00h
      - 33m
      - 27m
      - 54m
      - 1部
  - clause_id: GB55037-2022/7.4.1
    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: |-
      公共建筑内每个防火分区或一个防火分区的每个楼层的安全出口不应少于2 个；仅设置1 个安全出口或1 部疏散楼梯的公共建筑应符合下列条件之一：
      1 除托儿所、幼儿园外，建筑面积不大于200m2且人数不大于50 人的单层公共建筑或多层公共建筑的首层；
      2 除医疗建筑、老年人照料设施、儿童活动场所、歌舞娱乐放映游艺场所外，符合表7.4.1 规定的公共建筑。
    interpret: 公共建筑每个防火分区或每层安全出口不应少于2个。仅设1个安全出口或1部疏散楼梯的，须满足其一：①除托儿所、幼儿园外，建筑面积不大于200m² 且人数不大于50人的单层公共建筑，或多层公共建筑的首层；②除医疗建筑、老年人照料设施、儿童活动场所、歌舞娱乐放映游艺场所外，符合表7.4.1的公共建筑。表7.4.1三行是并列的三个上限：一、二级和三级/木结构建筑都最多3层、每层不超过200m²，差别在人数——前者第二三层之和≤50人、后者≤25人；四级最多2层、每层≤200m²、第二层人数≤15人。楼层数、每层面积、人数三个条件要同时满足。
    severity_hint: error
    keywords:
      - 公共建筑和非住宅类居住建筑
      - 2个
