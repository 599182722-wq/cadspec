  - clause_id: GB55037-2022/4.2.3
    chapter: 4.2 工业建筑
    verbatim: 设置在厂房内的甲、乙、丙类中间仓库，应采用防火墙和耐火极限不低于1.50h 的不燃性楼板与其他部位分隔。
    interpret: 设在厂房内的甲、乙、丙类中间仓库，要用防火墙加1.50h 不燃性楼板与其他部位分隔。
    severity_hint: error
    keywords:
      - 工业建筑
      - 1.50h
  - clause_id: GB55037-2022/4.2.4
    chapter: 4.2 工业建筑
    verbatim: 与甲、乙类厂房贴邻并供该甲、乙类厂房专用的10kV 及以下的变（配）电站，应采用无开口的防火墙或抗爆墙一面贴邻，与乙类厂房贴邻的防火墙上的开口应为甲级防火窗。其他变（配）电站应设置在甲、乙类厂房以及爆炸危险性区域外，不应与甲、乙类厂房贴邻。
    interpret: 供甲、乙类厂房专用的10kV 及以下变（配）电站，只能用无开口的防火墙或抗爆墙一面贴邻；与乙类厂房贴邻的防火墙，其开口应为甲级防火窗。其他变（配）电站一律设在甲、乙类厂房和爆炸危险区域之外，不得贴邻。
    severity_hint: error
    keywords:
      - 工业建筑
  - clause_id: GB55037-2022/4.2.5
    chapter: 4.2 工业建筑
    verbatim: 甲、乙类仓库和储存丙类可燃液体的仓库应为单、多层建筑。
    interpret: 甲、乙类仓库和储存丙类可燃液体的仓库，只能是单层或多层建筑，不得建成高层。
    severity_hint: error
    keywords:
      - 工业建筑
  - clause_id: GB55037-2022/4.2.6
    chapter: 4.2 工业建筑
    verbatim: 仓库内的防火分区或库房之间应采用防火墙分隔，甲、乙类库房内的防火分区或库房之间应采用无任何开口的防火墙分隔。
    interpret: 仓库内防火分区之间、库房之间用防火墙分隔；甲、乙类库房内的防火分区或库房之间，防火墙必须是**无任何开口**的。
    severity_hint: error
    keywords:
      - 工业建筑
  - clause_id: GB55037-2022/4.2.7
    chapter: 4.2 工业建筑
    verbatim: 仓库内不应设置员工宿舍及与库房运行、管理无直接关系的其他用房。甲、乙类仓库内不应设置办公室、休息室等辅助用房，不应与办公室、休息室等辅助用房及其他场所贴邻。丙、丁类仓库内的办公室、休息室等辅助用房，应采用防火门、防火窗、耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.00h 的楼板与其他部位分隔，并应设置独立的安全出口。
    interpret: 仓库内不得设员工宿舍以及与库房运行管理无关的用房。甲、乙类仓库内不得设办公室、休息室等辅助用房，也不得与之贴邻。丙、丁类仓库内的办公室、休息室用防火门窗加2.00h 隔墙、1.00h 楼板分隔，并设独立安全出口。
    severity_hint: error
    keywords:
      - 工业建筑
      - 2.00h
      - 1.00h
  - clause_id: GB55037-2022/4.2.8
    chapter: 4.2 工业建筑
    verbatim: 使用和生产甲、乙、丙类液体的场所中，管、沟不应与相邻建筑或场所的管、沟相通，下水道应采取防止含可燃液体的污水流入的措施。
    interpret: 使用和生产甲、乙、丙类液体的场所，其管、沟不得与相邻建筑或场所的管、沟相通；下水道要采取防止含可燃液体污水流入的措施。
    severity_hint: error
    keywords:
      - 工业建筑
  - clause_id: GB55037-2022/4.3.1
    chapter: 4.3 民用建筑
    verbatim: 民用建筑内不应设置经营、存放或使用甲、乙类火灾危险性物品的商店、作坊或储藏间等。民用建筑内除可设置为满足建筑使用功能的附属库房外，不应设置生产场所或其他库房，不应与工业建筑组合建造。
    interpret: 民用建筑内不得设置经营、存放或使用甲、乙类火灾危险性物品的商店、作坊、储藏间。除满足使用功能的附属库房外，不得设生产场所或其他库房，也不得与工业建筑组合建造。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.2
    chapter: 4.3 民用建筑
    verbatim: |-
      住宅与非住宅功能合建的建筑应符合下列规定：
      1 除汽车库的疏散出口外，住宅部分与非住宅部分之间应采用耐火极限不低于2.00h，且无开口的防火隔墙和耐火极限不低于2.00h 的不燃性楼板完全分隔。
      2 住宅部分与非住宅部分的安全出口和疏散楼梯应分别独立设置。
      3 为住宅服务的地上车库应设置独立的安全出口或疏散楼梯，地下车库的疏散楼梯间应按本规范第7.1.10 条的规定分隔。
      4 住宅与商业设施合建的建筑按照住宅建筑的防火要求建造的，应符合下列规定：1）商业设施中每个独立单元之间应采用耐火极限不低于2.00h 且无开口的防火隔墙分隔；2）每个独立单元的层数不应大于2 层，且2 层的总建筑面积不应大于300m2；3）每个独立单元中建筑面积大于200m2的任一楼层均应设置至少2 个疏散出口。
    interpret: 住宅与非住宅功能合建的建筑：①除汽车库疏散出口外，住宅与非住宅部分之间用2.00h 且无开口的防火隔墙加2.00h 不燃楼板完全分隔；②安全出口与疏散楼梯分别独立设置；③为住宅服务的地上车库设独立安全出口或疏散楼梯，地下车库楼梯间按7.1.10 分隔；④按住宅防火要求建造的住宅商业合建，商业每个独立单元之间用2.00h 无开口隔墙、单元层数不大于2层且2层总建筑面积不大于300m²、单元内任一楼层建筑面积大于200m²时应设至少2个疏散出口。
    severity_hint: error
    keywords:
      - 民用建筑
      - 2.00h
      - 2层
      - 300m2
      - 200m2
      - 2个
  - clause_id: GB55037-2022/4.3.3
    chapter: 4.3 民用建筑
    verbatim: |-
      商店营业厅、公共展览厅等的布置应符合下列规定：
      1 对于一、二级耐火等级建筑，应布置在地下二层及以上的楼层；
      2 对于三级耐火等级建筑，应布置在首层或二层；
      3 对于四级耐火等级建筑，应布置在首层。
    interpret: 商店营业厅、公共展览厅的楼层限制：一、二级耐火等级建筑可设在地下二层及以上；三级耐火等级建筑只能在首层或二层；四级耐火等级建筑只能在首层。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.4
    chapter: 4.3 民用建筑
    verbatim: |-
      儿童活动场所的布置应符合下列规定：
      1 不应布置在地下或半地下；
      2 对于一、二级耐火等级建筑，应布置在首层、二层或三层；
      3 对于三级耐火等级建筑，应布置在首层或二层；
      4 对于四级耐火等级建筑，应布置在首层。
    interpret: 儿童活动场所：不得设在地下或半地下；一、二级耐火等级建筑可设在首层、二层、三层；三级只能首层或二层；四级只能首层。住宅小区里的幼儿园、托育点都按这条判。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.5
    chapter: 4.3 民用建筑
    verbatim: |-
      老年人照料设施的布置应符合下列规定：
      1 对于一、二级耐火等级建筑，不应布置在楼地面设计标高大于54m 的楼层上；
      2 对于三级耐火等级建筑，应布置在首层或二层；
      3 居室和休息室不应布置在地下或半地下；
      4 老年人公共活动用房、康复与医疗用房，应布置在地下一层及以上楼层，当布置在半地下或地下一层、地上四层及以上楼层时，每个房间的建筑面积不应大于200m2且使用人数不应大于30 人。
    interpret: 老年人照料设施：一、二级耐火等级建筑不得设在楼地面设计标高大于54m 的楼层；三级只能首层或二层；居室与休息室不得设在地下或半地下；公共活动用房、康复与医疗用房可设在地下一层及以上，但设在半地下、地下一层、地上四层及以上时，每个房间建筑面积不大于200m²且使用人数不大于30人。
    severity_hint: error
    keywords:
      - 民用建筑
      - 54m
      - 200m2
      - 30人
  - clause_id: GB55037-2022/4.3.6
    chapter: 4.3 民用建筑
    verbatim: |-
      医疗建筑中住院病房的布置和分隔应符合下列规定：
      1 不应布置在地下或半地下；
      2 对于三级耐火等级建筑，应布置在首层或二层；
      3 建筑内相邻护理单元之间应采用耐火极限不低于2.00h 的防火隔墙和甲级防火门分隔。
    interpret: 医疗建筑住院病房：不得设在地下或半地下；三级耐火等级建筑只能设在首层或二层；相邻护理单元之间用2.00h 防火隔墙加甲级防火门分隔，平面上量隔墙与门。
    severity_hint: error
    keywords:
      - 民用建筑
      - 2.00h
  - clause_id: GB55037-2022/4.3.7
    chapter: 4.3 民用建筑
    verbatim: |-
      歌舞娱乐放映游艺场所的布置和分隔应符合下列规定：
      1 应布置在地下一层及以上且埋深不大于10m 的楼层；
      2 当布置在地下一层或地上四层及以上楼层时，每个房间的建筑面积不应大于200m2；
      3 房间之间应采用耐火极限不低于2.00h 的防火隔墙分隔；
      4 与建筑的其他部位之间应采用防火门、耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.00h 的不燃性楼板分隔。
    interpret: 歌舞娱乐放映游艺场所：只能设在地下一层及以上且埋深不大于10m 的楼层；设在地下一层或地上四层及以上时每个房间建筑面积不大于200m²；房间之间用2.00h 防火隔墙分隔；与建筑其他部位之间用防火门加2.00h 隔墙、1.00h 不燃楼板分隔。
    severity_hint: error
    keywords:
      - 民用建筑
      - 10m
      - 200m2
      - 2.00h
      - 1.00h
  - clause_id: GB55037-2022/4.3.8
    chapter: 4.3 民用建筑
    verbatim: |-
      I 级木结构建筑中的下列场所应布置在首层、二层或三层：
      1 商店营业厅、公共展览厅等；
      2 儿童活动场所、老年人照料设施；
      3 医疗建筑中的住院病房；
      4 歌舞娱乐放映游艺场所。
    interpret: Ⅰ级木结构建筑中，商店营业厅与公共展览厅、儿童活动场所与老年人照料设施、住院病房、歌舞娱乐放映游艺场所，只能布置在首层、二层或三层。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.9
    chapter: 4.3 民用建筑
    verbatim: |-
      Ⅱ级木结构建筑中的下列场所应布置在首层或二层：
      1 商店营业厅、公共展览厅等；
      2 儿童活动场所、老年人照料设施；
      3 医疗建筑中的住院病房。
    interpret: Ⅱ级木结构建筑中，商店营业厅与公共展览厅、儿童活动场所与老年人照料设施、住院病房，只能布置在首层或二层。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.10
    chapter: 4.3 民用建筑
    verbatim: |-
      Ⅲ级木结构建筑中的下列场所应布置在首层：
      1 商店营业厅、公共展览厅等；
      2 儿童活动场所。
    interpret: Ⅲ级木结构建筑中，商店营业厅与公共展览厅、儿童活动场所，只能布置在首层。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.11
    chapter: 4.3 民用建筑
    verbatim: |-
      燃气调压用房、瓶装液化石油气瓶组用房应独立建造，不应与居住建筑、人员密集的场所及其他高层民用建筑贴邻；贴邻其他民用建筑的，应采用防火墙分隔，门、窗应向室外开启。瓶装液化石油气瓶组用房应符合下列规定：
      1 当与所服务建筑贴邻布置时，液化石油气瓶组的总容积不应大于1m3，并应采用自然气化方式供气；
      2 瓶组用房的总出气管道上应设置紧急事故自动切断阀；
      3 瓶组用房内应设置可燃气体探测报警装置。
    interpret: 燃气调压用房、瓶装液化石油气瓶组用房应独立建造，不得与居住建筑、人员密集场所及其他高层民用建筑贴邻；贴邻其他民用建筑时用防火墙分隔，门窗向室外开启。瓶组用房另有三条：与所服务建筑贴邻布置时瓶组总容积不大于1m³且用自然气化供气；总出气管道设紧急事故自动切断阀；室内设可燃气体探测报警装置。
    severity_hint: error
    keywords:
      - 民用建筑
      - 1m
  - clause_id: GB55037-2022/4.3.12
    chapter: 4.3 民用建筑
    verbatim: 建筑内使用天然气的部位应便于通风和防爆泄压。
    interpret: 建筑内使用天然气的部位要便于通风和防爆泄压。平面图上体现为用气房间靠外墙、有可开启外窗或泄压面。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.13
    chapter: 4.3 民用建筑
    verbatim: 四级生物安全实验室应独立划分防火分区，或与三级生物安全实验室共用一个防火分区。
    interpret: 四级生物安全实验室应独立划分防火分区，或与三级生物安全实验室共用一个防火分区。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.14
    chapter: 4.3 民用建筑
    verbatim: |-
      交通车站、码头和机场的候车（船、机）建筑乘客公共区、交通换乘区和通道的布置应符合下列规定：
      1 不应设置公共娱乐、演艺或经营性住宿等场所；
      2 乘客通行的区域内不应设置商业设施，用于防火隔离的区域内不应布置任何可燃物体；
      3 商业设施内不应使用明火。
    interpret: 交通车站、码头、机场的候车（船、机）建筑：乘客公共区、换乘区、通道内不得设公共娱乐、演艺或经营性住宿场所；乘客通行区域内不得设商业设施，用于防火隔离的区域内不得布置任何可燃物体；商业设施内不得使用明火。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/4.3.15
    chapter: 4.3 民用建筑
    verbatim: |-
      一、二级耐火等级建筑内的商店营业厅，当设置自动灭火系统和火灾自动报警系统并采用不燃或难燃装修材料时，每个防火分区的最大允许建筑面积应符合下列规定：
      1 设置在高层建筑内时，不应大于4000m2；
      2 设置在单层建筑内或仅设置在多层建筑的首层时，不应大于10000m2；
      3 设置在地下或半地下时，不应大于2000m2。
    interpret: 一、二级耐火等级建筑内的商店营业厅，在设自动灭火系统、火灾自动报警系统并采用不燃或难燃装修材料的前提下，每个防火分区最大允许建筑面积：设在高层建筑内不大于4000m²；设在单层建筑内或仅设在多层建筑首层不大于10000m²；设在地下或半地下不大于2000m²。
    severity_hint: error
    keywords:
      - 民用建筑
      - 4000m2
      - 10000m2
      - 2000m2
  - clause_id: GB55037-2022/4.3.16
    chapter: 4.3 民用建筑
    verbatim: |-
      除有特殊要求的建筑、木结构建筑和附建于民用建筑中的汽车库外，其他公共建筑中每个防火分区的最大允许建筑面积应符合下列规定：
      1 对于高层建筑，不应大于1500m2。
      2 对于一、二级耐火等级的单、多层建筑，不应大于2500m2；对于三级耐火等级的单、多层建筑，不应大于1200m2；对于四级耐火等级的单、多层建筑，不应大于600m2。
      3 对于地下设备房，不应大于1000m2；对于地下其他区域，不应大于500m2。
      4 当防火分区全部设置自动灭火系统时，上述面积可以增加1.0 倍；当局部设置自动灭火系统时，可按该局部区域建筑面积的1/2 计入所在防火分区的总建筑面积。
    interpret: 公共建筑每个防火分区的最大允许建筑面积（有特殊要求的建筑、木结构建筑、附建于民用建筑的汽车库除外）：高层不大于1500m²；一、二级单多层不大于2500m²，三级不大于1200m²，四级不大于600m²；地下设备房不大于1000m²，地下其他区域不大于500m²。全部设自动灭火系统时面积可增加1.0倍；局部设置时该局部面积按一半计入所在分区总面积。这是平面图核查里最常算的一条。
    severity_hint: error
    keywords:
      - 民用建筑
      - 1500m2
      - 2500m2
      - 1200m2
      - 600m2
      - 1000m2
      - 500m2
  - clause_id: GB55037-2022/4.3.17
    chapter: 4.3 民用建筑
    verbatim: 总建筑面积大于20000m 2的地下或半地下商店，应分隔为多个建筑面积不大于20000m 2的区域且防火分隔措施应可靠、有效。
    interpret: 总建筑面积大于20000m² 的地下或半地下商店，必须分隔为多个建筑面积不大于20000m² 的区域，且分隔措施要可靠有效。注意这里的门槛是**总建筑面积**，不是单个防火分区面积。
    severity_hint: error
    keywords:
      - 民用建筑
      - 20000m
  - clause_id: GB55037-2022/4.4.1
    chapter: 4.4 其他工程
    verbatim: |-
      地铁车站的公共区与设备区之间应采取防火分隔措施，车站内的商业设施和非地铁功能设施的布置应符合下列规定：
      1 公共区内不应设置公共娱乐场所；
      2 在站厅的乘客疏散区、站台层、出入口通道和其他用于乘客疏散的专用通道内，不应布置商业设施或非地铁功能设施；
      3 站厅公共区内的商业设施不应经营或储存甲、乙类火灾危险性的物品，不应储存可燃性液体类物品。
    interpret: 地铁车站公共区与设备区之间要防火分隔。站内商业设施与非地铁功能设施：公共区内不得设公共娱乐场所；站厅乘客疏散区、站台层、出入口通道及其他乘客疏散专用通道内不得布置商业设施或非地铁功能设施；站厅公共区内的商业设施不得经营或储存甲、乙类火灾危险性物品，不得储存可燃液体。
    severity_hint: error
  - clause_id: GB55037-2022/4.4.2
    chapter: 4.4 其他工程
    verbatim: 地铁车站的站厅、站台、出入口通道、换乘通道、换乘厅与非地铁功能设施之间应采取防火分隔措施。
    interpret: 地铁车站的站厅、站台、出入口通道、换乘通道、换乘厅与非地铁功能设施之间应采取防火分隔措施。
    severity_hint: error
  - clause_id: GB55037-2022/4.4.3
    chapter: 4.4 其他工程
    verbatim: |-
      地铁工程中的下列场所应分别独立设置，并应采用防火门（窗）、耐火极限不低于2.00h 的防火隔墙和耐火极限不低于1.50h 的楼板与其他部位分隔：
      1 车站控制室（含防灾报警设备室）、车辆基地控制室（含防灾报警设备室）、环控电控室、站台门控制室；
      2 变电站、配电室、通信及信号机房；
      3 固定灭火装置设备室、消防水泵房；
      4 废水泵房、通风机房、蓄电池室；
      5 车站和车辆基地内火灾时需继续运行的其他房间。
    interpret: 地铁工程中五类场所应分别独立设置，并用防火门窗加2.00h 隔墙、1.50h 楼板与其他部位分隔：车站控制室（含防灾报警设备室）与车辆基地控制室、环控电控室、站台门控制室；变电站、配电室、通信及信号机房；固定灭火装置设备室、消防水泵房；废水泵房、通风机房、蓄电池室；火灾时需继续运行的其他房间。
    severity_hint: error
    keywords:
      - 2.00h
      - 1.50h
  - clause_id: GB55037-2022/4.4.4
    chapter: 4.4 其他工程
    verbatim: 在地铁车辆基地建筑的上部建造其他功能的建筑时，车辆基地建筑与其他功能的建筑之间应采用耐火极限不低于3.00h 的楼板分隔，车辆基地建筑中承重的柱、梁和墙体的耐火极限均不应低于3.00h，楼板的耐火极限不应低于2.00h。
    interpret: 在地铁车辆基地建筑上部建造其他功能建筑时，两者之间用3.00h 楼板分隔；车辆基地建筑承重的柱、梁、墙体耐火极限均不低于3.00h，楼板不低于2.00h。
    severity_hint: error
    keywords:
      - 3.00h
      - 2.00h
  - clause_id: GB55037-2022/4.4.5
    chapter: 4.4 其他工程
    verbatim: 交通隧道内的变电站、管廊、专用疏散通道、通风机房及其他辅助用房等，应采用耐火极限不低于2.00h 的防火隔墙等与车行隧道分隔。
    interpret: 交通隧道内的变电站、管廊、专用疏散通道、通风机房及其他辅助用房，用2.00h 防火隔墙等与车行隧道分隔。
    severity_hint: error
    keywords:
      - 2.00h
  - clause_id: GB55037-2022/5.1.1
    chapter: 5.1 一般规定
    verbatim: 建筑的耐火等级或工程结构的耐火性能，应与其火灾危险性，建筑高度、使用功能和重要性，火灾扑救难度等相适应。
    interpret: 原则条：建筑的耐火等级或结构耐火性能，要与火灾危险性、建筑高度、使用功能与重要性、火灾扑救难度相适应。这是后面5.2、5.3节分类定级的依据。
    severity_hint: error
  - clause_id: GB55037-2022/5.1.2
    chapter: 5.1 一般规定
    verbatim: 地下、半地下建筑（室）的耐火等级应为一级。
    interpret: 地下、半地下建筑（室）的耐火等级一律为一级。没有例外，也没有按规模放宽的余地。
    severity_hint: error
  - clause_id: GB55037-2022/5.1.3
    chapter: 5.1 一般规定
    verbatim: 建筑高度大于100m 的工业与民用建筑楼板的耐火极限不应低于2.00h。一级耐火等级工业与民用建筑的上人平屋顶，屋面板的耐火极限不应低于1.50h；二级耐火等级工业与民用建筑的上人平屋顶，屋面板的耐火极限不应低于1.00h。
    interpret: 建筑高度大于100m 的工业与民用建筑，楼板耐火极限不低于2.00h。上人平屋顶的屋面板：一级耐火等级建筑不低于1.50h，二级不低于1.00h。
    severity_hint: error
    keywords:
      - 100m
      - 2.00h
      - 1.50h
      - 1.00h
  - clause_id: GB55037-2022/5.1.4
    chapter: 5.1 一般规定
    verbatim: |-
      建筑中承重的下列结构或构件应根据设计耐火极限和受力情况等进行耐火性能验算和防火保护设计，或采用耐火试验验证其耐火性能：
      1 金属结构或构件；
      2 木结构或构件；
      3 组合结构或构件；
      4 钢筋混凝土结构或构件。
    interpret: 建筑中承重的金属结构、木结构、组合结构、钢筋混凝土结构及其构件，都要按设计耐火极限和受力情况做耐火性能验算与防火保护设计，或者用耐火试验验证。这是结构专业的活儿，建筑图上看不出来，但设计说明里应当交代。
    severity_hint: error
  - clause_id: GB55037-2022/5.1.5
    chapter: 5.1 一般规定
    verbatim: |-
      下列汽车库的耐火等级应为一级：
      1 Ⅰ类汽车库，Ⅰ类修车库；
      2 甲、乙类物品运输车的汽车库或修车库；
      3 其他高层汽车库。
    interpret: 耐火等级应为一级的三类汽车库：Ⅰ类汽车库与Ⅰ类修车库；甲、乙类物品运输车的汽车库或修车库；其他高层汽车库。
    severity_hint: error
  - clause_id: GB55037-2022/5.1.6
    chapter: 5.1 一般规定
    verbatim: 电动汽车充电站建筑、Ⅱ类汽车库、Ⅱ类修车库、变电站的耐火等级不应低于二级。
    interpret: 电动汽车充电站建筑、Ⅱ类汽车库、Ⅱ类修车库、变电站，耐火等级不低于二级。
    severity_hint: error
  - clause_id: GB55037-2022/5.1.7
    chapter: 5.1 一般规定
    verbatim: 裙房的耐火等级不应低于高层建筑主体的耐火等级。除可采用木结构的建筑外，其他建筑的耐火等级应符合本章的规定。
    interpret: 裙房的耐火等级不得低于高层建筑主体。除按规定可采用木结构的建筑外，其他建筑的耐火等级都要符合本章规定。
    severity_hint: error
  - clause_id: GB55037-2022/5.2.1
    chapter: 5.2 工业建筑
    verbatim: |-
      下列工业建筑的耐火等级应为一级：
      1 建筑高度大于50m 的高层厂房；
      2 建筑高度大于32m 的高层丙类仓库，储存可燃液体的多层丙类仓库，每个防火分隔间建筑面积大于3000m²的其他多层丙类仓库；
      3 Ⅰ类飞机库。
    interpret: 耐火等级应为一级的三类工业建筑：建筑高度大于50m 的高层厂房；建筑高度大于32m 的高层丙类仓库、储存可燃液体的多层丙类仓库、每个防火分隔间建筑面积大于3000m² 的其他多层丙类仓库；Ⅰ类飞机库。
    severity_hint: error
    keywords:
      - 工业建筑
      - 50m
      - 32m
      - 3000m²
  - clause_id: GB55037-2022/5.2.2
    chapter: 5.2 工业建筑
    verbatim: |-
      除本规范第5.2.1 条规定的建筑外，下列工业建筑的耐火等级不应低于二级：
      1 建筑面积大于300m²的单层甲、乙类厂房；
      2 高架仓库；
      3 Ⅱ、Ⅲ类飞机库；
      4 使用或储存特殊贵重的机器、仪表、仪器等设备或物品的建筑；
      5 高层厂房、高层仓库。
    interpret: 在5.2.1之外，耐火等级不低于二级的五类工业建筑：建筑面积大于300m² 的单层甲、乙类厂房；高架仓库；Ⅱ、Ⅲ类飞机库；使用或储存特殊贵重机器、仪表、仪器等设备或物品的建筑；高层厂房与高层仓库。
    severity_hint: error
    keywords:
      - 工业建筑
      - 300m²
  - clause_id: GB55037-2022/5.2.3
    chapter: 5.2 工业建筑
    verbatim: |-
      除本规范第5.2.1 条和第5.2.2 条规定的建筑外，下列工业建筑的耐火等级不应低于三级：
      1 甲、乙类厂房；
      2 单、多层丙类厂房；
      3 多层丁类厂房；
      4 单、多层丙类仓库；
      5 多层丁类仓库。
    interpret: 在5.2.1、5.2.2之外，耐火等级不低于三级的五类工业建筑：甲、乙类厂房；单、多层丙类厂房；多层丁类厂房；单、多层丙类仓库；多层丁类仓库。
    severity_hint: error
    keywords:
      - 工业建筑
  - clause_id: GB55037-2022/5.2.4
    chapter: 5.2 工业建筑
    verbatim: |-
      丙、丁类物流建筑应符合下列规定：
      1 建筑的耐火等级不应低于二级；
      2 物流作业区域和辅助办公区域应分别设置独立的安全出口或疏散楼梯；
      3 物流作业区域与辅助办公区域之间应采用耐火极限不低于3.00h 的防火隔墙和耐火极限不低于2.00h 的楼板分隔。
    interpret: 丙、丁类物流建筑三条：耐火等级不低于二级；物流作业区与辅助办公区分别设独立的安全出口或疏散楼梯；两区之间用3.00h 防火隔墙加2.00h 楼板分隔。
    severity_hint: error
    keywords:
      - 工业建筑
      - 3.00h
      - 2.00h
  - clause_id: GB55037-2022/5.3.1
    chapter: 5.3 民用建筑
    verbatim: |-
      下列民用建筑的耐火等级应为一级：
      1 一类高层民用建筑；
      2 二层和二层半式、多层式民用机场航站楼；
      3 A 类广播电影电视建筑；
      4 四级生物安全实验室。
    interpret: 耐火等级应为一级的四类民用建筑：一类高层民用建筑；二层、二层半式与多层式民用机场航站楼；A类广播电影电视建筑；四级生物安全实验室。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/5.3.2
    chapter: 5.3 民用建筑
    verbatim: |-
      下列民用建筑的耐火等级不应低于二级：
      1 二类高层民用建筑；
      2 一层和一层半式民用机场航站楼；
      3 总建筑面积大于1500m²的单、多层人员密集场所；
      4 B 类广播电影电视建筑；
      5 一级普通消防站、二级普通消防站、特勤消防站、战勤保障消防站；
      6 设置洁净手术部的建筑，三级生物安全实验室；
      7 用于灾时避难的建筑。
    interpret: 耐火等级不低于二级的七类民用建筑：二类高层民用建筑；一层与一层半式民用机场航站楼；总建筑面积大于1500m² 的单、多层人员密集场所；B类广播电影电视建筑；一级与二级普通消防站、特勤消防站、战勤保障消防站；设置洁净手术部的建筑与三级生物安全实验室；用于灾时避难的建筑。
    severity_hint: error
    keywords:
      - 民用建筑
      - 1500m²
  - clause_id: GB55037-2022/5.3.3
    chapter: 5.3 民用建筑
    verbatim: |-
      除本规范第5.3.1 条、第5.3.2 条规定的建筑外，下列民用建筑的耐火等级不应低于三级：
      1 城市和镇中心区内的民用建筑；
      2 老年人照料设施、教学建筑、医疗建筑。
    interpret: 在5.3.1、5.3.2之外，耐火等级不低于三级的民用建筑：城市和镇中心区内的民用建筑；老年人照料设施、教学建筑、医疗建筑。这一条决定了大量老城区改造项目的下限。
    severity_hint: error
    keywords:
      - 民用建筑
  - clause_id: GB55037-2022/6.1.1
    chapter: 6.1 防火墙
    verbatim: 防火墙应直接设置在建筑的基础或具有相应耐火性能的框架、梁等承重结构上，并应从楼地面基层隔断至结构梁、楼板或屋面板的底面。防火墙与建筑外墙、屋顶相交处，防火墙上的门、窗等开口，应采取防止火灾蔓延至防火墙另一侧的措施。
    interpret: 防火墙要直接落在建筑基础或具有相应耐火性能的框架、梁等承重结构上，并从楼地面基层一直隔断到结构梁、楼板或屋面板的底面。防火墙与外墙、屋顶相交处，以及防火墙上的门窗开口，都要采取防止火灾绕到另一侧的措施。平面图上量的是墙的连续性和开口位置。
    severity_hint: error
    keywords:
      - 防火墙
  - clause_id: GB55037-2022/6.1.2
    chapter: 6.1 防火墙
    verbatim: 防火墙任一侧的建筑结构或构件以及物体受火作用发生破坏或倒塌并作用到防火墙时，防火墙应仍能阻止火灾蔓延至防火墙的另一侧。
    interpret: 防火墙任一侧的建筑结构或构件受火破坏、倒塌并压到防火墙上时，防火墙仍要能阻止火灾蔓延到另一侧。这是防火墙「独立承载」的要求，也是它不能随便依附于可燃或易倒塌结构的原因。
    severity_hint: error
    keywords:
      - 防火墙
  - clause_id: GB55037-2022/6.1.3
    chapter: 6.1 防火墙
    verbatim: 防火墙的耐火极限不应低于3.00h。甲、乙类厂房和甲、乙、丙类仓库内的防火墙，耐火极限不应低于4.00h。
    interpret: 防火墙耐火极限不低于3.00h；甲、乙类厂房和甲、乙、丙类仓库内的防火墙不低于4.00h。
    severity_hint: error
    keywords:
      - 防火墙
      - 3.00h
      - 4.00h
  - clause_id: GB55037-2022/6.2.1
    chapter: 6.2 防火隔墙与幕墙
    verbatim: 防火隔墙应从楼地面基层隔断至梁、楼板或屋面板的底面基层，防火隔墙上的门、窗等开口应采取防止火灾蔓延至防火隔墙另一侧的措施。
    interpret: 防火隔墙同样要从楼地面基层隔断到梁、楼板或屋面板的底面基层；隔墙上的门窗开口要有防止火灾绕行的措施。
    severity_hint: error
    keywords:
      - 防火隔墙与幕墙
  - clause_id: GB55037-2022/6.2.2
    chapter: 6.2 防火隔墙与幕墙
    verbatim: 住宅分户墙、住宅单元之间的墙体、防火隔墙与建筑外墙、楼板、屋顶相交处，应采取防止火灾蔓延至另一侧的防火封堵措施。
    interpret: 住宅分户墙、住宅单元之间的墙体、防火隔墙，与外墙、楼板、屋顶相交处都要做防火封堵，防止火灾从缝隙窜到另一侧。
    severity_hint: error
    keywords:
      - 防火隔墙与幕墙
  - clause_id: GB55037-2022/6.2.3
    chapter: 6.2 防火隔墙与幕墙
    verbatim: 建筑外墙上、下层开口之间应采取防止火灾沿外墙开口蔓延至建筑其他楼层内的措施。在建筑外墙上水平或竖向相邻开口之间用于防止火灾蔓延的墙体、隔板或防火挑檐等实体分隔结构，其耐火性能均不应低于该建筑外墙的耐火性能要求。住宅建筑外墙上相邻套房开口之间的水平距离或防火措施应满足防止火灾通过相邻开口蔓延的要求。
    interpret: 建筑外墙上下层开口之间要有防止火灾沿外墙开口向上蔓延的措施；水平或竖向相邻开口之间用墙体、隔板或防火挑檐等实体分隔时，这些分隔的耐火性能不得低于外墙本身。住宅相邻套房开口之间的水平距离或防火措施，要满足防止火灾通过相邻开口蔓延的要求。
    severity_hint: error
    keywords:
      - 防火隔墙与幕墙
  - clause_id: GB55037-2022/6.2.4
    chapter: 6.2 防火隔墙与幕墙
    verbatim: 建筑幕墙应在每层楼板外沿处采取防止火灾通过幕墙空腔等构造竖向蔓延的措施。
    interpret: 建筑幕墙要在每层楼板外沿处采取防止火灾通过幕墙空腔竖向蔓延的措施（通常是层间防火封堵加不燃托板）。
    severity_hint: error
    keywords:
      - 防火隔墙与幕墙
  - clause_id: GB55037-2022/6.3.1
    chapter: 6.3 竖井、管线防火和防火封堵
    verbatim: 电梯井应独立设置，电梯井内不应敷设或穿过可燃气体或甲、乙、丙类液体管道及与电梯运行无关的电线或电缆等。电梯层门的耐火完整性不应低于2.00h。
    interpret: 电梯井应独立设置；井内不得敷设或穿过可燃气体或甲、乙、丙类液体管道，也不得穿过与电梯运行无关的电线电缆；电梯层门的耐火完整性不低于2.00h。
    severity_hint: error
    keywords:
      - 竖井、管线防火和防火封堵
      - 2.00h
  - clause_id: GB55037-2022/6.3.2
    chapter: 6.3 竖井、管线防火和防火封堵
    verbatim: 电气竖井、管道井、排烟或通风道、垃圾井等竖井应分别独立设置，井壁的耐火极限均不应低于1.00h 。
    interpret: 电气竖井、管道井、排烟或通风道、垃圾井等竖井应分别独立设置，井壁耐火极限均不低于1.00h。
    severity_hint: error
    keywords:
      - 竖井、管线防火和防火封堵
      - 1.00h
  - clause_id: GB55037-2022/6.3.3
    chapter: 6.3 竖井、管线防火和防火封堵
    verbatim: 除通风管道井、送风管道井、排烟管道井、必须通风的燃气管道竖井及其他有特殊要求的竖井可不在层间的楼板处分隔外，其他竖井应在每层楼板处采取防火分隔措施，且防火分隔组件的耐火性能不应低于楼板的耐火性能。
    interpret: 除通风管道井、送风管道井、排烟管道井、必须通风的燃气管道竖井等有特殊要求的竖井外，其他竖井应在每层楼板处做防火分隔，且分隔组件的耐火性能不低于楼板。
    severity_hint: error
    keywords:
      - 竖井、管线防火和防火封堵
  - clause_id: GB55037-2022/6.3.4
    chapter: 6.3 竖井、管线防火和防火封堵
    verbatim: 电气线路和各类管道穿过防火墙、防火隔墙、竖井井壁、建筑变形缝处和楼板处的孔隙应采取防火封堵措施。防火封堵组件的耐火性能不应低于防火分隔部位的耐火性能要求。
    interpret: 电气线路和各类管道穿过防火墙、防火隔墙、竖井井壁、建筑变形缝和楼板处的孔隙，都要做防火封堵，封堵组件的耐火性能不低于被穿越的分隔部位。
    severity_hint: error
    keywords:
      - 竖井、管线防火和防火封堵
  - clause_id: GB55037-2022/6.3.5
    chapter: 6.3 竖井、管线防火和防火封堵
    verbatim: 通风和空气调节系统的管道、防烟与排烟系统的管道穿过防火墙、防火隔墙、楼板、建筑变形缝处，建筑内未按防火分区独立设置的通风和空气调节系统中的竖向风管与每层水平风管交接的水平管段处，均应采取防止火灾通过管道蔓延至其他防火分隔区域的措施。
    interpret: 通风空调管道、防烟排烟管道穿过防火墙、防火隔墙、楼板、变形缝时，以及未按防火分区独立设置的通风空调系统中竖向风管与每层水平风管的交接处，都要采取防止火灾沿管道蔓延的措施。
    severity_hint: error
    keywords:
      - 竖井、管线防火和防火封堵
  - clause_id: GB55037-2022/6.4.1
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: 防火门、防火窗应具有自动关闭的功能，在关闭后应具有烟密闭的性能。宿舍的居室、老年人照料设施的老年人居室、旅馆建筑的客房开向公共内走廊或封闭式外走廊的疏散门，应在关闭后具有烟密闭的性能。宿舍的居室、旅馆建筑的客房的疏散门，应具有自动关闭的功能。
    interpret: 防火门、防火窗应能自动关闭，关闭后应烟密闭。宿舍居室、老年人照料设施居室、旅馆客房开向公共内走廊或封闭外走廊的疏散门，关闭后要烟密闭；宿舍居室和旅馆客房的疏散门还要能自动关闭。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
  - clause_id: GB55037-2022/6.4.2
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: |-
      下列部位的门应为甲级防火门：
      1 设置在防火墙上的门、疏散走道在防火分区处设置的门；
      2 设置在耐火极限要求不低于3.00h 的防火隔墙上的门；
      3 电梯间、疏散楼梯间与汽车库连通的门；
      4 室内开向避难走道前室的门、避难间的疏散门；
      5 多层乙类仓库和地下、半地下及多、高层丙类仓库中从库房通向疏散走道或疏散楼梯间的门。
    interpret: 应为甲级防火门的五个部位：防火墙上设置的门、疏散走道在防火分区处设置的门；耐火极限要求不低于3.00h 的防火隔墙上的门；电梯间、疏散楼梯间与汽车库连通的门；室内开向避难走道前室的门、避难间的疏散门；多层乙类仓库和地下、半地下及多、高层丙类仓库中从库房通向疏散走道或疏散楼梯间的门。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
      - 3.00h
  - clause_id: GB55037-2022/6.4.3
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: |-
      除建筑直通室外和屋面的门可采用普通门外，下列部位的门的耐火性能不应低于乙级防火门的要求，且其中建筑高度大于100m 的建筑相应部位的门应为甲级防火门：
      1 甲、乙类厂房，多层丙类厂房，人员密集的公共建筑和其他高层工业与民用建筑中封闭楼梯间的门；
      2 防烟楼梯间及其前室的门；
      3 消防电梯前室或合用前室的门；
      4 前室开向避难走道的门；
      5 地下、半地下及多、高层丁类仓库中从库房通向疏散走道或疏散楼梯的门；
      6 歌舞娱乐放映游艺场所中的房间疏散门；
      7 从室内通向室外疏散楼梯的疏散门；
      8 设置在耐火极限要求不低于2.00h 的防火隔墙上的门。
    interpret: 应不低于乙级防火门的八个部位：甲乙类厂房、多层丙类厂房、人员密集公共建筑和其他高层工业与民用建筑中封闭楼梯间的门；防烟楼梯间及其前室的门；消防电梯前室或合用前室的门；前室开向避难走道的门；地下、半地下及多、高层丁类仓库中库房通向疏散走道或楼梯间的门；歌舞娱乐放映游艺场所的房间疏散门；室内通向室外疏散楼梯的疏散门；耐火极限要求不低于2.00h 的防火隔墙上的门。建筑高度大于100m 的建筑，上述部位应升为甲级。建筑直通室外和屋面的门可用普通门。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
      - 100m
      - 2.00h
  - clause_id: GB55037-2022/6.4.4
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: |-
      电气竖井、管道井、排烟道、排气道、垃圾道等竖井井壁上的检查门，应符合下列规定：
      1 对于埋深大于10m 的地下建筑或地下工程，应为甲级防火门；
      2 对于建筑高度大于100m 的建筑，应为甲级防火门；
      3 对于层间无防火分隔的竖井和住宅建筑的合用前室，门的耐火性能不应低于乙级防火门的要求；
      4 对于其他建筑，门的耐火性能不应低于丙级防火门的要求，当竖井在楼层处无水平防火分隔时，门的耐火性能不应低于乙级防火门的要求。
    interpret: 竖井井壁检查门的等级按四种情况定：埋深大于10m 的地下建筑或地下工程、建筑高度大于100m 的建筑，为甲级防火门；层间无防火分隔的竖井和住宅建筑的合用前室，不低于乙级；其他建筑不低于丙级，但当竖井在楼层处无水平防火分隔时升为乙级。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
      - 10m
      - 100m
  - clause_id: GB55037-2022/6.4.5
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: 平时使用的人民防空工程中代替甲级防火门的防护门、防护密闭门、密闭门，耐火性能不应低于甲级防火门的要求，且不应用于平时使用的公共场所的疏散出口处。
    interpret: 平时使用的人民防空工程中，用防护门、防护密闭门、密闭门代替甲级防火门时，耐火性能不得低于甲级，且不得用于平时使用公共场所的疏散出口。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
  - clause_id: GB55037-2022/6.4.6
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: 设置在防火墙和要求耐火极限不低于3.00h 的防火隔墙上的窗应为甲级防火窗。
    interpret: 设置在防火墙上、以及耐火极限要求不低于3.00h 的防火隔墙上的窗，应为甲级防火窗。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
      - 3.00h
  - clause_id: GB55037-2022/6.4.7
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: |-
      下列部位的窗的耐火性能不应低于乙级防火窗的要求：
      1 歌舞娱乐放映游艺场所中房间开向走道的窗；
      2 设置在避难间或避难层中避难区对应外墙上的窗；
      3 其他要求耐火极限不低于2.00h 的防火隔墙上的窗。
    interpret: 应不低于乙级防火窗的三个部位：歌舞娱乐放映游艺场所中房间开向走道的窗；避难间或避难层中避难区对应外墙上的窗；其他要求耐火极限不低于2.00h 的防火隔墙上的窗。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
      - 2.00h
  - clause_id: GB55037-2022/6.4.8
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: |-
      用于防火分隔的防火卷帘应符合下列规定：
      1 应具有在火灾时不需要依靠电源等外部动力源而依靠自重自行关闭的功能；
      2 耐火性能不应低于防火分隔部位的耐火性能要求；
      3 应在关闭后具有烟密闭的性能；
      4 在同一防火分隔区域的界限处采用多樘防火卷帘分隔时，应具有同步降落封闭开口的功能。
    interpret: 用于防火分隔的防火卷帘四条：火灾时不依赖电源等外部动力，靠自重自行关闭；耐火性能不低于所在分隔部位；关闭后烟密闭；同一防火分隔区域界限处用多樘卷帘时，要能同步降落封闭开口。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
  - clause_id: GB55037-2022/6.4.9
    chapter: 6.4 防火门、防火窗、防火卷帘和防火玻璃墙
    verbatim: 用于防火分隔的防火玻璃墙，耐火性能不应低于所在防火分隔部位的耐火性能要求。
    interpret: 用于防火分隔的防火玻璃墙，耐火性能不得低于所在防火分隔部位。这一条常被用来卡「用玻璃墙代替防火墙」的做法。
    severity_hint: error
    keywords:
      - 防火门、防火窗、防火卷帘和防火玻璃墙
  - clause_id: GB55037-2022/6.5.1
    chapter: 6.5 建筑的内部和外部装修
    verbatim: 建筑内部装修不应擅自减少、改动、拆除、遮挡消防设施或器材及其标识、疏散指示标志、疏散出口、疏散走道或疏散横通道，不应擅自改变防火分区或防火分隔、防烟分区及其分隔，不应影响消防设施或器材的使用功能和正常操作。
    interpret: 内部装修不得擅自减少、改动、拆除或遮挡消防设施器材及其标识、疏散指示标志、疏散出口、疏散走道或疏散横通道；不得擅自改变防火分区、防火分隔、防烟分区及其分隔；不得影响消防设施的使用功能与正常操作。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.5.2
    chapter: 6.5 建筑的内部和外部装修
    verbatim: |-
      下列部位不应使用影响人员安全疏散和消防救援的镜面反光材料：
      1 疏散出口的门；
      2 疏散走道及其尽端、疏散楼梯间及其前室的顶棚、墙面和地面；
      3 供消防救援人员进出建筑的出入口的门、窗；
      4 消防专用通道、消防电梯前室或合用前室的顶棚、墙面和地面。
    interpret: 四类部位不得使用影响安全疏散和消防救援的镜面反光材料：疏散出口的门；疏散走道及其尽端、疏散楼梯间及其前室的顶棚墙面地面；供消防救援人员进出建筑的出入口门窗；消防专用通道、消防电梯前室或合用前室的顶棚墙面地面。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.5.3
    chapter: 6.5 建筑的内部和外部装修
    verbatim: |-
      下列部位的顶棚、墙面和地面内部装修材料的燃烧性能均应为A 级:
      1 避难走道、避难层、避难间；
      2 疏散楼梯间及其前室；
      3 消防电梯前室或合用前室。
    interpret: 三处部位的顶棚、墙面、地面装修材料燃烧性能均应为A级：避难走道、避难层、避难间；疏散楼梯间及其前室；消防电梯前室或合用前室。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.5.4
    chapter: 6.5 建筑的内部和外部装修
    verbatim: |-
      消防控制室地面装修材料的燃烧性能不应低于B1级，顶棚和墙面内部装修材料的燃烧性能均应为A 级。下列设备用房的顶棚、墙面和地面内部装修材料的燃烧性能均应为A 级：
      1 消防水泵房、机械加压送风机房、排烟机房、固定灭火系统钢瓶间等消防设备间；
      2 配电室、油浸变压器室、发电机房、储油间；
      3 通风和空气调节机房；
      4 锅炉房。
    interpret: 消防控制室地面装修不低于B1级，顶棚和墙面为A级。四类设备用房的顶棚、墙面、地面全部A级：消防水泵房、机械加压送风机房、排烟机房、固定灭火系统钢瓶间等消防设备间；配电室、油浸变压器室、发电机房、储油间；通风空调机房；锅炉房。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.5.5
    chapter: 6.5 建筑的内部和外部装修
    verbatim: |-
      歌舞娱乐放映游艺场所内部装修材料的燃烧性能应符合下列规定：
      1 顶棚装修材料的燃烧性能应为A 级；
      2 其他部位装修材料的燃烧性能均不应低于B1级；
      3 设置在地下或半地下的歌舞娱乐放映游艺场所，墙面装修材料的燃烧性能应为A 级。
    interpret: 歌舞娱乐放映游艺场所装修：顶棚A级；其他部位不低于B1级；设在地下或半地下时，墙面也应为A级。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.5.6
    chapter: 6.5 建筑的内部和外部装修
    verbatim: |-
      下列场所设置在地下或半地下时，室内装修材料不应使用易燃材料、石棉制品、玻璃纤维、塑料类制品，顶棚、墙面、地面的内部装修材料的燃烧性能均应为A 级：
      1 汽车客运站、港口客运站、铁路车站的进出站通道、进出站厅、候乘厅；
      2 地铁车站、民用机场航站楼、城市民航值机厅的公共区；
      3 交通换乘厅、换乘通道。
    interpret: 设在地下或半地下的客运站进出站通道与候乘厅、地铁车站与机场航站楼及城市民航值机厅的公共区、交通换乘厅与换乘通道，装修不得使用易燃材料、石棉制品、玻璃纤维、塑料类制品，顶棚墙面地面均应为A级。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.5.7
    chapter: 6.5 建筑的内部和外部装修
    verbatim: |-
      除有特殊要求的场所外，下列生产场所和仓库的顶棚、墙面、地面和隔断内部装修材料的燃烧性能均应为A 级：
      1 有明火或高温作业的生产场所；
      2 甲、乙类生产场所；
      3 甲、乙类仓库；
      4 丙类高架仓库、丙类高层仓库；
      5 地下或半地下丙类仓库。
    interpret: 五类生产场所和仓库的顶棚、墙面、地面、隔断装修均应为A级：有明火或高温作业的生产场所；甲、乙类生产场所；甲、乙类仓库；丙类高架仓库和丙类高层仓库；地下或半地下丙类仓库。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.5.8
    chapter: 6.5 建筑的内部和外部装修
    verbatim: 建筑的外部装修和户外广告牌的设置，应满足防止火灾通过建筑外立面蔓延的要求，不应妨碍建筑的消防救援或火灾时建筑的排烟与排热，不应遮挡或减小消防救援口。
    interpret: 建筑外部装修和户外广告牌：要满足防止火灾沿外立面蔓延；不得妨碍消防救援或火灾时的排烟排热；不得遮挡或减小消防救援口。
    severity_hint: error
    keywords:
      - 建筑的内部和外部装修
  - clause_id: GB55037-2022/6.6.1
    chapter: 6.6 建筑保温
    verbatim: 建筑的外保温系统不应采用燃烧性能低于B2级的保温材料或制品。当采用B1级或B2级燃烧性能的保温材料或制品时，应采取防止火灾通过保温系统在建筑的立面或屋面蔓延的措施或构造。
    interpret: 建筑外保温系统不得使用燃烧性能低于B2级的材料或制品；采用B1或B2级时，要采取防止火灾沿保温系统在立面或屋面蔓延的措施或构造。
    severity_hint: error
    keywords:
      - 建筑保温
  - clause_id: GB55037-2022/6.6.2
    chapter: 6.6 建筑保温
    verbatim: 建筑的外围护结构采用保温材料与两侧不燃性结构构成无空腔复合保温结构体时，该复合保温结构体的耐火极限不应低于所在外围护结构的耐火性能要求。当保温材料的燃烧性能为B1级或B2级时，保温材料两侧不燃性结构的厚度均不应小于50mm。
    interpret: 外围护结构用保温材料与两侧不燃结构构成无空腔复合保温结构体时，该结构体的耐火极限不低于所在外围护结构；保温材料为B1或B2级时，两侧不燃结构厚度均不小于50mm。
    severity_hint: error
    keywords:
      - 建筑保温
      - 50mm
  - clause_id: GB55037-2022/6.6.3
    chapter: 6.6 建筑保温
    verbatim: 飞机库的外围护结构、内部隔墙和屋面保温隔热层，均应采用燃烧性能为A 级的材料，飞机库大门及采光材料的燃烧性能均不应低于B1级。
    interpret: 飞机库的外围护结构、内部隔墙、屋面保温隔热层均应为A级材料；飞机库大门和采光材料不低于B1级。
    severity_hint: error
    keywords:
      - 建筑保温
  - clause_id: GB55037-2022/6.6.4
    chapter: 6.6 建筑保温
    verbatim: |-
      除本规范第6.6.2 条规定的情况外，下列老年人照料设施的内、外保温系统和屋面保温系统均应采用燃烧性能为A 级的保温材料或制品：
      1 独立建造的老年人照料设施；
      2 与其他功能的建筑组合建造且老年人照料设施部分的总建筑面积大于500m2的老年人照料设施。
    interpret: 两类老年人照料设施的内外保温系统与屋面保温系统均应为A级：独立建造的；与其他功能组合建造、且老年人照料设施部分总建筑面积大于500m² 的。
    severity_hint: error
    keywords:
      - 建筑保温
      - 500m2
  - clause_id: GB55037-2022/6.6.5
    chapter: 6.6 建筑保温
    verbatim: |-
      除本规范第6.6.2 条规定的情况外，下列建筑或场所的外墙外保温材料的燃烧性能应为A 级：
      1 人员密集场所；
      2 设置人员密集场所的建筑。
    interpret: 人员密集场所、以及设置人员密集场所的建筑，其外墙外保温材料燃烧性能应为A级。
    severity_hint: error
    keywords:
      - 建筑保温
      - 1人
  - clause_id: GB55037-2022/6.6.6
    chapter: 6.6 建筑保温
    verbatim: |-
      除本规范第6.6.2 条规定的情况外，住宅建筑采用与基层墙体、装饰层之间无空腔的外墙外保温系统时，保温材料或制品的燃烧性能应符合下列规定：
      1 建筑高度大于100m 时，应为A 级；
      2 建筑高度大于27m、不大于100m 时，不应低于B1级。
    interpret: 住宅建筑采用无空腔外墙外保温系统时：建筑高度大于100m 为A级；大于27m 且不大于100m 不低于B1级。
    severity_hint: error
    keywords:
      - 建筑保温
      - 100m
      - 27m
  - clause_id: GB55037-2022/6.6.7
    chapter: 6.6 建筑保温
    verbatim: |-
      除本规范第6.6.3 条~第6.6.6 条规定的建筑外，其他建筑采用与基层墙体、装饰层之间无空腔的外墙外保温系统时，保温材料或制品的燃烧性能应符合下列规定：
      1 建筑高度大于50m 时，应为A 级；
      2 建筑高度大于24m、不大于50m 时，不应低于B1级。
    interpret: 除6.6.3～6.6.6规定之外的其他建筑，无空腔外墙外保温：建筑高度大于50m 为A级；大于24m 且不大于50m 不低于B1级。
    severity_hint: error
    keywords:
      - 建筑保温
      - 50m
      - 24m
  - clause_id: GB55037-2022/6.6.8
    chapter: 6.6 建筑保温
    verbatim: |-
      除本规范第6.6.3 条~第6.6.5 条规定的建筑外，其他建筑采用与基层墙体、装饰层之间有空腔的外墙外保温系统时，保温系统应符合下列规定：
      1 建筑高度大于24m 时，保温材料或制品的燃烧性能应为A 级；
      2 建筑高度不大于24m 时，保温材料或制品的燃烧性能不应低于B1级；
      3 外墙外保温系统与基层墙体、装饰层之间的空腔，应在每层楼板处采取防火分隔与封堵措施。
    interpret: 其他建筑采用有空腔外墙外保温系统时：建筑高度大于24m 为A级；不大于24m 不低于B1级；空腔应在每层楼板处做防火分隔与封堵。
    severity_hint: error
    keywords:
      - 建筑保温
      - 24m
  - clause_id: GB55037-2022/6.6.9
    chapter: 6.6 建筑保温
    verbatim: |-
      下列场所或部位内保温系统中保温材料或制品的燃烧性能应为A 级：
      1 人员密集场所；
      2 使用明火、燃油、燃气等有火灾危险的场所；
      3 疏散楼梯间及其前室；
      4 避难走道、避难层、避难间；
      5 消防电梯前室或合用前室。
    interpret: 五处部位的内保温材料应为A级：人员密集场所；使用明火、燃油、燃气等有火灾危险的场所；疏散楼梯间及其前室；避难走道、避难层、避难间；消防电梯前室或合用前室。
    severity_hint: error
    keywords:
      - 建筑保温
      - 1人
  - clause_id: GB55037-2022/6.6.10
    chapter: 6.6 建筑保温
    verbatim: 除本规范第6.6.3 条和第6.6.9 条规定的场所或部位外，其他场所或部位内保温系统中保温材料或制品的燃烧性能均不应低于B1级。当采用B1级燃烧性能的保温材料时，保温系统的外表面应采取使用不燃材料设置防护层等防火措施。
    interpret: 除6.6.3和6.6.9规定的部位外，其他部位内保温材料不低于B1级；采用B1级时，保温系统外表面要设不燃材料防护层等防火措施。
    severity_hint: error
    keywords:
      - 建筑保温
  - clause_id: GB55037-2022/7.1.1
    chapter: 7.1 一般规定
    verbatim: 建筑的疏散出口数量、位置和宽度，疏散楼梯（间）的形式和宽度，避难设施的位置和面积等，应与建筑的使用功能、火灾危险性、耐火等级、建筑高度或层数、埋深、建筑面积、人员密度、人员特性等相适应。
    interpret: 原则条：疏散出口的数量、位置、宽度，疏散楼梯（间）的形式与宽度，避难设施的位置与面积，都要与使用功能、火灾危险性、耐火等级、建筑高度或层数、埋深、建筑面积、人员密度、人员特性相适应。第7章后面所有具体数字都由这条派生。
    severity_hint: error
  - clause_id: GB55037-2022/7.1.2
    chapter: 7.1 一般规定
    verbatim: |-
      建筑中的疏散出口应分散布置，房间疏散门应直接通向安全出口，不应经过其他房间。疏散出口的宽度和数量应满足人员安全疏散的要求。各层疏散楼梯的净宽度应符合下列规定：
      1 对于建筑的地上楼层，各层疏散楼梯的净宽度均不应小于其上部各层中要求疏散净宽度的最大值；
      2 对于建筑的地下楼层或地下建筑、平时使用的人民防空工程，各层疏散楼梯的净宽度均不应小于其下部各层中要求疏散净宽度的最大值。
    interpret: 两条要求：①疏散出口要分散布置——两个出口不能挨在一起，否则等于一个；房间疏散门要直接通向安全出口，不得穿别的房间；②各层疏散楼梯净宽，地上楼层不得小于其上部各层要求值的最大者，地下楼层不得小于其下部各层要求值的最大者。也就是说下面楼层的楼梯不能比上面窄，因为人流是往下汇的。
    severity_hint: error
    machine:
      checkable: partial
      note: >-
        「房间疏散门应直接通向安全出口」可以间接判：检查外轮廓上有没有门洞。
        判得了「有没有」，判不了「通到哪」——室外还是公共楼梯间，图上看不出来。
  - clause_id: GB55037-2022/7.1.3
    chapter: 7.1 一般规定
    verbatim: |-
      建筑中的最大疏散距离应根据建筑的耐火等级、火灾危险性、空间高度、疏散楼梯（间）的形式和使用人员的特点等因素确定，并应符合下列规定：
      1 疏散距离应满足人员安全疏散的要求；
      2 房间内任一点至房间疏散门的疏散距离，不应大于建筑中位于袋形走道两侧或尽端房间的疏散门至最近安全出口的最大允许疏散距离。
    interpret: 最大疏散距离按耐火等级、火灾危险性、空间高度、楼梯形式、人员特点综合确定。最实用的是第2款：房间内任一点到房间疏散门的距离，不得大于「袋形走道两侧或尽端房间的疏散门到最近安全出口」的最大允许距离。这一句把房间内部的行走距离和走道距离绑在一起，是平面图上量疏散的核心依据。
    severity_hint: error
  - clause_id: GB55037-2022/7.1.4
    chapter: 7.1 一般规定
    verbatim: |-
      疏散出口门、疏散走道、疏散楼梯等的净宽度应符合下列规定：
      1 疏散出口门、室外疏散楼梯的净宽度均不应小于0.80m；
      2 住宅建筑中直通室外地面的住宅户门的净宽度不应小于0.80m，当住宅建筑高度不大于18m 且一边设置栏杆时，室内疏散楼梯的净宽度不应小于1.0m，其他住宅建筑室内疏散楼梯的净宽度不应小于1.1m；
      3 疏散走道、首层疏散外门、公共建筑中的室内疏散楼梯的净宽度均不应小于1.1m；
      4 净宽度大于4.0m 的疏散楼梯、室内疏散台阶或坡道，应设置扶手栏杆分隔为宽度均不大于2.0m 的区段。
    interpret: 净宽要求：疏散出口门、室外疏散楼梯不小于0.80m；住宅直通室外的户门不小于0.80m，高度不大于18m 且一边设栏杆时室内楼梯不小于1.0m，其他住宅室内楼梯不小于1.1m；疏散走道、首层疏散外门、公共建筑室内疏散楼梯不小于1.1m。净宽大于4.0m 的疏散楼梯、室内疏散台阶或坡道，要用扶手栏杆分隔成宽度均不大于2.0m 的区段。
    severity_hint: error
    keywords:
      - 0.80m
      - 18m
      - 1.0m
      - 1.1m
      - 4.0m
      - 2.0m
  - clause_id: GB55037-2022/7.1.5
    chapter: 7.1 一般规定
    verbatim: 在疏散通道、疏散走道、疏散出口处，不应有任何影响人员疏散的物体，并应在疏散通道、疏散走道、疏散出口的明显位置设置明显的指示标志。疏散通道、疏散走道、疏散出口的净高度均不应小于2.1m。疏散走道在防火分区分隔处应设置疏散门。
    interpret: 疏散通道、疏散走道、疏散出口处不得有任何影响人员疏散的物体，并在明显位置设指示标志；三者的净高度均不小于2.1m；疏散走道在防火分区分隔处应设疏散门。
    severity_hint: error
    keywords:
      - 2.1m
  - clause_id: GB55037-2022/7.1.6
    chapter: 7.1 一般规定
    verbatim: |-
      除设置在丙、丁、戊类仓库首层靠墙外侧的推拉门或卷帘门可用于疏散门外，疏散出口门应为平开门或在火灾时具有平开功能的门，且下列场所或部位的疏散出口门应向疏散方向开启：
      1 甲、乙类生产场所；
      2 甲、乙类物质的储存场所；
      3 平时使用的人民防空工程中的公共场所；
      4 其他建筑中使用人数大于60 人的房间或每樘门的平均疏散人数大于30人的房间；
      5 疏散楼梯间及其前室的门；
      6 室内通向室外疏散楼梯的门。
    interpret: 疏散出口门应为平开门，或火灾时具有平开功能的门；丙、丁、戊类仓库首层靠墙外侧的推拉门或卷帘门可作为疏散门。六类场所的门必须向疏散方向开启：甲、乙类生产场所；甲、乙类物质储存场所；平时使用的人防工程中的公共场所；使用人数大于60人或每樘门平均疏散人数大于30人的房间；疏散楼梯间及其前室的门；室内通向室外疏散楼梯的门。
    severity_hint: error
    keywords:
      - 60人
      - 30人
  - clause_id: GB55037-2022/7.1.7
    chapter: 7.1 一般规定
    verbatim: 疏散出口门应能在关闭后从任何一侧手动开启。开向疏散楼梯（间）或疏散走道的门在完全开启时，不应减少楼梯平台或疏散走道的有效净宽度。除住宅的户门可不受限制外，建筑中控制人员出入的闸口和设置门禁系统的疏散出口门应具有在火灾时自动释放的功能，且人员不需使用任何工具即能容易地从内部打开，在门内一侧的显著位置应设置明显的标识。
    interpret: 疏散出口门关闭后要能从任何一侧手动开启；开向疏散楼梯或疏散走道的门完全开启时不得减少楼梯平台或走道的有效净宽。除住宅户门外，控制人员出入的闸口和设门禁的疏散出口门要有火灾时自动释放功能，人员不用任何工具就能从内部打开，门内显著位置设标识。
    severity_hint: error
  - clause_id: GB55037-2022/7.1.8
    chapter: 7.1 一般规定
    verbatim: |-
      室内疏散楼梯间应符合下列规定：
      1 疏散楼梯间内不应设置烧水间、可燃材料储藏室、垃圾道及其他影响人员疏散的凸出物或障碍物。
      2 疏散楼梯间内不应设置或穿过甲、乙、丙类液体管道。
      3 在住宅建筑的疏散楼梯间内设置可燃气体管道和可燃气体计量表时，应采用敞开楼梯间，并应采取防止燃气泄漏的防护措施；其他建筑的疏散楼梯间及其前室内不应设置可燃或助燃气体管道。
      4 疏散楼梯间及其前室与其他部位的防火分隔不应使用卷帘。
      5 除疏散楼梯间及其前室的出入口、外窗和送风口，住宅建筑疏散楼梯间前室或合用前室内的管道井检查门外，疏散楼梯间及其前室或合用前室内的墙上不应设置其他门、窗等开口。
      6 自然通风条件不符合防烟要求的封闭楼梯间，应采取机械加压防烟措施或采用防烟楼梯间。
      7 防烟楼梯间前室的使用面积，公共建筑、高层厂房、高层仓库、平时使用的人民防空工程及其他地下工程，不应小于6.0m2；住宅建筑，不应小于4.5m2。与消防电梯前室合用的前室的使用面积，公共建筑、高层厂房、高层仓库、平时使用的人民防空工程及其他地下工程，不应小于10.0m2；住宅建筑，不应小于6.0m2。
      8 疏散楼梯间及其前室上的开口与建筑外墙上的其他相邻开口最近边缘之间的水平距离不应小于1.0m。当距离不符合要求时，应采取防止火势通过相邻开口蔓延的措施。
    interpret: 室内疏散楼梯间八条：①不得设烧水间、可燃材料储藏室、垃圾道及其他凸出物障碍物；②不得设置或穿过甲、乙、丙类液体管道；③住宅楼梯间内设可燃气体管道和计量表时应用敞开楼梯间并采取防泄漏措施，其他建筑的楼梯间及前室不得设可燃或助燃气体管道；④楼梯间及其前室与其他部位的防火分隔不得用卷帘；⑤除出入口、外窗、送风口，以及住宅前室或合用前室的管道井检查门外，墙上不得设其他开口；⑥自然通风不满足防烟要求的封闭楼梯间要机械加压或改成防烟楼梯间；⑦前室使用面积：公共建筑、高层厂房、高层仓库、人防及其他地下工程不小于6.0m²，住宅不小于4.5m²；合用前室：前述公建类不小于10.0m²，住宅不小于6.0m²；⑧楼梯间及前室的开口与外墙其他相邻开口最近边缘的水平距离不小于1.0m，不够时要有防蔓延措施。第⑦项是平面图上最常量的。
    severity_hint: error
    keywords:
      - 6.0m2
      - 4.5m2
      - 10.0m2
      - 1.0m
  - clause_id: GB55037-2022/7.1.9
    chapter: 7.1 一般规定
    verbatim: 通向避难层的疏散楼梯应使人员在避难层处必须经过避难区上下。除通向避难层的疏散楼梯外，疏散楼梯（间）在各层的平面位置不应改变或应能使人员的疏散路线保持连续。
    interpret: 通向避难层的疏散楼梯，要让人员在避难层处必须经过避难区上下——不能让人绕过避难区直接下行。除通向避难层的楼梯外，疏散楼梯在各层的平面位置不应改变，或至少保证疏散路线连续。
    severity_hint: error
  - clause_id: GB55037-2022/7.1.10
    chapter: 7.1 一般规定
    verbatim: |-
      除住宅建筑套内的自用楼梯外，建筑的地下或半地下室、平时使用的人民防空工程、其他地下工程的疏散楼梯间应符合下列规定：
      1 当埋深不大于10m 或层数不大于2 层时，应为封闭楼梯间；
      2 当埋深大于10m 或层数不小于3 层时，应为防烟楼梯间；
      3 地下楼层的疏散楼梯间与地上楼层的疏散楼梯间，应在直通室外地面的楼层采用耐火极限不低于2.00h 且无开口的防火隔墙分隔；
      4 在楼梯的各楼层入口处均应设置明显的标识。
    interpret: 地下、半地下室与地下工程的疏散楼梯间：埋深不大于10m 或层数不大于2 层时为封闭楼梯间；埋深大于10m 或层数不小于3 层时为防烟楼梯间；地下层与地上层的楼梯间，要在直通室外地面的楼层用2.00h 且无开口的防火隔墙分隔；各楼层入口处设明显标识。住宅套内自用楼梯不适用本条。
    severity_hint: error
    keywords:
      - 10m
      - 2层
      - 3层
      - 2.00h
  - clause_id: GB55037-2022/7.1.11
    chapter: 7.1 一般规定
    verbatim: |-
      室外疏散楼梯应符合下列规定：
      1 室外疏散楼梯的栏杆扶手高度不应小于1.10m，倾斜角度不应大于45°；
      2 除3 层及3 层以下建筑的室外疏散楼梯可采用难燃性材料或木结构外，室外疏散楼梯的梯段和平台均应采用不燃材料；
      3 除疏散门外，楼梯周围2.0m 内的墙面上不应设置其他开口，疏散门不应正对梯段。
    interpret: 室外疏散楼梯：栏杆扶手高度不小于1.10m，倾斜角度不大于45°；除3层及3层以下建筑可用难燃材料或木结构外，梯段和平台均用不燃材料；除疏散门外，楼梯周围2.0m 内的墙面不得设其他开口，疏散门不得正对梯段。
    severity_hint: error
    keywords:
      - 1.10m
      - 3层
      - 2.0m
  - clause_id: GB55037-2022/7.1.12
    chapter: 7.1 一般规定
    verbatim: |-
      火灾时用于辅助人员疏散的电梯及其设置应符合下列规定：
      1 应具有在火灾时仅停靠特定楼层和首层的功能；
      2 电梯附近的明显位置应设置标示电梯用途的标志和操作说明；
      3 其他要求应符合本规范有关消防电梯的规定。
    interpret: 火灾时辅助人员疏散的电梯：应具备火灾时仅停靠特定楼层和首层的功能；电梯附近明显位置设用途标志和操作说明；其他要求按消防电梯执行。
    severity_hint: error
  - clause_id: GB55037-2022/7.1.13
    chapter: 7.1 一般规定
    verbatim: 设置在消防电梯或疏散楼梯间前室内的非消防电梯，防火性能不应低于消防电梯的防火性能。
    interpret: 设在消防电梯或疏散楼梯间前室内的非消防电梯，防火性能不得低于消防电梯。这条常被用来卡「前室里塞了一部普通客梯」的做法。
    severity_hint: error
  - clause_id: GB55037-2022/7.1.14
    chapter: 7.1 一般规定
    verbatim: 建筑高度大于100m 的工业与民用建筑应设置避难层，且第一个避难层的楼面至消防车登高操作场地地面的高度不应大于50m。
    interpret: 建筑高度大于100m 的工业与民用建筑应设避难层，且第一个避难层的楼面至消防车登高操作场地地面的高度不大于50m。
    severity_hint: error
    keywords:
      - 100m
      - 50m
  - clause_id: GB55037-2022/7.1.15
    chapter: 7.1 一般规定
    verbatim: |-
      避难层应符合下列规定：
      1 避难区的净面积应满足该避难层与上一避难层之间所有楼层的全部使用人数避难的要求。
      2 除可布置设备用房外，避难层不应用于其他用途。设置在避难层内的可燃液体管道、可燃或助燃气体管道应集中布置，设备管道区应采用耐火极限不低于3.00h 的防火隔墙与避难区及其他公共区分隔。管道井和设备间应采用耐火极限不低于2.00h 的防火隔墙与避难区及其他公共区分隔。设备管道区、管道井和设备间与避难区或疏散走道连通时，应设置防火隔间，防火隔间的门应为甲级防火门。
      3 避难层应设置消防电梯出口、消火栓、消防软管卷盘、灭火器、消防专线电话和应急广播。
      4 在避难层进入楼梯间的入口处和疏散楼梯通向避难层的出口处，均应在明显位置设置标示避难层和楼层位置的灯光指示标识。
      5 避难区应采取防止火灾烟气进入或积聚的措施，并应设置可开启外窗。
      6 避难区应至少有一边水平投影位于同一侧的消防车登高操作场地范围内。
    interpret: 避难层六条：①避难区净面积要满足该层与上一避难层之间所有楼层全部使用人数避难；②除设备用房外不得挪作他用，层内可燃液体管道、可燃或助燃气体管道集中布置，设备管道区用3.00h 防火隔墙与避难区及其他公共区分隔，管道井与设备间用2.00h 隔墙分隔，连通处设防火隔间且门为甲级；③设消防电梯出口、消火栓、消防软管卷盘、灭火器、消防专线电话和应急广播；④进入楼梯间的入口处与楼梯通向避难层的出口处设灯光指示标识；⑤避难区要防烟气进入积聚，并设可开启外窗；⑥避难区至少有一边水平投影落在同一侧的消防车登高操作场地范围内。
    severity_hint: error
    keywords:
      - 3.00h
      - 2.00h
  - clause_id: GB55037-2022/7.1.16
    chapter: 7.1 一般规定
    verbatim: |-
      避难间应符合下列规定：
      1 避难区的净面积应满足避难间所在区域设计避难人数避难的要求；
      2 避难间兼作其他用途时，应采取保证人员安全避难的措施；
      3 避难间应靠近疏散楼梯间，不应在可燃物库房、锅炉房、发电机房、变配电站等火灾危险性大的场所的正下方、正上方或贴邻；
      4 避难间应采用耐火极限不低于2.00h 的防火隔墙和甲级防火门与其他部位分隔；
      5 避难间应采取防止火灾烟气进入或积聚的措施，并应设置可开启外窗，除外窗和疏散门外，避难间不应设置其他开口；
      6 避难间内不应敷设或穿过输送可燃液体、可燃或助燃气体的管道；
      7 避难间内应设置消防软管卷盘、灭火器、消防专线电话和应急广播；
      8 在避难间入口处的明显位置应设置标示避难间的灯光指示标识。
    interpret: 避难间八条：①净面积满足所在区域设计避难人数；②兼作他用时要保证安全避难；③靠近疏散楼梯间，不得设在可燃物库房、锅炉房、发电机房、变配电站等火灾危险性大的场所正下方、正上方或贴邻；④用2.00h 防火隔墙加甲级防火门与其他部位分隔；⑤防烟气进入积聚并设可开启外窗，除外窗和疏散门外不设其他开口；⑥不得敷设或穿过可燃液体、可燃或助燃气体管道；⑦设消防软管卷盘、灭火器、消防专线电话和应急广播；⑧入口明显位置设灯光指示标识。
    severity_hint: error
    keywords:
      - 2.00h
  - clause_id: GB55037-2022/7.1.17
    chapter: 7.1 一般规定
    verbatim: |-
      汽车库或修车库的室内疏散楼梯应符合下列规定：
      1 建筑高度大于32 的高层汽车库，应为防烟楼梯间；
      2 建筑高度不大于32m 的汽车库，应为封闭楼梯间：
      3 地上修车库，应为封闭楼梯间；
      4 地下、半地下汽车库，应符合本规范第7.1.10 条的规定。
    interpret: 汽车库与修车库的室内疏散楼梯：建筑高度大于32m 的高层汽车库为防烟楼梯间；不大于32m 的汽车库为封闭楼梯间；地上修车库为封闭楼梯间；地下、半地下汽车库按7.1.10执行。
    severity_hint: error
    keywords:
      - 32m
  - clause_id: GB55037-2022/7.1.18
    chapter: 7.1 一般规定
    verbatim: |-
      汽车库内任一点至最近人员安全出口的疏散距离应符合下列规定：
      1 单层汽车库、位于建筑首层的汽车库，无论汽车库是否设置自动灭火系统，均不应大于60m。
      2 其他汽车库，未设置自动灭火系统时，不应大于45m；设置自动灭火系统时，不应大于60m。
    interpret: 汽车库内任一点到最近人员安全出口的疏散距离：单层汽车库与设在建筑首层的汽车库，无论是否设自动灭火系统，均不大于60m；其他汽车库未设自动灭火系统时不大于45m，设自动灭火系统时不大于60m。
    severity_hint: error
    keywords:
      - 60m
      - 45m
  - clause_id: GB55037-2022/7.2.1
    chapter: 7.2 工业建筑
    verbatim: |-
      厂房中符合下列条件的每个防火分区或一个防火分区的每个楼层，安全出口不应少于2 个：
      1 甲类地上生产场所，一个防火分区或楼层的建筑面积大于100m²或同一时间的使用人数大于5 人；
      2 乙类地上生产场所，一个防火分区或楼层的建筑面积大于150m²或同一时间的使用人数大于10 人；
      3 丙类地上生产场所，一个防火分区或楼层的建筑面积大于250m²或同一时间的使用人数大于20 人；
      4 丁、戊类地上生产场所，一个防火分区或楼层的建筑面积大于400m²或同一时间的使用人数大于30 人；
      5 丙类地下或半地下生产场所，一个防火分区或楼层的建筑面积大于50m²或同一时间的使用人数大于15 人；
      6 丁、戊类地下或半地下生产场所，一个防火分区或楼层的建筑面积大于200m²或同一时间的使用人数大于15 人。
    interpret: 厂房每个防火分区或每层安全出口不少于2个的六个门槛（满足其一）：甲类地上，面积大于100m² 或同时使用人数大于5人；乙类地上，大于150m² 或大于10人；丙类地上，大于250m² 或大于20人；丁戊类地上，大于400m² 或大于30人；丙类地下半地下，大于50m² 或大于15人；丁戊类地下半地下，大于200m² 或大于15人。
    severity_hint: error
    keywords:
      - 工业建筑
      - 2个
      - 100m²
      - 5人
      - 150m²
      - 10人
      - 250m²
      - 20人
  - clause_id: GB55037-2022/7.2.2
    chapter: 7.2 工业建筑
    verbatim: 高层厂房和甲、乙、丙类多层厂房的疏散楼梯应为封闭楼梯间或室外楼梯。建筑高度大于32m 且任一层使用人数大于10 人的厂房，疏散楼梯应为防烟楼梯间或室外楼梯。
    interpret: 高层厂房和甲、乙、丙类多层厂房的疏散楼梯，应为封闭楼梯间或室外楼梯。建筑高度大于32m 且任一层使用人数大于10人的厂房，疏散楼梯应为防烟楼梯间或室外楼梯。
    severity_hint: error
    keywords:
      - 工业建筑
      - 32m
      - 10人
  - clause_id: GB55037-2022/7.2.3
    chapter: 7.2 工业建筑
    verbatim: 占地面积大于300m²的地上仓库，安全出口不应少于2 个；建筑面积大于100m²的地下或半地下仓库，安全出口不应少于2 个。仓库内每个建筑面积大于100m²的房间的疏散出口不应少于2 个。
    interpret: 占地面积大于300m² 的地上仓库，安全出口不少于2个；建筑面积大于100m² 的地下或半地下仓库，安全出口不少于2个；仓库内每个建筑面积大于100m² 的房间，疏散出口不少于2个。
    severity_hint: error
    keywords:
