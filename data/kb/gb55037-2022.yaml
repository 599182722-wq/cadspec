    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: |-
      下列公共建筑的室内疏散楼梯应为防烟楼梯间：
      1 一类高层公共建筑；
      2 建筑高度大于32m 的二类高层公共建筑。
    interpret: 应为防烟楼梯间的两类公共建筑：一类高层公共建筑；建筑高度大于32m 的二类高层公共建筑。
    severity_hint: error
