  - clause_id: GB55037-2022/7.4.5
    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: |-
      下列公共建筑中与敞开式外廊不直接连通的室内疏散楼梯均应为封闭楼梯间：
      1 建筑高度不大于32m 的二类高层公共建筑；
      2 多层医疗建筑、旅馆建筑、老年人照料设施及类似使用功能的建筑；
      3 设置歌舞娱乐放映游艺场所的多层建筑；
      4 多层商店建筑、图书馆、展览建筑、会议中心及类似使用功能的建筑；
      5 6 层及6 层以上的其他多层公共建筑。
    interpret: 与敞开式外廊不直接连通的室内疏散楼梯应为封闭楼梯间的五类公共建筑：高度不大于32m 的二类高层公共建筑；多层医疗建筑、旅馆建筑、老年人照料设施及类似功能建筑；设歌舞娱乐放映游艺场所的多层建筑；多层商店建筑、图书馆、展览建筑、会议中心及类似功能建筑；6层及6层以上的其他多层公共建筑。
    severity_hint: error
    keywords:
      - 公共建筑和非住宅类居住建筑
      - 32m
      - 6层
  - clause_id: GB55037-2022/7.4.6
    chapter: 7.4 公共建筑和非住宅类居住建筑
    verbatim: 剧场、电影院、礼堂和体育馆的观众厅或多功能厅的疏散门不应少于2个，且每个疏散门的平均疏散人数不应大于250 人；当容纳人数大于2000 人时，其超过2000 人的部分，每个疏散门的平均疏散人数不应大于400 人。
